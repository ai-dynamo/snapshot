[project]
name = "snapshot-e2e"
version = "0.0.0"
description = "Snapshot end-to-end infrastructure helpers"
requires-python = ">=3.12"
dependencies = [
  "kubernetes>=32.0.1,<33.0.0",
  "packaging>=24.2,<26",
  "pytest>=8.4.0,<9",
  "PyYAML>=6.0.2,<7",
]

[tool.pytest.ini_options]
markers = [
  "environment: checks that a prepared Snapshot e2e target is usable",
  "snapshot_success: functional snapshot/restore success checks",
  "snapshot_failure: functional snapshot/restore failure checks",
  "gpu: tests that require a GPU workload",
  "workload: cluster-free checks of the workload scripts themselves",
]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
