run:
  timeout: 10m
  allow-parallel-runners: true

issues:
  exclude-rules:
    # Operator internals: relax style/complexity linters on the faithfully
    # migrated pod-shaping and reconciler code. Correctness linters stay enabled.
    - path: "internal/"
      linters:
        - dupl
        - lll
        - gocyclo
        - prealloc
        - unparam
        - goconst
    # CLI code (snapshotctl) carries long flag/usage/error strings.
    - path: "cmd/"
      linters:
        - lll
    # Table-driven tests legitimately repeat literals and run long.
    - path: "_test\\.go"
      linters:
        - dupl
        - goconst
        - gocyclo
        - prealloc
        - unparam
    # controller-runtime v0.24 deprecates GetEventRecorderFor; migrating the
    # manager to GetEventRecorder is a separate, behavior-preserving change.
    - linters:
        - staticcheck
      text: "SA1019:.*GetEventRecorderFor.*deprecated"

linters:
  disable-all: true
  enable:
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - staticcheck
    - typecheck
    - unconvert
    - unparam
    - unused
