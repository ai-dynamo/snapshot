apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-densenet-onnx-source
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: triton-densenet-onnx-source
  template:
    metadata:
      labels:
        app: triton-densenet-onnx-source
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector:
        nvidia.com/gpu.present: "true"
      initContainers:
        - name: model-cache
          image: nvcr.io/nvidia/tritonserver:26.04-py3@sha256:2c124f26e386c1c817b6b4fdbcca4033145b8bb4510f36755cde749684e533df
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
          args:
            - |
              import os
              import sys
              import urllib.request
              url, model_dir, config = sys.argv[1:]
              model = os.path.join(model_dir, "1", "model.onnx")
              os.makedirs(os.path.dirname(model), exist_ok=True)
              if not os.path.exists(model):
                  urllib.request.urlretrieve(url, model + ".part")
                  os.replace(model + ".part", model)
              with open(os.path.join(model_dir, "config.pbtxt"), "w") as f:
                  f.write(config)
            - https://huggingface.co/onnxmodelzoo/densenet-7/resolve/3cfc26acaec3b719b772ae4b4b4784dd88c2a414/densenet-7.onnx
            - /models/triton/densenet_onnx
            - |
              model_warmup [
                {
                  name: "zeros"
                  batch_size: 1
                  inputs {
                    key: "data_0"
                    value {
                      data_type: TYPE_FP32
                      dims: [ 1, 3, 224, 224 ]
                      zero_data: true
                    }
                  }
                }
              ]
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: main
          image: nvcr.io/nvidia/tritonserver:26.04-py3@sha256:2c124f26e386c1c817b6b4fdbcca4033145b8bb4510f36755cde749684e533df
          imagePullPolicy: IfNotPresent
          command:
            - tritonserver
          args:
            - --model-repository=/models/triton
            - --allow-gpu-metrics=false
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            periodSeconds: 1
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: main
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: snapshot-control
          emptyDir: {}
