apiVersion: nvidia.com/v1alpha1
kind: SnapshotJob
metadata:
  name: triton-densenet-onnx-snapshot
spec:
  activeDeadlineSeconds: 3600
  podSnapshotTemplate:
    targetContainers:
      - main
    containers:
      - name: main
        checkpointReadinessProbe:
          httpGet:
            path: /v2/health/ready
            port: http
  podTemplate:
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      initContainers:
        - name: model-cache
          image: nvcr.io/nvidia/tritonserver:26.04-py3@sha256:6fff5c059ae548ad369f1dad2470522274f58f481858c5a4755e998357358f29
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
          args:
            - |
              import os
              import sys
              import urllib.request
              url, model_dir, config = sys.argv[1:]
              model = os.path.join(model_dir, "1", "model.onnx")
              os.makedirs(os.path.dirname(model), exist_ok=True)
              if not os.path.exists(model):
                  urllib.request.urlretrieve(url, model + ".part")
                  os.replace(model + ".part", model)
              with open(os.path.join(model_dir, "config.pbtxt"), "w") as f:
                  f.write(config)
            - https://huggingface.co/onnxmodelzoo/densenet-7/resolve/3cfc26acaec3b719b772ae4b4b4784dd88c2a414/densenet-7.onnx
            - /models/triton/densenet_onnx
            - |
              model_warmup [
                {
                  name: "zeros"
                  batch_size: 1
                  inputs {
                    key: "data_0"
                    value {
                      data_type: TYPE_FP32
                      dims: [ 1, 3, 224, 224 ]
                      zero_data: true
                    }
                  }
                }
              ]
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: main
          image: nvcr.io/nvidia/tritonserver:26.04-py3@sha256:6fff5c059ae548ad369f1dad2470522274f58f481858c5a4755e998357358f29
          imagePullPolicy: IfNotPresent
          command:
            - tritonserver
          args:
            - --model-repository=/models/triton
            - --allow-gpu-metrics=false
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
