apiVersion: v1
kind: Pod
metadata:
  name: ${RESTORE_POD}
  namespace: ${NAMESPACE}
  annotations:
    nvidia.com/restore-from: ${SOURCE_POD}-snapshot
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/block-iouring.json
  containers:
  - name: ${CONTAINER}
    image: ${VLLM_IMAGE}
    imagePullPolicy: IfNotPresent
    command: ["/bin/bash", "-lc", "sleep infinity"]
    env:
    - name: SNAPSHOT_CONTROL_DIR
      value: /snapshot-control
    resources:
      limits:
        nvidia.com/gpu: "1"
    startupProbe:
      exec:
        command:
        - cat
        - /snapshot-control/restore-complete
      periodSeconds: 1
      failureThreshold: 1200
    readinessProbe:
      exec:
        command:
        - cat
        - /snapshot-control/vllm-restore-ready
      periodSeconds: 1
      failureThreshold: 1200
    volumeMounts:
    - name: snapshot-control
      mountPath: /snapshot-control
    - name: tun
      mountPath: /dev/net/tun
  volumes:
  - name: snapshot-control
    emptyDir: {}
  - name: tun
    hostPath:
      path: /dev/net/tun
      type: CharDevice
