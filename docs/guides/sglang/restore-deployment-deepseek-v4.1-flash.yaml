apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-deepseek-v4.1-flash-restored
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: sglang-deepseek-v4.1-flash-restored}
  template:
    metadata:
      labels: {app: sglang-deepseek-v4.1-flash-restored}
      annotations: {nvidia.com/restore-from: sglang-deepseek-v4.1-flash-snapshot}
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector: {nvidia.com/gpu.product: NVIDIA-B200}
      initContainers:
        - name: model-cache
          image: lmsysorg/sglang:v0.5.21@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469
          imagePullPolicy: IfNotPresent
          command: [python3, -c]
          args:
            - |
              import os
              from huggingface_hub import snapshot_download
              snapshot_download(
                  repo_id=os.environ["SNAPSHOT_MODEL"],
                  revision=os.environ["SNAPSHOT_MODEL_REVISION"],
              )
          env:
            - {name: SNAPSHOT_MODEL, value: deepseek-ai/DeepSeek-V4.1-Flash}
            - {name: SNAPSHOT_MODEL_REVISION, value: 2cba9e42aa026125f3ed06c6d98c1db82f7ca027}
            - {name: HF_HOME, value: /hf-cache}
            - {name: HF_HUB_DISABLE_XET, value: "1"}
          volumeMounts:
            - {name: model-cache, mountPath: /hf-cache}
      containers:
        - name: main
          image: lmsysorg/sglang:v0.5.21@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469
          imagePullPolicy: IfNotPresent
          # The agent restores the saved process into this inert container.
          command: [/bin/sh, -c, exec sleep infinity]
          env:
            - {name: SNAPSHOT_TENSOR_PARALLEL_SIZE, value: "4"}
            - {name: SNAPSHOT_MODEL, value: deepseek-ai/DeepSeek-V4.1-Flash}
            - name: SGLANG_ENGINE_ARGS
              value: |-
                {
                  "revision": "2cba9e42aa026125f3ed06c6d98c1db82f7ca027",
                  "trust_remote_code": true, "ep_size": 4, "page_size": 256,
                  "context_length": 131072, "max_running_requests": 64, "mem_fraction_static": 0.8,
                  "speculative_algorithm": "DSPARK", "speculative_dspark_block_size": 5,
                  "cuda_graph_max_bs_decode": 64, "chunked_prefill_size": 4096
                }
            - {name: SNAPSHOT_MODEL_REVISION, value: 2cba9e42aa026125f3ed06c6d98c1db82f7ca027}
            - {name: HF_HOME, value: /hf-cache}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: HF_HUB_DISABLE_XET, value: "1"}
            - {name: NCCL_IB_DISABLE, value: "1"}
            - {name: NCCL_RAS_ENABLE, value: "0"}
            - {name: TORCH_NCCL_ENABLE_MONITORING, value: "0"}
            - {name: TORCH_NCCL_DUMP_ON_TIMEOUT, value: "0"}
          ports:
            - {name: api, containerPort: 8000}
          resources:
            requests: {cpu: "16", memory: 1Ti}
            limits: {memory: 1Ti, nvidia.com/gpu: "4"}
          readinessProbe:
            exec:
              command: [cat, /snapshot-control/sglang-restore-ready]
            periodSeconds: 1
            failureThreshold: 3600
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: model-cache, mountPath: /hf-cache}
            - {name: snapshot-control, mountPath: /snapshot-control, subPath: main}
            - {name: tun, mountPath: /dev/net/tun}
            - {name: app, mountPath: /snapshot-app, readOnly: true}
      volumes:
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 64Gi}}
        - {name: model-cache, persistentVolumeClaim: {claimName: snapshot-model-cache}}
        - {name: snapshot-control, emptyDir: {}}
        - {name: tun, hostPath: {path: /dev/net/tun, type: CharDevice}}
        - {name: app, configMap: {name: sglang-app}}
