apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sglang-source
  template:
    metadata:
      annotations:
        nvidia.com/cuda-shared-memory-support: "enabled"
      labels:
        app: sglang-source
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector:
        nvidia.com/gpu.present: "true"
      initContainers:
        - name: snapshot-cuda-install
          image: ${SNAPSHOT_AGENT_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/bin/cp"]
          args:
            - --preserve=mode
            - --
            - /usr/local/lib/snapshot/libcuinterpose.so
            - /usr/local/lib/snapshot/libcuinterpose_core.so
            - /usr/local/bin/cuinterpose-launch
            - /tmp/snapshot-cuda/
          volumeMounts:
            - name: snapshot-cuda
              mountPath: /tmp/snapshot-cuda
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
        - name: model-cache
          image: lmsysorg/sglang:v0.5.17-cu130-runtime@sha256:3ea7c6d74312d964edbcf9b3819425ea42117eb967ef1cfec632a70c926027df
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
          args:
            - |
              import os
              from pathlib import Path
              from huggingface_hub import snapshot_download
              model = os.environ["SNAPSHOT_MODEL"]
              marker = Path("/hf-cache") / (".snapshot-model-" + model.replace("/", "--"))
              if not marker.exists():
                  snapshot_download(repo_id=model)
                  marker.touch()
          env:
            - name: SNAPSHOT_MODEL
              value: Qwen/Qwen3-0.6B
            - name: HF_HOME
              value: /hf-cache
            - name: HF_HUB_DISABLE_XET
              value: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /hf-cache
      containers:
        - name: main
          image: lmsysorg/sglang:v0.5.17-cu130-runtime@sha256:3ea7c6d74312d964edbcf9b3819425ea42117eb967ef1cfec632a70c926027df
          imagePullPolicy: IfNotPresent
          command:
            - /tmp/snapshot-cuda/cuinterpose-launch
            - --library
            - /tmp/snapshot-cuda/libcuinterpose.so
            - --
            - python3
            - -u
            - /snapshot-app/app.py
          args:
            - --mode
            - snapshot
          env:
            - name: SNAPSHOT_TENSOR_PARALLEL_SIZE
              value: "1"
            - name: SNAPSHOT_MODEL
              value: Qwen/Qwen3-0.6B
            - name: SGLANG_CONTEXT_LENGTH
              value: "10240"
            - name: SGLANG_PAGE_SIZE
              value: "16"
            - name: SNAPSHOT_CONTROL_DIR
              value: /snapshot-control
            - name: HF_HOME
              value: /hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: NCCL_IB_DISABLE
              value: "1"
            - name: NCCL_RAS_ENABLE
              value: "0"
            - name: TORCH_NCCL_ENABLE_MONITORING
              value: "0"
            - name: TORCH_NCCL_DUMP_ON_TIMEOUT
              value: "0"
          ports:
            - name: api
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            exec:
              command:
                - cat
                - /snapshot-control/ready-for-snapshot
            periodSeconds: 1
            failureThreshold: 1800
          volumeMounts:
            - name: snapshot-cuda
              mountPath: /tmp/snapshot-cuda
              readOnly: true
            - name: model-cache
              mountPath: /hf-cache
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: main
            - name: tun
              mountPath: /dev/net/tun
            - name: app
              mountPath: /snapshot-app
              readOnly: true
      volumes:
        - name: snapshot-cuda
          emptyDir: {}
        - name: model-cache
          persistentVolumeClaim:
            claimName: sglang-model-cache
        - name: snapshot-control
          emptyDir: {}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        # Created from app.py: kubectl create configmap sglang-app --from-file=app.py
        - name: app
          configMap:
            name: sglang-app
