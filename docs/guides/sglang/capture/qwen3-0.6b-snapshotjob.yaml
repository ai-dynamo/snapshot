apiVersion: nvidia.com/v1alpha1
kind: SnapshotJob
metadata:
  name: sglang-snapshot
spec:
  podSnapshotTemplate:
    targetContainers:
      - main
  podTemplate:
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      initContainers:
        - name: model-cache
          image: lmsysorg/sglang:v0.5.21@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
          args:
            - |
              import os
              from huggingface_hub import snapshot_download
              snapshot_download(repo_id=os.environ["SNAPSHOT_MODEL"])
          env:
            - name: SNAPSHOT_MODEL
              value: Qwen/Qwen3-0.6B
            - name: HF_HOME
              value: /hf-cache
            - name: HF_HUB_DISABLE_XET
              value: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /hf-cache
      containers:
        - name: main
          image: lmsysorg/sglang:v0.5.21@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -u
            - /snapshot-app/app.py
          args:
            - --mode
            - snapshot
          env:
            - name: SNAPSHOT_MODEL
              value: Qwen/Qwen3-0.6B
            - name: SGLANG_CONTEXT_LENGTH
              value: "10240"
            - name: SGLANG_PAGE_SIZE
              value: "16"
            - name: HF_HOME
              value: /hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: NCCL_IB_DISABLE
              value: "1"
            - name: NCCL_RAS_ENABLE
              value: "0"
            - name: TORCH_NCCL_ENABLE_MONITORING
              value: "0"
            - name: TORCH_NCCL_DUMP_ON_TIMEOUT
              value: "0"
            # Keep compiler artifacts on the PVC mounted at /compile-cache.
            - name: XDG_CACHE_HOME
              value: /compile-cache/xdg
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /compile-cache/torchinductor
            - name: TRITON_CACHE_DIR
              value: /compile-cache/triton
            - name: CUDA_CACHE_PATH
              value: /compile-cache/cuda
            - name: DG_JIT_CACHE_DIR
              value: /compile-cache/deepgemm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /compile-cache/flashinfer
            - name: TORCH_EXTENSIONS_DIR
              value: /compile-cache/torch-extensions
            - name: SGLANG_CACHE_DIR
              value: /compile-cache/sglang
            - name: SGLANG_JIT_CACHE_DIR
              value: /compile-cache/sglang-jit
          ports:
            - name: api
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /hf-cache
            - name: shm
              mountPath: /dev/shm
            - name: app
              mountPath: /snapshot-app
              readOnly: true
            - name: compiler-cache
              mountPath: /compile-cache
              subPath: compiler-cache/sglang
            - name: compiler-cache
              mountPath: /root/.cache/flashinfer
              subPath: compiler-cache/sglang/flashinfer-fixed
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: sglang-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: app
          configMap:
            name: sglang-app
        - name: compiler-cache
          persistentVolumeClaim:
            claimName: snapshot-compiler-cache
