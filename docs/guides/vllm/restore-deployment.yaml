apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-restored
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-restored
  template:
    metadata:
      labels:
        app: vllm-restored
      annotations:
        nvidia.com/restore-from: vllm-snapshot
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: main
          image: vllm-snapshot:replace-me
          imagePullPolicy: Always
          # Inert placeholder: the agent restores the checkpointed process into
          # this container, so app.py must not run here.
          command:
            - /bin/sh
            - -c
            - exec sleep infinity
          # SYS_PTRACE: lets py-spy attach to sibling processes in this
          # container for post-restore diagnostics (see e2e debug_dump_framework).
          securityContext:
            capabilities:
              add: ["SYS_PTRACE"]
          env:
            - name: SNAPSHOT_MODEL
              value: Qwen/Qwen3-0.6B
            # See deployment.yaml: matches the source container's env so a
            # restarted placeholder (pre-restore) behaves identically; the
            # actual restored process's environment comes from the checkpoint.
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            - name: SNAPSHOT_CONTROL_DIR
              value: /snapshot-control
          ports:
            - name: api
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            exec:
              command:
                - cat
                - /snapshot-control/vllm-restore-ready
            periodSeconds: 1
            failureThreshold: 1200
          volumeMounts:
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: main
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: snapshot-control
          emptyDir: {}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
