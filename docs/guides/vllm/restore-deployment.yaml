apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-restored
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-restored
  template:
    metadata:
      labels:
        app: vllm-restored
      annotations:
        nvidia.com/restore-from: vllm-snapshot
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: main
          image: vllm/vllm-openai:v0.27.1-ubuntu2404@sha256:6a278041c910af1a6db0f3555aac30dbdf93d7acb01008656d99007cf7781a3a
          imagePullPolicy: IfNotPresent
          # The source's command. Snapshot replaces it with its restore proxy,
          # which waits for the restore and then follows the restored process.
          command:
            - python3
            - /snapshot-app/app.py
          env:
            - name: SNAPSHOT_MODEL
              value: Qwen/Qwen3-0.6B
            - name: SNAPSHOT_CONTROL_DIR
              value: /snapshot-control
          ports:
            - name: api
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            exec:
              command:
                - cat
                - /snapshot-control/vllm-restore-ready
            periodSeconds: 1
            failureThreshold: 1200
          volumeMounts:
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: main
            - name: tun
              mountPath: /dev/net/tun
            # The checkpointed process's mount namespace includes this
            # mount (from the source Pod); restore recreates it here too,
            # even though this container's own command never runs.
            - name: app
              mountPath: /snapshot-app
              readOnly: true
      volumes:
        - name: snapshot-control
          emptyDir: {}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: app
          configMap:
            name: vllm-app
