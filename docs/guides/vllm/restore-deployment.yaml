apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-restored
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-restored
  template:
    metadata:
      labels:
        app: vllm-restored
      annotations:
        nvidia.com/restore-from: vllm-snapshot
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: main
          image: vllm/vllm-openai:v0.31.0-ubuntu2404@sha256:3fb023cc987cc7c2bca7ca14c1e0aff5ae06bd9431bf07773731ce7e8a682460
          imagePullPolicy: IfNotPresent
          # Inert placeholder: the agent restores the checkpointed process into
          # this container, so app.py must not run here.
          command:
            - /bin/sh
            - -c
            - exec sleep infinity
          env:
            - name: SNAPSHOT_MODEL
              value: Qwen/Qwen3-0.6B
            - name: SNAPSHOT_CONTROL_DIR
              value: /snapshot-control
          ports:
            - name: api
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            exec:
              command:
                - cat
                - /snapshot-control/vllm-restore-ready
            periodSeconds: 1
            failureThreshold: 1200
          volumeMounts:
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: main
            - name: tun
              mountPath: /dev/net/tun
            - name: shm
              mountPath: /dev/shm
            # The checkpointed process's mount namespace includes this
            # mount (from the source Pod); restore recreates it here too,
            # even though this placeholder's own command never reads it.
            - name: app
              mountPath: /snapshot-app
              readOnly: true
      volumes:
        - name: snapshot-control
          emptyDir: {}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: app
          configMap:
            name: vllm-app
