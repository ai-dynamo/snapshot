apiVersion: nvidia.com/v1alpha1
kind: SnapshotJob
metadata:
  name: vllm-glm-5-3-snapshot
spec:
  activeDeadlineSeconds: 7200
  podSnapshotTemplate:
    targetContainers:
      - main
  podTemplate:
    metadata:
      annotations:
        nvidia.com/cuda-shared-memory-support: enabled
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      initContainers:
        - name: model-cache
          image: vllm/vllm-openai:v0.31.0-ubuntu2404@sha256:3fb023cc987cc7c2bca7ca14c1e0aff5ae06bd9431bf07773731ce7e8a682460
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
          args:
            - |
              import os
              from huggingface_hub import snapshot_download
              snapshot_download(
                  repo_id=os.environ["SNAPSHOT_MODEL"],
                  revision=os.environ["SNAPSHOT_MODEL_REVISION"],
              )
          env:
            - name: SNAPSHOT_MODEL
              value: RadixArk/GLM-5.3-NVFP4
            - name: SNAPSHOT_MODEL_REVISION
              value: 363e8f086905afd83db356a620f9aa401c23800a
            - name: HF_HOME
              value: /hf-cache
            - name: HF_HUB_DISABLE_XET
              value: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /hf-cache
      containers:
        - name: main
          image: vllm/vllm-openai:v0.31.0-ubuntu2404@sha256:3fb023cc987cc7c2bca7ca14c1e0aff5ae06bd9431bf07773731ce7e8a682460
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /snapshot-app/app.py
          env:
            # Avoid rounding up large pinned backups or retaining them after wake-up.
            - name: PYTORCH_ALLOC_CONF
              value: pinned_max_round_threshold_mb:1,pinned_max_cached_size_mb:1
            - name: SNAPSHOT_TENSOR_PARALLEL_SIZE
              value: "8"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: SNAPSHOT_MODEL
              value: RadixArk/GLM-5.3-NVFP4
            - name: VLLM_ENGINE_ARGS
              value: |-
                {
                  "revision": "363e8f086905afd83db356a620f9aa401c23800a",
                  "dtype": "bfloat16", "quantization": "modelopt_fp4", "enable_expert_parallel": true,
                  "kv_cache_dtype": "fp8", "max_model_len": 131072, "gpu_memory_utilization": 0.85,
                  "max_num_seqs": 32, "max_num_batched_tokens": 8192,
                  "speculative_config": {
                    "revision": "363e8f086905afd83db356a620f9aa401c23800a",
                    "method": "mtp", "num_speculative_tokens": 5
                  }
                }
            - name: SNAPSHOT_MODEL_REVISION
              value: 363e8f086905afd83db356a620f9aa401c23800a
            - name: HF_HOME
              value: /hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            # Keep compiler artifacts on the PVC mounted at /compile-cache.
            - name: XDG_CACHE_HOME
              value: /compile-cache/xdg
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /compile-cache/torchinductor
            - name: TRITON_CACHE_DIR
              value: /compile-cache/triton
            - name: CUDA_CACHE_PATH
              value: /compile-cache/cuda
            - name: DG_JIT_CACHE_DIR
              value: /compile-cache/deepgemm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /compile-cache/flashinfer
            - name: VLLM_CACHE_ROOT
              value: /compile-cache/vllm
            - name: VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR
              value: /compile-cache/vllm/flashinfer_autotune
            - name: TILELANG_CACHE_DIR
              value: /compile-cache/tilelang
          ports:
            - name: api
              containerPort: 8000
          resources:
            requests:
              cpu: "16"
              memory: 1Ti
            limits:
              memory: 1Ti
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /hf-cache
            - name: app
              mountPath: /snapshot-app
              readOnly: true
            - name: compiler-cache
              mountPath: /compile-cache
              subPath: compiler-cache/vllm
            - name: compiler-cache
              mountPath: /root/.cache/flashinfer
              subPath: compiler-cache/vllm/flashinfer-fixed
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: snapshot-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: app
          configMap:
            name: vllm-app
        - name: compiler-cache
          persistentVolumeClaim:
            claimName: snapshot-compiler-cache
