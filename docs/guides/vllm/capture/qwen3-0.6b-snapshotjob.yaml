apiVersion: nvidia.com/v1alpha1
kind: SnapshotJob
metadata:
  name: vllm-qwen3-0-6b-snapshot
spec:
  activeDeadlineSeconds: 3600
  podSnapshotTemplate:
    targetContainers:
      - main
  podTemplate:
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      initContainers:
        - name: model-cache
          image: vllm/vllm-openai:v0.31.0-ubuntu2404@sha256:3fb023cc987cc7c2bca7ca14c1e0aff5ae06bd9431bf07773731ce7e8a682460
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
          args:
            - |
              import sys
              from huggingface_hub import snapshot_download
              snapshot_download(repo_id=sys.argv[1])
            - Qwen/Qwen3-0.6B
          env:
            - name: HF_HOME
              value: /hf-cache
            - name: HF_HUB_DISABLE_XET
              value: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /hf-cache
      containers:
        - name: main
          image: vllm/vllm-openai:v0.31.0-ubuntu2404@sha256:3fb023cc987cc7c2bca7ca14c1e0aff5ae06bd9431bf07773731ce7e8a682460
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /snapshot-app/app.py
          args:
            - '{"model": "Qwen/Qwen3-0.6B"}'
          env:
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HF_HOME
              value: /hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: VLLM_MAX_MODEL_LEN
              value: "2048"
            - name: VLLM_GPU_MEMORY_UTILIZATION
              value: "0.30"
          ports:
            - name: api
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /hf-cache
            - name: shm
              mountPath: /dev/shm
            - name: app
              mountPath: /snapshot-app
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: app
          configMap:
            name: vllm-app
