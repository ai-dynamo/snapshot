apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-deepseek-v4.1-flash-restored
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: vllm-deepseek-v4.1-flash-restored}
  template:
    metadata:
      labels: {app: vllm-deepseek-v4.1-flash-restored}
      annotations: {nvidia.com/restore-from: vllm-deepseek-v4.1-flash-snapshot}
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector: {nvidia.com/gpu.product: NVIDIA-B200}
      initContainers:
        - name: model-cache
          image: vllm/vllm-openai:v0.31.0-ubuntu2404@sha256:3fb023cc987cc7c2bca7ca14c1e0aff5ae06bd9431bf07773731ce7e8a682460
          imagePullPolicy: IfNotPresent
          command: [python3, -c]
          args:
            - |
              import os
              from huggingface_hub import snapshot_download
              snapshot_download(
                  repo_id=os.environ["SNAPSHOT_MODEL"],
                  revision=os.environ["SNAPSHOT_MODEL_REVISION"],
              )
          env:
            - {name: SNAPSHOT_MODEL, value: deepseek-ai/DeepSeek-V4.1-Flash}
            - {name: SNAPSHOT_MODEL_REVISION, value: 2cba9e42aa026125f3ed06c6d98c1db82f7ca027}
            - {name: HF_HOME, value: /hf-cache}
            - {name: HF_HUB_DISABLE_XET, value: "1"}
          volumeMounts:
            - {name: model-cache, mountPath: /hf-cache}
      containers:
        - name: main
          image: vllm/vllm-openai:v0.31.0-ubuntu2404@sha256:3fb023cc987cc7c2bca7ca14c1e0aff5ae06bd9431bf07773731ce7e8a682460
          imagePullPolicy: IfNotPresent
          # The agent restores the saved process into this inert container.
          command: [/bin/sh, -c, exec sleep infinity]
          env:
            - {name: SNAPSHOT_CONTROL_DIR, value: /snapshot-control}
            - {name: SNAPSHOT_TENSOR_PARALLEL_SIZE, value: "8"}
            - {name: SNAPSHOT_MODEL, value: deepseek-ai/DeepSeek-V4.1-Flash}
            - {name: SNAPSHOT_MODEL_REVISION, value: 2cba9e42aa026125f3ed06c6d98c1db82f7ca027}
            - {name: HF_HOME, value: /hf-cache}
            - {name: HF_HUB_OFFLINE, value: "1"}
          ports:
            - {name: api, containerPort: 8000}
          resources:
            requests: {cpu: "16", memory: 1Ti}
            limits: {memory: 1Ti, nvidia.com/gpu: "8"}
          readinessProbe:
            exec:
              command: [cat, /snapshot-control/vllm-restore-ready]
            periodSeconds: 1
            failureThreshold: 3600
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: model-cache, mountPath: /hf-cache}
            - {name: snapshot-control, mountPath: /snapshot-control, subPath: main}
            - {name: tun, mountPath: /dev/net/tun}
            - {name: app, mountPath: /snapshot-app, readOnly: true}
      volumes:
        - {name: model-cache, persistentVolumeClaim: {claimName: snapshot-model-cache}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 64Gi}}
        - {name: snapshot-control, emptyDir: {}}
        - {name: tun, hostPath: {path: /dev/net/tun, type: CharDevice}}
        - {name: app, configMap: {name: vllm-app}}
