apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-1gpu-restored
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-1gpu-restored
  template:
    metadata:
      labels:
        app: vllm-1gpu-restored
      annotations:
        nvidia.com/restore-from: ${SNAPSHOT_NAME}
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: main
          image: vllm/vllm-openai:v0.31.0-ubuntu2404@sha256:3fb023cc987cc7c2bca7ca14c1e0aff5ae06bd9431bf07773731ce7e8a682460
          imagePullPolicy: IfNotPresent
          # The source's command. Snapshot replaces it with its restore proxy,
          # which waits for the restore and then follows the restored process.
          command:
            - python3
            - /snapshot-app/app.py
          env:
            - name: SNAPSHOT_CONTROL_DIR
              value: /snapshot-control
          ports:
            - name: api
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            exec:
              command:
                - cat
                - /snapshot-control/vllm-restore-ready
            periodSeconds: 1
            failureThreshold: 1800
          volumeMounts:
            - name: model-cache
              mountPath: /hf-cache
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: main
            - name: shm
              mountPath: /dev/shm
            - name: app
              mountPath: /snapshot-app
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: snapshot-control
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: app
          configMap:
            name: vllm-app
