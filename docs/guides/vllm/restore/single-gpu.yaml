apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-restored
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-restored
  template:
    metadata:
      labels:
        app: vllm-restored
      annotations:
        nvidia.com/restore-from: vllm-snapshot
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: main
          image: vllm/vllm-openai:v0.31.0-ubuntu2404@sha256:3fb023cc987cc7c2bca7ca14c1e0aff5ae06bd9431bf07773731ce7e8a682460
          imagePullPolicy: IfNotPresent
          # The agent restores the saved process into this inert container.
          command:
            - /bin/sh
            - -c
            - exec sleep infinity
          env:
            - name: SNAPSHOT_CONTROL_DIR
              value: /snapshot-control
          ports:
            - name: api
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            exec:
              command:
                - cat
                - /snapshot-control/vllm-restore-ready
            periodSeconds: 1
            failureThreshold: 1200
          volumeMounts:
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: main
            - name: shm
              mountPath: /dev/shm
            - name: app
              mountPath: /snapshot-app
              readOnly: true
            - name: compiler-cache
              mountPath: /compile-cache
              subPath: compiler-cache/vllm
            - name: compiler-cache
              mountPath: /root/.cache/flashinfer
              subPath: compiler-cache/vllm/flashinfer-fixed
      volumes:
        - name: snapshot-control
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: app
          configMap:
            name: vllm-app
        - name: compiler-cache
          persistentVolumeClaim:
            claimName: snapshot-compiler-cache
