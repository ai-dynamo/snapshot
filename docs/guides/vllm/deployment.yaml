apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-source
  template:
    metadata:
      labels:
        app: vllm-source
        nvidia.com/snapshot-is-checkpoint-source: "true"
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: main
          image: vllm-snapshot:replace-me
          imagePullPolicy: Always
          # SYS_PTRACE: lets py-spy attach to sibling processes in this
          # container for failure diagnostics (see e2e debug_dump_framework).
          securityContext:
            capabilities:
              add: ["SYS_PTRACE"]
          env:
            - name: SNAPSHOT_MODEL
              value: Qwen/Qwen3-0.6B
            - name: VLLM_MAX_MODEL_LEN
              value: "2048"
            - name: VLLM_GPU_MEMORY_UTILIZATION
              value: "0.30"
            # app.py calls AsyncLLM directly rather than vLLM's CLI wrapper,
            # which sets this automatically when unset. Without it, worker
            # startup defaults to fork (or switches to spawn only if vLLM
            # detects CUDA already initialized), which is unreliable across
            # checkpoint/restore.
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            - name: SNAPSHOT_CONTROL_DIR
              value: /snapshot-control
          ports:
            - name: api
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            exec:
              command:
                - cat
                - /snapshot-control/ready-for-snapshot
            periodSeconds: 1
            failureThreshold: 1200
          volumeMounts:
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: main
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: snapshot-control
          emptyDir: {}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
