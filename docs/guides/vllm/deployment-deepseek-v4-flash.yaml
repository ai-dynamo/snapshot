# One-node DeepSeek V4 Flash NVFP4 example on 4 B200 GPUs.
# Engine kwargs below use a 128K context and bounded concurrency.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-deepseek-v4-flash-source
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-deepseek-v4-flash-source
  template:
    metadata:
      annotations:
        nvidia.com/cuda-shared-memory-support: "enabled"
      labels:
        app: vllm-deepseek-v4-flash-source
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      initContainers:
        - name: snapshot-cuda-install
          image: ${SNAPSHOT_AGENT_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/bin/cp"]
          args:
            - --preserve=mode
            - --
            - /usr/local/lib/snapshot/libcuinterpose.so
            - /usr/local/lib/snapshot/libcuinterpose_core.so
            - /usr/local/bin/cuinterpose-launch
            - /tmp/snapshot-cuda/
          volumeMounts:
            - name: snapshot-cuda
              mountPath: /tmp/snapshot-cuda
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
        - name: model-cache
          image: vllm/vllm-openai:v0.27.1-ubuntu2404@sha256:dafea057f24b7d42716331a48e2db4e1f204f877a3aa759cb7e4c37e64ca2eee
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
          args:
            - |
              import os
              from pathlib import Path
              from huggingface_hub import snapshot_download
              model = os.environ["SNAPSHOT_MODEL"]
              revision = os.environ["SNAPSHOT_MODEL_REVISION"]
              marker = Path("/hf-cache") / (".snapshot-model-" + model.replace("/", "--") + "-" + revision)
              if not marker.exists():
                  snapshot_download(repo_id=model, revision=revision)
                  marker.touch()
          env:
            - name: SNAPSHOT_MODEL
              value: nvidia/DeepSeek-V4-Flash-NVFP4
            - name: SNAPSHOT_MODEL_REVISION
              value: e3cd60e7de98e9867116860d522499a728de1cf9
            - name: HF_HOME
              value: /hf-cache
            - name: HF_HUB_DISABLE_XET
              value: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /hf-cache
      containers:
        - name: main
          image: vllm/vllm-openai:v0.27.1-ubuntu2404@sha256:dafea057f24b7d42716331a48e2db4e1f204f877a3aa759cb7e4c37e64ca2eee
          imagePullPolicy: IfNotPresent
          command:
            - /tmp/snapshot-cuda/cuinterpose-launch
            - --library
            - /tmp/snapshot-cuda/libcuinterpose.so
            - --
            - python3
            - /snapshot-app/app.py
          env:
            - name: SNAPSHOT_TENSOR_PARALLEL_SIZE
              value: "4"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: SNAPSHOT_MODEL
              value: nvidia/DeepSeek-V4-Flash-NVFP4
            - name: VLLM_ENGINE_ARGS
              value: |-
                {
                  "revision": "e3cd60e7de98e9867116860d522499a728de1cf9",
                  "tokenizer_revision": "e3cd60e7de98e9867116860d522499a728de1cf9",
                  "tokenizer_mode": "deepseek_v4",
                  "dtype": "auto",
                  "kv_cache_dtype": "fp8",
                  "block_size": 256,
                  "max_model_len": 131072,
                  "gpu_memory_utilization": 0.92,
                  "max_num_seqs": 64,
                  "max_num_batched_tokens": 16384,
                  "scheduler_reserve_full_isl": false,
                  "moe_backend": "flashinfer_trtllm",
                  "compilation_config": {
                    "cudagraph_mode": "FULL_AND_PIECEWISE",
                    "custom_ops": [
                      "all"
                    ]
                  },
                  "attention_config": {
                    "use_fp4_indexer_cache": true
                  }
                }
            - name: SNAPSHOT_MODEL_REVISION
              value: e3cd60e7de98e9867116860d522499a728de1cf9
            - name: HF_HOME
              value: /hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: SNAPSHOT_CONTROL_DIR
              value: /snapshot-control
          ports:
            - name: api
              containerPort: 8000
          resources:
            requests:
              cpu: "16"
              memory: 512Gi
            limits:
              memory: 512Gi
              nvidia.com/gpu: "4"
          readinessProbe:
            exec:
              command:
                - cat
                - /snapshot-control/ready-for-snapshot
            periodSeconds: 1
            failureThreshold: 3600
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /hf-cache
            - name: snapshot-cuda
              mountPath: /tmp/snapshot-cuda
              readOnly: true
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: main
            - name: tun
              mountPath: /dev/net/tun
            - name: app
              mountPath: /snapshot-app
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: snapshot-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: snapshot-cuda
          emptyDir: {}
        - name: snapshot-control
          emptyDir: {}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        # Created from app.py: kubectl create configmap vllm-app --from-file=app.py
        - name: app
          configMap:
            name: vllm-app
