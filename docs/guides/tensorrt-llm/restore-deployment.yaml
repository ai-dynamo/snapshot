apiVersion: apps/v1
kind: Deployment
metadata:
  name: tensorrt-llm-restored
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tensorrt-llm-restored
  template:
    metadata:
      labels:
        app: tensorrt-llm-restored
      annotations:
        nvidia.com/restore-from: tensorrt-llm-snapshot
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: main
          image: tensorrt-llm-snapshot:replace-me
          imagePullPolicy: Always
          env:
            - name: SNAPSHOT_MODEL
              value: Qwen/Qwen3-0.6B
            - name: SNAPSHOT_CONTROL_DIR
              value: /snapshot-control
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: TLLM_NCCL_SYMMETRIC_ZERO_COPY
              value: "0"
            - name: UCX_TLS
              value: tcp,self
          ports:
            - name: api
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            exec:
              command:
                - cat
                - /snapshot-control/ready-for-snapshot
            periodSeconds: 1
            failureThreshold: 1800
          volumeMounts:
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: main
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: snapshot-control
          emptyDir: {}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
