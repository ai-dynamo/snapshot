apiVersion: nvidia.com/v1alpha1
kind: SnapshotJob
metadata:
  name: tensorrt-llm-snapshot
spec:
  podSnapshotTemplate:
    targetContainers:
      - main
  podTemplate:
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: main
          image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc24@sha256:16a103b8b1b682d287e8043fc674d23fa52d5b5f2127da913bf6c0643db3a073
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /snapshot-app/app.py
          env:
            - name: SNAPSHOT_MODEL
              value: Qwen/Qwen3-0.6B
            - name: TRTLLM_MAX_NUM_TOKENS
              value: "1024"
            - name: TRTLLM_MAX_BATCH_SIZE
              value: "1"
            - name: TRTLLM_FREE_GPU_MEMORY_FRACTION
              value: "0.10"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: OMPI_MCA_pml
              value: ob1
            - name: OMPI_MCA_btl
              value: "tcp,self"
          ports:
            - name: api
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: shm
              mountPath: /dev/shm
            - name: app
              mountPath: /snapshot-app
              readOnly: true
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: app
          configMap:
            name: tensorrt-llm-app
