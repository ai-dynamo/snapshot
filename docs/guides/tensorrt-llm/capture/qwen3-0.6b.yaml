apiVersion: apps/v1
kind: Deployment
metadata:
  name: tensorrt-llm-source
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tensorrt-llm-source
  template:
    metadata:
      labels:
        app: tensorrt-llm-source
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: main
          image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc24@sha256:16a103b8b1b682d287e8043fc674d23fa52d5b5f2127da913bf6c0643db3a073
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /snapshot-app/app.py
          env:
            - name: SNAPSHOT_MODEL
              value: Qwen/Qwen3-0.6B
            - name: TRTLLM_MAX_NUM_TOKENS
              value: "1024"
            - name: TRTLLM_MAX_BATCH_SIZE
              value: "1"
            - name: TRTLLM_FREE_GPU_MEMORY_FRACTION
              value: "0.10"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: OMPI_MCA_pml
              value: ob1
            - name: OMPI_MCA_btl
              value: "tcp,self"
            # Keep compiler artifacts on the PVC mounted at /compile-cache.
            - name: XDG_CACHE_HOME
              value: /compile-cache/xdg
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /compile-cache/torchinductor
            - name: TRITON_CACHE_DIR
              value: /compile-cache/triton
            - name: CUDA_CACHE_PATH
              value: /compile-cache/cuda
            - name: DG_JIT_CACHE_DIR
              value: /compile-cache/deepgemm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /compile-cache/flashinfer
            - name: TORCH_EXTENSIONS_DIR
              value: /compile-cache/torch-extensions
          ports:
            - name: api
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            exec:
              command:
                - cat
                - /snapshot-control/ready-for-snapshot
            periodSeconds: 1
            failureThreshold: 1800
          volumeMounts:
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: main
            - name: shm
              mountPath: /dev/shm
            - name: app
              mountPath: /snapshot-app
              readOnly: true
            - name: compiler-cache
              mountPath: /compile-cache
              subPath: compiler-cache/tensorrt-llm
            - name: compiler-cache
              mountPath: /root/.cache/flashinfer
              subPath: compiler-cache/tensorrt-llm/flashinfer-fixed
            - name: compiler-cache
              mountPath: /tmp/torchinductor_root
              subPath: compiler-cache/tensorrt-llm/torchinductor-default
      volumes:
        - name: snapshot-control
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: app
          configMap:
            name: tensorrt-llm-app
        - name: compiler-cache
          persistentVolumeClaim:
            claimName: snapshot-compiler-cache
