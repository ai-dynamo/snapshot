apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-r1-restored
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker-r1-restored
  template:
    metadata:
      labels:
        app: worker-r1-restored
      annotations:
        nvidia.com/restore-from: worker-r1
    spec:
      terminationGracePeriodSeconds: 1
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: main
          image: vllm/vllm-openai:v0.31.0-ubuntu2404@sha256:3fb023cc987cc7c2bca7ca14c1e0aff5ae06bd9431bf07773731ce7e8a682460
          imagePullPolicy: IfNotPresent
          # The restore proxy replaces this command when available.
          # Otherwise, keep the container alive beside the restored workload.
          command: ["sleep", "infinity"]
          env:
            - name: SNAPSHOT_CONTROL_DIR
              value: /snapshot-control
          ports:
            - name: api
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /snapshot-control/restore-complete && test -f /snapshot-control/vllm-restore-ready
            periodSeconds: 1
            failureThreshold: 1800
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - cat
                - /snapshot-control/vllm-restore-ready
            periodSeconds: 1
            failureThreshold: 1800
          volumeMounts:
            - name: model-cache
              mountPath: /hf-cache
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: main
            - name: shm
              mountPath: /dev/shm
            - name: app
              mountPath: /snapshot-app
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: snapshot-control
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: app
          configMap:
            name: vllm-app
