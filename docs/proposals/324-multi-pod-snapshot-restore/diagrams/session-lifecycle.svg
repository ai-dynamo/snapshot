<title id="title">Coordination session and member records</title>
<desc id="desc">The session is open until every member has left, when it closes, or until any failure, deadline, lost member or cancellation, when it fails and every pending wait returns with the reason. Each member moves from no record, to a durable record written after the commit and before its first irreversible step, to restore-complete after release; a failure leaves a member without a record as found, fails a member with one, and only ends the rendezvous for a released member.</desc>
