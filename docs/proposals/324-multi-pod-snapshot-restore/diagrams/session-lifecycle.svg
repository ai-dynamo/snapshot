<title id="title">Coordination session lifecycle</title>
<desc id="desc">Admitting moves to Committed on commit or to Aborted on refusal, deadline, lost member or cancellation. Committed moves to Failed on any member error, to Closed when a capture completes, or to Released when a restore passes its release barrier. Released moves to Closed when every member has left.</desc>
