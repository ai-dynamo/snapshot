<title id="title">Multi-Pod snapshot architecture</title>
<desc id="desc">Kubernetes API, Snapshot operator and Snapshot coordinator on top; two nodes, each with a Snapshot agent and a Pod holding a cuInterpose relay and the workload processes. Agents hold a session connection to the coordinator; Pods reach the coordinator only through their agent.</desc>
