<title id="title">Phases of a group checkpoint and a group restore</title>
<desc id="desc">Checkpoint: the workload quiesces and reports ready-for-snapshot, admission all-gather, an INSPECT round, prepare barrier, CUDA prepare, a revalidation round, commit, destructive cuInterpose rounds, CUDA lock and checkpoint, hold and net-freeze barrier, CRIU dump. Restore: admission, commit, CRIU restore under a narrow hold, then in parallel the sockets-restored barrier and CUDA restore with the cuInterpose rounds, then the endpoint and resume barrier, CUDA resume, and the release barrier, after which the workload resumes; the workload waits from CRIU restore until restore-complete.</desc>
