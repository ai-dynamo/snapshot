# The coordinator runs as the agents' ServiceAccount. It follows the groups,
# whose sessions it holds, and reviews the tokens agents present. It reads the
# API server's ServiceAccount issuer and keys through Kubernetes's default
# system:service-account-issuer-discovery binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "snapshot.fullname" . }}-agent-coordinator
  labels:
    {{- include "snapshot.labels" . | nindent 4 }}
rules:
  - apiGroups: ["nvidia.com"]
    resources: ["podgroupsnapshots", "podgrouprestores"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "snapshot.fullname" . }}-agent-coordinator
  labels:
    {{- include "snapshot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "snapshot.fullname" . }}-agent-coordinator
subjects:
  - kind: ServiceAccount
    name: {{ include "snapshot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
