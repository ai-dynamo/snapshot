# The operator reads the Secrets and ConfigMaps that stores name, in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "snapshot.fullname" . }}-operator-snapshot-stores
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapshot.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "snapshot.fullname" . }}-operator-snapshot-stores
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapshot.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "snapshot.fullname" . }}-operator-snapshot-stores
subjects:
  - kind: ServiceAccount
    name: {{ include "snapshot.operatorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
