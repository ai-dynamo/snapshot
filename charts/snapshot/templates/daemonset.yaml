apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "snapshot.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapshot.labels" . | nindent 4 }}
    app.kubernetes.io/component: snapshot-agent
spec:
  selector:
    matchLabels:
      {{- include "snapshot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: snapshot-agent
  template:
    metadata:
      labels:
        {{- include "snapshot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: snapshot-agent
        {{- with .Values.daemonset.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: agent
        # Rolls PageBroker when the operator-consumed S3/storage settings
        # change, so an upgrade doesn't leave it running on stale config.
        # User-supplied podAnnotations cannot override this key.
        checksum/config: {{ include "snapshot.operatorConfigChecksum" . }}
        {{- if .Values.openshift.enabled }}
        # Pin this DS to the built-in "privileged" SCC even if a higher-priority
        # custom SCC is added later. See openshift/enhancements custom-scc-preemption-prevention.
        # User-supplied podAnnotations cannot override this key or checksum/config.
        openshift.io/required-scc: privileged
        {{- with omit (.Values.daemonset.podAnnotations | default dict) "openshift.io/required-scc" "kubectl.kubernetes.io/default-container" "checksum/config" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else }}
        {{- with omit (.Values.daemonset.podAnnotations | default dict) "kubectl.kubernetes.io/default-container" "checksum/config" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "snapshot.serviceAccountName" . }}
      hostPID: true
      hostIPC: true
      hostNetwork: true
      {{- with .Values.daemonset.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        # Default: tolerate all taints (allow running on any node)
        - operator: Exists
        {{- with .Values.daemonset.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if and .Values.daemonset.affinity (hasKey .Values.daemonset.affinity "nodeAffinity") }}
      {{- fail "daemonset.affinity.nodeAffinity is not supported because the chart already restricts kubernetes.io/arch to amd64 and arm64; use daemonset.nodeSelector or daemonset.affinity.podAffinity/podAntiAffinity instead" }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
                      - arm64
        {{- with .Values.daemonset.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.daemonset.runtimeClassName }}
      # CUDA checkpoint/restore requires the nvidia container runtime. Left out
      # when empty, for nodes where that runtime is containerd's default.
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- if .Values.seccomp.deploy }}
      initContainers:
        # Deploy seccomp profile to host before starting the agent
        # This profile blocks io_uring syscalls that CRIU doesn't support
        {{- $initImage := .Values.daemonset.initContainer.image | default "busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0" }}
        - name: deploy-seccomp
          image: {{ $initImage }}
          # A digest cannot move, so re-pulling it every start is wasted work;
          # anything else can, so keep pulling.
          imagePullPolicy: {{ .Values.daemonset.initContainer.imagePullPolicy | default (contains "@sha256:" $initImage | ternary "IfNotPresent" "Always") }}
          {{- with .Values.daemonset.initContainer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              mkdir -p /host-seccomp/profiles
              cp /seccomp-profiles/block-iouring.json /host-seccomp/profiles/block-iouring.json
              echo "Deployed seccomp profile to /var/lib/kubelet/seccomp/profiles/block-iouring.json"
          volumeMounts:
            - name: seccomp-profiles
              mountPath: /seccomp-profiles
              readOnly: true
            - name: host-seccomp
              mountPath: /host-seccomp
      {{- end }}
      containers:
        - name: agent
          image: {{ include "snapshot.agentImage" . | quote }}
          imagePullPolicy: {{ .Values.image.agent.pullPolicy }}
          args:
            - "--runtime"
            - {{ .Values.runtime.type | quote }}
            - "--runtime-socket"
            - {{ $socket | quote }}
          securityContext:
            privileged: true
          env:
            # Dynamic values from Kubernetes downward API
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SNAPSHOT_LOG_LEVEL
              value: {{ .Values.daemonset.snapshotLogLevel | quote }}
            {{- with .Values.daemonset.nriHostNamespace }}
            - name: SNAPSHOT_NRI_HOST_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            # Conventional CUDA queries need the host driver libraries.
            {{- include "snapshot.nvidiaEnvironment" . | nindent 12 }}
          volumeMounts:
            # Mount configuration ConfigMap
            - name: config
              mountPath: /etc/snapshot
              readOnly: true
            - name: pagebroker
              mountPath: /pagebroker
            {{- if eq .Values.storage.type "pvc" }}
            # Every agent owns direct access to the shared checkpoint store.
            - name: checkpoints
              mountPath: {{ .Values.storage.pvc.basePath }}
            {{- end }}
            # Mount the runtime socket directory. Derived from runtime.socketPath
            # so overrides stay reachable inside the container.
            - name: runtime-run
              mountPath: {{ $socketDir | quote }}
            # Mount kubelet pods directory for volume discovery
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              readOnly: true
            # NRI socket directory, for the plugin that makes the restore
            # proxy PID 1 in restore containers.
            - name: nri
              mountPath: /var/run/nri
            # The node's securityfs, read-only. CRIU looks here to find the
            # node's LSM: with it, a checkpoint records each process's
            # AppArmor label, which a restore into a labeled container needs.
            - name: securityfs
              mountPath: /sys/kernel/security
              readOnly: true
            # Per-container storage: agent reads overlay upperdirs from here
            # to capture the rootfs diff at checkpoint time.
            - name: runtime-storage
              mountPath: {{ $storageDir | quote }}
              readOnly: true
            # Mount host proc for CRIU and runtime PID signaling
            - name: host-proc
              mountPath: /host/proc
            # Mount host cgroup for CRIU (write access needed for cgroup freezer)
            - name: host-cgroup
              mountPath: /sys/fs/cgroup
            # Kubelet PodResources API socket (for GPU UUID discovery)
            - name: kubelet-pod-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
            {{- if and (eq .Values.storage.type "oci") .Values.storage.oci.credentialsSecretRef }}
            # Mount docker config for OCI registry auth
            - name: docker-config
              mountPath: /root/.docker
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.daemonset.resources | nindent 12 }}
        - name: pagebroker
          image: "{{ .Values.image.pageBroker.repository }}:{{ .Values.image.agent.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pageBroker.pullPolicy }}
          # CustomStorage operates on the workload's CUDA processes and device mappings.
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          env:
            {{- if eq .Values.storage.type "s3" }}
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: {{ printf "%s/%s" (include "snapshot.s3CredentialsMountDir" .) .Values.storage.s3.credentialsSecretKey | quote }}
            {{- end }}
            {{- if and (eq .Values.storage.type "s3") .Values.storage.s3.addressing }}
            # PageBroker refuses to start unless this agrees with the JSON's addressing.
            - name: RUNAI_STREAMER_S3_USE_VIRTUAL_ADDRESSING
              value: {{ ternary "1" "0" (eq .Values.storage.s3.addressing "virtual") | quote }}
            {{- end }}
            {{- if and (eq .Values.storage.type "s3") .Values.storage.s3.caBundleConfigMapRef }}
            # PageBroker refuses to start unless this equals the JSON's caFile.
            - name: AWS_CA_BUNDLE
              value: {{ include "snapshot.s3CABundlePath" . | quote }}
            {{- end }}
            {{- include "snapshot.nvidiaEnvironment" . | nindent 12 }}
          args:
            - {{ printf "%s/pagebroker.sock" $pageBrokerControlPath | quote }}
            - {{ $pageBrokerStagingPath | quote }}
            {{- if eq .Values.storage.type "s3" }}
            # Unused positional arg in S3 mode; still required by the CLI.
            - /var/snapshot/pagebroker-unused-storage-root
            {{- else }}
            - {{ .Values.storage.pvc.basePath | quote }}
            {{- end }}
            - --max-concurrent-requests
            - {{ .Values.pageBroker.maxConcurrentRequests | quote }}
            - --custom-storage-buffer-count
            - {{ .Values.pageBroker.transferBufferCount | int64 | quote }}
            - --custom-storage-chunk-bytes
            - {{ .Values.pageBroker.transferChunkBytes | int64 | quote }}
            - --custom-storage-max-pinned-bytes
            - {{ .Values.pageBroker.maxPinnedBytes | int64 | quote }}
            {{- if and .Values.pageBroker.artifactAddressing (eq .Values.storage.type "pvc") }}
            # Enable only with a broker implementing the PVC artifact backend.
            - --storage-config
            - /etc/snapshot/storage.yaml
            {{- else if eq .Values.storage.type "s3" }}
            # Resolved by the operator, not rendered by this chart: the JSON
            # file's storeId requires the Go identity computation the chart
            # cannot reproduce. See operator/cmd/manager/pagebroker_storage_config.go.
            - --storage-config
            - /etc/snapshot-s3/pagebroker-s3-config.json
            {{- end }}
            {{- if and (eq .Values.storage.type "s3") .Values.pageBroker.transferEngine.modelStreamer }}
            - --model-streamer-config
            - {{ include "snapshot.modelStreamerConfigPath" . }}
            {{- end }}
          resources:
            {{- toYaml .Values.pageBroker.resources | nindent 12 }}
          volumeMounts:
            - name: storage-config
              mountPath: /etc/snapshot
              readOnly: true
            - name: pagebroker
              mountPath: /pagebroker
            {{- if eq .Values.storage.type "pvc" }}
            - name: checkpoints
              mountPath: {{ .Values.storage.pvc.basePath }}
            {{- end }}
            {{- if eq .Values.storage.type "s3" }}
            - name: pagebroker-s3-config
              mountPath: /etc/snapshot-s3
              readOnly: true
            {{- end }}
            {{- if eq .Values.storage.type "s3" }}
            - name: s3-credentials
              mountPath: {{ include "snapshot.s3CredentialsMountDir" . }}
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.storage.type "s3") .Values.storage.s3.caBundleConfigMapRef }}
            - name: s3-ca-bundle
              mountPath: {{ include "snapshot.s3CABundleMountDir" . }}
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.storage.type "s3") .Values.pageBroker.transferEngine.modelStreamer }}
            - name: model-streamer-config
              mountPath: {{ include "snapshot.modelStreamerMountDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        # Configuration ConfigMap
        - name: config
          configMap:
            name: {{ include "snapshot.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: storage-config
          configMap:
            name: {{ include "snapshot.fullname" . }}-config
            items:
              - key: storage.yaml
                path: storage.yaml
        - name: pagebroker
          emptyDir:
            medium: Memory
            sizeLimit: {{ include "snapshot.stagingSizeLimit" . | quote }}
        {{- if .Values.seccomp.deploy }}
        # Seccomp profile ConfigMap (used by initContainer)
        - name: seccomp-profiles
          configMap:
            name: {{ include "snapshot.fullname" . }}-seccomp
        # Host seccomp directory (for deploying the profile)
        - name: host-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
        {{- end }}
        {{- if eq .Values.storage.type "pvc" }}
        - name: checkpoints
          persistentVolumeClaim:
            claimName: {{ .Values.storage.pvc.name }}
        {{- end }}
        {{- if eq .Values.storage.type "s3" }}
        # Written by the operator (ensurePageBrokerS3Config), not this chart:
        # its storeId field needs the Go identity computation. Fails closed if
        # the operator has not written it yet, surfacing the rollout ordering
        # rather than silently starting PageBroker without a storage config.
        - name: pagebroker-s3-config
          configMap:
            name: {{ include "snapshot.pageBrokerS3ConfigName" . | quote }}
        {{- end }}
        {{- if eq .Values.storage.type "s3" }}
        - name: s3-credentials
          secret:
            secretName: {{ .Values.storage.s3.credentialsSecretRef }}
            items:
              - key: {{ .Values.storage.s3.credentialsSecretKey }}
                path: {{ .Values.storage.s3.credentialsSecretKey }}
        {{- end }}
        {{- if and (eq .Values.storage.type "s3") .Values.storage.s3.caBundleConfigMapRef }}
        - name: s3-ca-bundle
          configMap:
            name: {{ .Values.storage.s3.caBundleConfigMapRef }}
            items:
              - key: {{ .Values.storage.s3.caBundleConfigMapKey }}
                path: {{ .Values.storage.s3.caBundleConfigMapKey }}
        {{- end }}
        {{- if and (eq .Values.storage.type "s3") .Values.pageBroker.transferEngine.modelStreamer }}
        - name: model-streamer-config
          configMap:
            name: {{ include "snapshot.fullname" . }}-config
            items:
              - key: model-streamer.json
                path: model-streamer.json
        {{- end }}
        # Runtime socket directory (read-write for checkpoint operations).
        # Same path inside and on the host so the agent dials runtime.socketPath
        # verbatim.
        - name: runtime-run
          hostPath:
            path: {{ $socketDir | quote }}
            type: Directory
        # Kubelet pods directory (for volume discovery)
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        # NRI socket directory. A directory, not the socket itself: a
        # socket-typed hostPath would keep the Pod from starting at all, and
        # hide the reason. On a node without NRI the agent starts, cannot
        # register its NRI plugin, and restores without the restore proxy.
        - name: nri
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
        # Securityfs. sysfs always has the directory; where securityfs is not
        # mounted it is empty, and CRIU records no labels.
        - name: securityfs
          hostPath:
            path: /sys/kernel/security
            type: Directory
        # Per-container storage (overlay upperdirs for rootfs-diff capture).
        - name: runtime-storage
          hostPath:
            path: {{ $storageDir | quote }}
            type: Directory
        # Host proc (for CRIU and runtime signaling - needs write access)
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        # Host cgroup (for CRIU)
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        # Kubelet PodResources API socket directory
        - name: kubelet-pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
            type: Directory
        {{- if and (eq .Values.storage.type "oci") .Values.storage.oci.credentialsSecretRef }}
        - name: docker-config
          secret:
            secretName: {{ .Values.storage.oci.credentialsSecretRef }}
        {{- end }}
      {{- with .Values.daemonset.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
