apiVersion: v1
kind: ConfigMap
{{- if and (ne .Values.storage.type "pvc") (ne .Values.storage.type "s3") }}
{{- fail (printf "snapshot.storage.type=%q is not supported yet; only pvc and s3 are currently implemented" .Values.storage.type) }}
{{- end }}
{{- if and (eq .Values.storage.type "pvc") (ne .Values.storage.pvc.basePath "/checkpoints") }}
{{- fail "snapshot.storage.pvc.basePath is fixed at /checkpoints so the privileged mount helper can enforce its source allowlist" }}
{{- end }}
{{- if and .Values.operator.bindNewContents (eq .Values.storage.type "pvc") (not .Values.pageBroker.artifactAddressing) }}
{{- fail "operator.bindNewContents requires pageBroker.artifactAddressing and a completed compatible agent rollout" }}
{{- end }}
{{- if and (eq .Values.storage.type "s3") (not .Values.storage.s3.credentialsSecretRef) }}
{{- fail "storage.s3.credentialsSecretRef is required when storage.type=s3" }}
{{- end }}
{{- if and (eq .Values.storage.type "s3") (not .Values.operator.bindNewContents) }}
{{- fail "storage.type=s3 requires operator.bindNewContents: S3 has no legacy local-path capture mode" }}
{{- end }}
{{- include "snapshot.validateS3Settings" . }}
metadata:
  name: {{ include "snapshot.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapshot.labels" . | nindent 4 }}
data:
  # Resolved backend settings for operator/PageBroker, not AgentConfig. Keeping
  # this separate lets another resolver supply them without changing agent APIs.
  storage.yaml: |
    {{- if eq .Values.storage.type "pvc" }}
    pvc:
      namespace: {{ .Release.Namespace | quote }}
      claimName: {{ required "storage.pvc.name is required" .Values.storage.pvc.name | quote }}
      # The entire claim is used; this is not the container-local mount path.
      basePath: "/"
    {{- else }}
    # Raw connection fields only: the operator computes the store ID from
    # these (api/storage.S3.StoreID) and writes it separately into the
    # ConfigMap PageBroker actually reads. See
    # operator/cmd/manager/pagebroker_storage_config.go.
    s3:
      endpoint: {{ required "storage.s3.endpoint is required" .Values.storage.s3.endpoint | quote }}
      region: {{ required "storage.s3.region is required" .Values.storage.s3.region | quote }}
      bucket: {{ required "storage.s3.bucket is required" .Values.storage.s3.bucket | quote }}
      prefix: {{ .Values.storage.s3.prefix | default "" | quote }}
    {{- end }}
  {{- if eq .Values.storage.type "s3" }}
  # PageBroker-only S3 settings, none of them a store identity input. The
  # operator merges them into the JSON file PageBroker reads; the DaemonSet
  # sets the environment PageBroker checks them against.
  pagebroker-s3.yaml: |
    {{- with .Values.storage.s3.addressing }}
    addressing: {{ . | quote }}
    {{- end }}
    {{- if .Values.storage.s3.allowHttp }}
    allowHttp: true
    {{- end }}
    {{- if .Values.storage.s3.caBundleConfigMapRef }}
    caFile: {{ include "snapshot.s3CABundlePath" . | quote }}
    {{- end }}
    limits:
      {{- include "snapshot.pageBrokerS3Limits" . | nindent 6 }}
  {{- if .Values.pageBroker.transferEngine.modelStreamer }}
  model-streamer.json: {{ toJson .Values.pageBroker.transferEngine.modelStreamer | quote }}
  {{- end }}
  {{- end }}
  config.yaml: |
    # Pinned to pvc/checkpoints regardless of storage.type or storage.pvc.basePath
    # above: the agent itself has no S3 awareness yet, and this value can no
    # longer vary meaningfully since it's pinned either way. PageBroker and the
    # operator own S3 I/O.
    storage:
      type: "pvc"
      basePath: "/checkpoints"

    overlay:
      exclusions: {{ toYaml .Values.config.overlay.exclusions | nindent 8 }}

    pageBroker:
      restoreMode: {{ .Values.pageBroker.restoreMode | quote }}
      controlSocketPath: {{ printf "%s/pagebroker.sock" (include "snapshot.pageBrokerControlPath" .) | quote }}
      stagingPath: {{ include "snapshot.pageBrokerStagingPath" . | quote }}

    checkpoint:
      checkpointTimeoutSeconds: {{ .Values.config.checkpoint.checkpointTimeoutSeconds }}
      retryLimit: {{ .Values.config.checkpoint.retryLimit | default 0 }}

    restore:
      restoreTimeoutSeconds: {{ .Values.config.restore.restoreTimeoutSeconds }}
      skipCompatCheck: {{ .Values.config.restore.skipCompatCheck }}

    criu:
      binaryPath: {{ .Values.config.criu.binaryPath | quote }}
      ghostLimit: {{ .Values.config.criu.ghostLimit }}
      logLevel: {{ .Values.config.criu.logLevel }}
      workDir: {{ .Values.config.criu.workDir | quote }}
      shellJob: {{ .Values.config.criu.shellJob }}
      tcpClose: {{ .Values.config.criu.tcpClose }}
      tcpEstablished: {{ .Values.config.criu.tcpEstablished }}
      fileLocks: {{ .Values.config.criu.fileLocks }}
      orphanPtsMaster: {{ .Values.config.criu.orphanPtsMaster }}
      extUnixSk: {{ .Values.config.criu.extUnixSk }}
      linkRemap: {{ .Values.config.criu.linkRemap }}
      extMasters: {{ .Values.config.criu.extMasters }}
      manageCgroupsMode: {{ .Values.config.criu.manageCgroupsMode | quote }}
      imageIoMode: {{ .Values.config.criu.imageIoMode | quote }}
      rstSibling: {{ .Values.config.criu.rstSibling }}
      mntnsCompatMode: {{ .Values.config.criu.mntnsCompatMode }}
      evasiveDevices: {{ .Values.config.criu.evasiveDevices }}
      forceIrmap: {{ .Values.config.criu.forceIrmap }}
      autoDedup: {{ .Values.config.criu.autoDedup }}
      lazyPages: {{ .Values.config.criu.lazyPages }}
      libDir: {{ .Values.config.criu.libDir | quote }}
      allowUprobes: {{ .Values.config.criu.allowUprobes }}
      skipInFlight: {{ .Values.config.criu.skipInFlight }}
