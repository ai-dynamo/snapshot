apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snapshot.fullname" . }}-operator
  labels:
    {{- include "snapshot.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "snapshot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "snapshot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
      annotations:
        # Rolls the operator when the S3/storage settings it reads at
        # startup change, so an upgrade doesn't leave it running on stale
        # config and silently skip rewriting PageBroker's ConfigMap.
        checksum/config: {{ include "snapshot.operatorConfigChecksum" . }}
        {{- if .Values.openshift.enabled }}
        openshift.io/required-scc: anyuid
        {{- end }}
    spec:
      serviceAccountName: {{ include "snapshot.operatorServiceAccountName" . }}
      {{- with .Values.image.operator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.crdUpgrade.enabled }}
      initContainers:
        # Failing here is intentional: it stops the manager rather than let it
        # run against outdated definitions.
        - name: crd-installer
          image: "{{ .Values.image.operator.repository }}:{{ .Values.image.operator.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.operator.pullPolicy }}
          command: ["/crd-installer"]
          env:
            - name: SNAPSHOT_LOG_LEVEL
              value: {{ .Values.crdUpgrade.logLevel | quote }}
          {{- with .Values.crdUpgrade.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.operator.repository }}:{{ .Values.image.operator.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.operator.pullPolicy }}
          # Artifact cleanup removes CRIU files created as root on the shared PVC.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            {{- /* OpenShift's anyuid SCC does not allow seccomp profiles. */}}
            {{- if not .Values.openshift.enabled }}
            seccompProfile:
              type: RuntimeDefault
            {{- end }}
          {{- with .Values.operator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - {{ printf "--snapshot-storage-base-path=%v" .Values.storage.pvc.basePath | quote }}
            - {{ printf "--artifact-cleanup-scan-interval=%v" .Values.operator.artifactCleanup.scanInterval | quote }}
            - {{ printf "--artifact-cleanup-batch-size=%v" .Values.operator.artifactCleanup.batchSize | quote }}
            - {{ printf "--artifact-cleanup-list-attempts=%v" .Values.operator.artifactCleanup.listAttempts | quote }}
            - {{ printf "--artifact-cleanup-workers=%v" .Values.operator.artifactCleanup.workers | quote }}
            - {{ printf "--artifact-cleanup-backend-type=%v" .Values.storage.type | quote }}
            - {{ printf "--artifact-cleanup-task-timeout=%v" .Values.operator.artifactCleanup.taskTimeout | quote }}
            # CuInterpose libraries for opted-in workloads.
            - {{ printf "--cuinterpose-image=%s" (include "snapshot.agentImage" .) | quote }}
            - {{ printf "--cuinterpose-image-pull-policy=%s" .Values.image.agent.pullPolicy | quote }}
            - --snapshot-storage-config=/etc/snapshot/storage.yaml
            {{- if .Values.operator.bindNewContents }}
            - --bind-new-contents=true
            {{- end }}
            {{- if .Values.operator.lifecycleHooks }}
            - --enable-lifecycle-hooks=true
            {{- end }}
            {{- if eq .Values.storage.type "s3" }}
            - {{ printf "--pagebroker-s3-config-namespace=%s" .Release.Namespace | quote }}
            - {{ printf "--pagebroker-s3-config-name=%s" (include "snapshot.pageBrokerS3ConfigName" .) | quote }}
            - {{ printf "--release-name=%s" .Release.Name | quote }}
            - {{ printf "--artifact-cleanup-s3-credentials-path=%s/%s" (include "snapshot.s3CredentialsMountDir" .) .Values.storage.s3.credentialsSecretKey | quote }}
            - --pagebroker-s3-settings=/etc/snapshot/pagebroker-s3.yaml
            {{- if .Values.storage.s3.caBundleConfigMapRef }}
            - {{ printf "--artifact-cleanup-s3-ca-bundle-path=%s" (include "snapshot.s3CABundlePath" .) | quote }}
            {{- end }}
            {{- end }}
          {{- if .Values.operator.testFailCaptureSourceAnnotation }}
          env:
            - name: SNAPSHOT_E2E_TEST_FAIL_CAPTURE_SOURCE_ANNOTATION
              value: {{ .Values.operator.testFailCaptureSourceAnnotation | quote }}
          {{- end }}
          volumeMounts:
            {{- if eq .Values.storage.type "pvc" }}
            - name: checkpoints
              mountPath: {{ .Values.storage.pvc.basePath | quote }}
            {{- end }}
            - name: storage-config
              mountPath: /etc/snapshot
              readOnly: true
            {{- if eq .Values.storage.type "s3" }}
            - name: s3-credentials
              mountPath: {{ include "snapshot.s3CredentialsMountDir" . }}
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.storage.type "s3") .Values.storage.s3.caBundleConfigMapRef }}
            - name: s3-ca-bundle
              mountPath: {{ include "snapshot.s3CABundleMountDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        {{- if eq .Values.storage.type "pvc" }}
        - name: checkpoints
          persistentVolumeClaim:
            claimName: {{ .Values.storage.pvc.name }}
        {{- end }}
        - name: storage-config
          configMap:
            name: {{ include "snapshot.fullname" . }}-config
            items:
              - key: storage.yaml
                path: storage.yaml
              {{- if eq .Values.storage.type "s3" }}
              - key: pagebroker-s3.yaml
                path: pagebroker-s3.yaml
              {{- end }}
        {{- if eq .Values.storage.type "s3" }}
        - name: s3-credentials
          secret:
            secretName: {{ .Values.storage.s3.credentialsSecretRef }}
            items:
              - key: {{ .Values.storage.s3.credentialsSecretKey }}
                path: {{ .Values.storage.s3.credentialsSecretKey }}
        {{- end }}
        {{- if and (eq .Values.storage.type "s3") .Values.storage.s3.caBundleConfigMapRef }}
        - name: s3-ca-bundle
          configMap:
            name: {{ .Values.storage.s3.caBundleConfigMapRef }}
            items:
              - key: {{ .Values.storage.s3.caBundleConfigMapKey }}
                path: {{ .Values.storage.s3.caBundleConfigMapKey }}
        {{- end }}
