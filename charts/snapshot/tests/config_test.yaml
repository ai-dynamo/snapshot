suite: snapshot agent configuration validation
templates:
  - templates/configmap.yaml
tests:
  - it: accepts the fixed checkpoint mount path
    asserts:
      - isKind:
          of: ConfigMap

  - it: rejects a caller-selected checkpoint mount path
    set:
      storage.pvc.basePath: /other
    asserts:
      - failedTemplate:
          errorPattern: "storage.pvc.basePath is fixed at /checkpoints"

  - it: rejects removed storage access mode
    set:
      storage.accessMode: ReadWriteMany
    asserts:
      - failedTemplate:
          errorPattern: "storage.accessMode has been removed"

  - it: rejects removed PVC access mode
    set:
      storage.pvc.accessMode: ReadWriteMany
    asserts:
      - failedTemplate:
          errorPattern: "storage.pvc.accessMode has been removed"
