suite: cuinterpose delivery flags on the operator
templates:
  - templates/operator-deployment.yaml
  - templates/daemonset.yaml
tests:
  - it: passes the agent image and pull policy
    template: templates/operator-deployment.yaml
    set:
      image.agent.tag: v9.9.9
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--agent-image=ghcr.io/ai-dynamo/snapshot/agent:v9.9.9"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--agent-image-pull-policy=Always"

  - it: pins the installer and daemonset to the same tag and digest
    set:
      image.agent.repository: registry.example/snapshot-agent
      image.agent.tag: v9.9.9@sha256:1111111111111111111111111111111111111111111111111111111111111111
      image.agent.pullPolicy: IfNotPresent
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--agent-image=registry.example/snapshot-agent:v9.9.9@sha256:1111111111111111111111111111111111111111111111111111111111111111"
        template: templates/operator-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--agent-image-pull-policy=IfNotPresent"
        template: templates/operator-deployment.yaml
      - equal:
          path: spec.template.spec.containers[?(@.name == 'agent')].image
          value: registry.example/snapshot-agent:v9.9.9@sha256:1111111111111111111111111111111111111111111111111111111111111111
        template: templates/daemonset.yaml
      - equal:
          path: spec.template.spec.containers[?(@.name == 'agent')].imagePullPolicy
          value: IfNotPresent
        template: templates/daemonset.yaml
