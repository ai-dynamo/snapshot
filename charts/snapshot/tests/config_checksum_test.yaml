# checksum/config restarts the agent and the operator when a value behind
# storage.yaml or pagebroker-s3.yaml changes. A test renders one set of values
# and cannot compare two renders, so the literal below is the checksum of the
# chart defaults. A new or changed default under storage, pageBroker.s3 or
# pageBroker.transferEngine.modelStreamer changes it, and so does a default
# that moves the staging size limit. The first two tests then fail: replace
# every copy of the literal with the value that the first test prints as
# actual. Such a change also restarts both workloads on the next upgrade.
suite: rollout checksum of the storage configuration
templates:
  - templates/daemonset.yaml
  - templates/operator-deployment.yaml
tests:
  - it: stamps the agent and the operator with one checksum
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/config"]
          value: f2d61b4eeaad558f50ab063af3e0c3b1fba42e1b6a752cc9c78307ca68cc8292

  # create, size and storageClass shape only the claim object. A storage class
  # change on a bound claim is refused by the API server, and with these values
  # in the checksum the refused upgrade still restarted every agent.
  - it: keeps the checksum when only the provisioning of the claim changes
    set:
      storage.pvc.create: false
      storage.pvc.size: 2Ti
      storage.pvc.storageClass: rwx-shared
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/config"]
          value: f2d61b4eeaad558f50ab063af3e0c3b1fba42e1b6a752cc9c78307ca68cc8292

  - it: changes the checksum with the claim that holds the store
    set:
      storage.pvc.name: other-pvc
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/config"]
          value: f2d61b4eeaad558f50ab063af3e0c3b1fba42e1b6a752cc9c78307ca68cc8292

  - it: changes the checksum with an S3 store setting
    set:
      storage.type: s3
      storage.s3.endpoint: https://s3.example.com
      storage.s3.region: us-east-1
      storage.s3.bucket: snapshot-bucket
      operator.bindNewContents: true
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/config"]
          value: f2d61b4eeaad558f50ab063af3e0c3b1fba42e1b6a752cc9c78307ca68cc8292
