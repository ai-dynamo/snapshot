suite: PageBroker sidecar
templates:
  - templates/daemonset.yaml
  - templates/configmap.yaml
tests:
  - it: runs the PageBroker sidecar next to the agent at the agent's tag
    template: templates/daemonset.yaml
    set:
      image.agent.tag: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: agent
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/ai-dynamo/snapshot/agent:v1.2.3
      - equal:
          path: spec.template.spec.containers[1].name
          value: pagebroker
      - equal:
          path: spec.template.spec.containers[1].image
          value: ghcr.io/ai-dynamo/snapshot/pagebroker:v1.2.3
      - notExists:
          path: spec.template.spec.containers[1].command

  - it: keeps the agent as the default container for exec and logs
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["kubectl.kubernetes.io/default-container"]
          value: agent

  - it: does not let podAnnotations redirect the default container
    template: templates/daemonset.yaml
    set:
      daemonset.podAnnotations:
        kubectl.kubernetes.io/default-container: pagebroker
        example.com/team: platform
    asserts:
      - equal:
          path: spec.template.metadata.annotations["kubectl.kubernetes.io/default-container"]
          value: agent
      - equal:
          path: spec.template.metadata.annotations["example.com/team"]
          value: platform

  - it: keeps the default container alongside the OpenShift SCC pin
    template: templates/daemonset.yaml
    set:
      openshift.enabled: true
    asserts:
      - equal:
          path: spec.template.metadata.annotations["kubectl.kubernetes.io/default-container"]
          value: agent
      - equal:
          path: spec.template.metadata.annotations["openshift.io/required-scc"]
          value: privileged

  - it: keeps default daemon arguments compatible with the filesystem broker
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].args
          value:
            - /pagebroker/control/pagebroker.sock
            - /pagebroker/staging
            - /checkpoints
            - --max-concurrent-requests
            - "16"
            - --custom-storage-buffer-count
            - "32"
            - --custom-storage-chunk-bytes
            - "134217728"
            - --custom-storage-max-pinned-bytes
            - "0"

  - it: passes store identity when the artifact backend is explicitly enabled
    template: templates/daemonset.yaml
    set:
      pageBroker.artifactAddressing: true
    asserts:
      - contains:
          path: spec.template.spec.containers[1].args
          content: --storage-config
      - contains:
          path: spec.template.spec.containers[1].args
          content: /etc/snapshot/storage.yaml

  - it: mounts the checkpoint PVC in both containers at the same path
    template: templates/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: checkpoints
            mountPath: /checkpoints
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: checkpoints
            mountPath: /checkpoints
      - contains:
          path: spec.template.spec.volumes
          content:
            name: checkpoints
            persistentVolumeClaim:
              claimName: snapshot-pvc

  - it: shares one memory-backed volume between the agent and the sidecar
    template: templates/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: pagebroker
            mountPath: /pagebroker
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: pagebroker
            mountPath: /pagebroker
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pagebroker
            emptyDir:
              medium: Memory
              sizeLimit: "64Gi"

  - it: caps the staging volume at the agent memory limit by default
    template: templates/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pagebroker
            emptyDir:
              medium: Memory
              sizeLimit: "64Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 64Gi

  - it: honours a pageBroker.staging.sizeLimit override
    template: templates/daemonset.yaml
    set:
      pageBroker.staging.sizeLimit: 128Gi
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pagebroker
            emptyDir:
              medium: Memory
              sizeLimit: "128Gi"

  - it: falls back to the 64Gi default when reused values carry no pageBroker.staging map
    template: templates/daemonset.yaml
    set:
      pageBroker.staging: null
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pagebroker
            emptyDir:
              medium: Memory
              sizeLimit: "64Gi"

  - it: reserves resources for the GPU engine and staging
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].resources.requests
          value:
            cpu: 8
            memory: 32Gi

  - it: follows image.pageBroker overrides
    template: templates/daemonset.yaml
    set:
      image.agent.tag: v1.2.3
      image.pageBroker.repository: registry.internal/snapshot/pagebroker
      image.pageBroker.pullPolicy: IfNotPresent
    asserts:
      - equal:
          path: spec.template.spec.containers[1].image
          value: registry.internal/snapshot/pagebroker:v1.2.3
      - equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: IfNotPresent

  - it: tells the agent where the control socket is
    template: templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'controlSocketPath: "/pagebroker/control/pagebroker.sock"'


  - it: rejects a separate PageBroker tag instead of silently ignoring it
    set:
      image.pageBroker.tag: candidate
    template: templates/daemonset.yaml
    asserts:
      - failedTemplate:
          errorMessage: "image.pageBroker.tag is unsupported: set image.agent.tag to select matching agent and PageBroker images"


  - it: embeds GPU execution in the default PageBroker sidecar
    template: templates/daemonset.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[?(@.name == "pagebroker")].name
          value: pagebroker
      - equal:
          path: spec.template.spec.containers[?(@.name == "pagebroker")].securityContext.privileged
          value: true
      - equal:
          path: spec.template.spec.containers[?(@.name == "pagebroker")].securityContext.runAsUser
          value: 0
      - contains:
          path: spec.template.spec.containers[?(@.name == "pagebroker")].env
          content:
            name: NVIDIA_VISIBLE_DEVICES
            value: all
      - contains:
          path: spec.template.spec.containers[?(@.name == "pagebroker")].env
          content:
            name: NVIDIA_DRIVER_CAPABILITIES
            value: compute,utility
      - equal:
          path: spec.template.spec.containers[?(@.name == "pagebroker")].args
          value:
            - /pagebroker/control/pagebroker.sock
            - /pagebroker/staging
            - /checkpoints
            - --max-concurrent-requests
            - "16"
            - --custom-storage-buffer-count
            - "32"
            - --custom-storage-chunk-bytes
            - "134217728"
            - --custom-storage-max-pinned-bytes
            - "0"


  - it: applies the configured pinned-memory budget to the owning process
    set:
      pageBroker.transferBufferCount: 4
      pageBroker.transferChunkBytes: 1048576
      pageBroker.maxPinnedBytes: 8388608
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "pagebroker")].args[6]
          value: "4"
      - equal:
          path: spec.template.spec.containers[?(@.name == "pagebroker")].args[8]
          value: "1048576"
      - equal:
          path: spec.template.spec.containers[?(@.name == "pagebroker")].args[10]
          value: "8388608"


  - it: defaults the sidecar tag to the chart appVersion like the agent
    chart:
      appVersion: v9.8.7
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "pagebroker")].image
          value: ghcr.io/ai-dynamo/snapshot/pagebroker:v9.8.7
      - equal:
          path: spec.template.spec.containers[?(@.name == "agent")].image
          value: ghcr.io/ai-dynamo/snapshot/agent:v9.8.7


  - it: rejects a nonnumeric buffer count
    set:
      pageBroker.transferBufferCount: "abc"
    template: templates/daemonset.yaml
    asserts:
      - failedTemplate:
          errorPattern: "transferBufferCount"


  - it: rejects a string buffer count with a fraction
    set:
      pageBroker.transferBufferCount: "1.5"
    template: templates/daemonset.yaml
    asserts:
      - failedTemplate:
          errorPattern: "transferBufferCount"


  - it: rejects a fractional buffer count
    set:
      pageBroker.transferBufferCount: 1.5
    template: templates/daemonset.yaml
    asserts:
      - failedTemplate:
          errorPattern: "transferBufferCount"


  - it: rejects a zero buffer count
    set:
      pageBroker.transferBufferCount: 0
    template: templates/daemonset.yaml
    asserts:
      - failedTemplate:
          errorPattern: "transferBufferCount"


  - it: rejects a negative chunk size
    set:
      pageBroker.transferChunkBytes: -4096
    template: templates/daemonset.yaml
    asserts:
      - failedTemplate:
          errorPattern: "transferChunkBytes"


  - it: rejects an unaligned chunk size
    set:
      pageBroker.transferChunkBytes: 4097
    template: templates/daemonset.yaml
    asserts:
      - failedTemplate:
          errorPattern: "transferChunkBytes"


  - it: rejects a nonnumeric memory cap
    set:
      pageBroker.maxPinnedBytes: "abc"
    template: templates/daemonset.yaml
    asserts:
      - failedTemplate:
          errorPattern: "maxPinnedBytes"


  - it: rejects a negative memory cap
    set:
      pageBroker.maxPinnedBytes: -1
    template: templates/daemonset.yaml
    asserts:
      - failedTemplate:
          errorPattern: "maxPinnedBytes"


  - it: rejects a memory cap above the integer range
    set:
      pageBroker.maxPinnedBytes: 1e20
    template: templates/daemonset.yaml
    asserts:
      - failedTemplate:
          errorPattern: "maxPinnedBytes"


  - it: rejects a zero control request limit
    set:
      pageBroker.maxConcurrentRequests: 0
    template: templates/daemonset.yaml
    asserts:
      - failedTemplate:
          errorPattern: "maxConcurrentRequests"
