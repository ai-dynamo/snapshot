suite: checkpoint completion grace on the operator
templates:
  - templates/operator-deployment.yaml
tests:
  - it: defaults the grace to five minutes
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --checkpoint-completion-grace=5m

  - it: passes a configured grace to the operator
    set:
      operator.checkpointCompletionGrace: 20m
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --checkpoint-completion-grace=20m

  - it: omits the flag when reused values from an older release carry no grace
    set:
      operator.checkpointCompletionGrace: null
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --checkpoint-completion-grace=<nil>
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --checkpoint-completion-grace=5m

  - it: passes an explicit zero through so the operator rejects it
    set:
      operator.checkpointCompletionGrace: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --checkpoint-completion-grace=0
