suite: PVC storage identity configuration
templates:
  - templates/configmap.yaml
  - templates/daemonset.yaml
  - templates/operator-deployment.yaml
  - templates/pvc.yaml
release:
  name: snapshot
  namespace: storage-ns
tests:
  - it: derives backend identity from existing Helm values without changing agent configuration
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: data["storage.yaml"]
          value: |
            pvc:
              namespace: "storage-ns"
              claimName: "snapshot-pvc"
              # The entire claim is used; this is not the container-local mount path.
              basePath: "/"
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'storage:\s+type: "pvc"\s+basePath: "/checkpoints"'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'pvc:|claimName:|namespace:|storeID:'

  - it: uses a custom existing claim for the resolved identity and both mounts
    set:
      storage.pvc.create: false
      storage.pvc.name: existing-checkpoints
    asserts:
      - matchRegex:
          path: data["storage.yaml"]
          pattern: 'claimName: "existing-checkpoints"'
        template: templates/configmap.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: checkpoints
            persistentVolumeClaim:
              claimName: existing-checkpoints
        template: templates/daemonset.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: checkpoints
            persistentVolumeClaim:
              claimName: existing-checkpoints
        template: templates/operator-deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/pvc.yaml

  - it: mounts resolved backend configuration only in PageBroker on the node
    template: templates/daemonset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[1].args
          content: --storage-config
      - notContains:
          path: spec.template.spec.containers[1].args
          content: /etc/snapshot/storage.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/snapshot
            readOnly: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: storage-config
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: snapshot-config
              items:
                - key: config.yaml
                  path: config.yaml
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: storage-config
            mountPath: /etc/snapshot
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: storage-config
            configMap:
              name: snapshot-config
              items:
                - key: storage.yaml
                  path: storage.yaml

  - it: gives the manager the same resolved backend configuration as PageBroker
    template: templates/operator-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --snapshot-storage-config=/etc/snapshot/storage.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --bind-new-contents=true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: storage-config
            mountPath: /etc/snapshot
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: storage-config
            configMap:
              name: snapshot-config
              items:
                - key: storage.yaml
                  path: storage.yaml

  - it: prepares compatible brokers while keeping new content unbound
    set:
      pageBroker.artifactAddressing: true
    asserts:
      - contains:
          path: spec.template.spec.containers[1].args
          content: --storage-config
        template: templates/daemonset.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --bind-new-contents=true
        template: templates/operator-deployment.yaml

  - it: activates binding separately after the compatible daemon rollout
    set:
      pageBroker.artifactAddressing: true
      operator.bindNewContents: true
    asserts:
      - contains:
          path: spec.template.spec.containers[1].args
          content: --storage-config
        template: templates/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --bind-new-contents=true
        template: templates/operator-deployment.yaml

  - it: refuses binding without an artifact backend
    template: templates/configmap.yaml
    set:
      operator.bindNewContents: true
    asserts:
      - failedTemplate:
          errorMessage: operator.bindNewContents requires pageBroker.artifactAddressing and a completed compatible agent rollout

  - it: rejects a missing PVC name
    template: templates/configmap.yaml
    set:
      storage.pvc.name: ""
    asserts:
      - failedTemplate:
          errorMessage: storage.pvc.name is required

  - it: rejects an unsupported storage type
    template: templates/configmap.yaml
    set:
      storage.type: oci
    asserts:
      - failedTemplate:
          errorPattern: only pvc and s3 are currently implemented

  - it: rejects S3 activation without required fields
    template: templates/configmap.yaml
    set:
      storage.type: s3
    asserts:
      - failedTemplate:
          errorMessage: storage.s3.endpoint is required

  - it: renders the S3 backend block when S3 is configured
    template: templates/configmap.yaml
    set:
      storage.type: s3
      storage.s3.endpoint: https://s3.example.com
      storage.s3.region: us-east-1
      storage.s3.bucket: snapshot-bucket
      storage.s3.prefix: containers
    asserts:
      - matchRegex:
          path: data["storage.yaml"]
          pattern: |-
            (?s)s3:\s*
              endpoint: "https://s3.example.com"\s*
              region: "us-east-1"\s*
              bucket: "snapshot-bucket"\s*
              prefix: "containers"
      - notMatchRegex:
          path: data["storage.yaml"]
          pattern: "pvc:"

  - it: tells the operator where to write PageBroker's S3 configuration and drops the PVC mount
    template: templates/operator-deployment.yaml
    set:
      storage.type: s3
      storage.s3.endpoint: https://s3.example.com
      storage.s3.region: us-east-1
      storage.s3.bucket: snapshot-bucket
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --pagebroker-s3-config-namespace=storage-ns
      - contains:
          path: spec.template.spec.containers[0].args
          content: --pagebroker-s3-config-name=snapshot-pagebroker-storage-config
      - contains:
          path: spec.template.spec.containers[0].args
          content: --release-name=snapshot
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: checkpoints
            mountPath: /checkpoints
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: checkpoints
            persistentVolumeClaim:
              claimName: snapshot-pvc
