suite: SnapshotJob source Pod seccomp profile
templates:
  - templates/operator-deployment.yaml
tests:
  - it: sets the block-iouring profile on source Pods by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--source-pod-seccomp-profile=profiles/block-iouring.json"

  - it: passes an empty profile so the operator sets none
    set:
      seccomp.applyToSourcePods: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--source-pod-seccomp-profile="
