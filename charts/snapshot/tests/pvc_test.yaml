suite: checkpoint PVC access-mode validation
templates:
  - templates/daemonset.yaml
release:
  name: snapshot
  namespace: snapshot-system
kubernetesProvider:
  scheme:
    "v1/PersistentVolumeClaim":
      gvr:
        version: v1
        resource: persistentvolumeclaims
      namespaced: true
tests:
  - it: rejects a retained chart-created RWO claim
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: snapshot-pvc
            namespace: snapshot-system
          spec:
            accessModes: [ReadWriteOnce]
    asserts:
      - failedTemplate:
          errorPattern: "requires ReadWriteMany"

  - it: rejects a reused external RWO claim
    set:
      storage.pvc.create: false
      storage.pvc.name: shared-checkpoints
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: shared-checkpoints
            namespace: snapshot-system
          spec:
            accessModes: [ReadWriteOnce]
    asserts:
      - failedTemplate:
          errorPattern: "requires ReadWriteMany"

  - it: accepts an existing RWX claim
    set:
      storage.pvc.create: false
      storage.pvc.name: shared-checkpoints
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: shared-checkpoints
            namespace: snapshot-system
          spec:
            accessModes: [ReadWriteMany]
    asserts:
      - isKind:
          of: DaemonSet
