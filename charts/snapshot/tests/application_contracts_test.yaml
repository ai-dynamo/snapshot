suite: snapshot operator application contracts gate
templates:
  - templates/operator-deployment.yaml
tests:
  - it: rejects container settings by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --enable-application-contracts=true

  - it: accepts container settings when the temporary value is on
    set:
      operator.applicationContracts: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --enable-application-contracts=true
