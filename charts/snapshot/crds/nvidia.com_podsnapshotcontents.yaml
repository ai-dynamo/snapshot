---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: podsnapshotcontents.nvidia.com
spec:
  group: nvidia.com
  names:
    kind: PodSnapshotContent
    listKind: PodSnapshotContentList
    plural: podsnapshotcontents
    shortNames:
    - podsnapcontent
    singular: podsnapshotcontent
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Bound PodSnapshot
      jsonPath: .spec.snapshotRef.name
      name: PodSnapshot
      type: string
    - description: PodSnapshot namespace
      jsonPath: .spec.snapshotRef.namespace
      name: Namespace
      type: string
    - description: Ready condition
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PodSnapshotContent is the Schema for the snapshotcontents API. It is the
          cluster-scoped artifact-of-record for a captured container checkpoint.

          No conversion: this type exists only in v1alpha1 (no other API version), so it
          is not part of any conversion scheme.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PodSnapshotContentSpec defines the desired state of PodSnapshotContent. It is
              populated by the PodSnapshotReconciler (operator) at creation time and is
              immutable thereafter.
            properties:
              containers:
                description: |-
                  Containers is the PodSnapshot's container settings, with defaults
                  applied, saved at creation. Every restore of this checkpoint uses them,
                  even if the PodSnapshot or SnapshotJob that asked for it changes or is
                  gone.
                items:
                  description: |-
                    ContainerSnapshotConfig holds the settings for one checkpointed container,
                    matched to it by name. Snapshot copies them into the PodSnapshotContent at
                    checkpoint time, and every restore of that checkpoint uses that copy.
                  properties:
                    checkpointReadinessProbe:
                      description: |-
                        CheckpointReadinessProbe tells when the application is safe to
                        checkpoint. When it is set, Snapshot waits for it instead of the
                        container's Ready condition. When it is omitted, Snapshot waits for the
                        container to be Ready, as before.
                      properties:
                        file:
                          description: |-
                            File succeeds when a regular file exists at the path, inside the
                            container.
                          properties:
                            path:
                              description: |-
                                Path is an absolute, clean path inside the container: no empty, "." or
                                ".." parts and no trailing slash, so two paths name the same file only
                                if they are equal. It must be on the container's own filesystem or an
                                emptyDir volume; paths on hostPath and PersistentVolumeClaim volumes are
                                refused.
                              maxLength: 4096
                              minLength: 2
                              type: string
                              x-kubernetes-validations:
                              - message: 'path must be absolute and clean: no empty,
                                  . or .. parts and no trailing slash'
                                rule: self.startsWith('/') && !self.endsWith('/')
                                  && !self.contains('//') && self.split('/').all(p,
                                  p != '.' && p != '..')
                          required:
                          - path
                          type: object
                        httpGet:
                          description: HTTPGet succeeds when a GET to the Pod IP returns
                            200.
                          properties:
                            path:
                              description: Path of the request. Empty means "/".
                              type: string
                            port:
                              anyOf:
                              - type: integer
                              - type: string
                              description: |-
                                Port on the Pod IP: a number from 1 to 65535, or the name of a port of
                                the container, resolved when the request is sent.
                              x-kubernetes-int-or-string: true
                              x-kubernetes-validations:
                              - message: port must be 1-65535 or a valid port name
                                rule: 'type(self) == int ? self >= 1 && self <= 65535
                                  : self.size() > 0 && self.size() <= 15 && self.matches(''^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'')
                                  && self.matches(''[a-z]'') && !self.contains(''--'')'
                          required:
                          - port
                          type: object
                        initialDelaySeconds:
                          default: 0
                          description: |-
                            InitialDelaySeconds is how long to wait after the container starts
                            before the first check.
                          format: int32
                          minimum: 0
                          type: integer
                        periodSeconds:
                          default: 1
                          description: PeriodSeconds is the time between checks.
                          format: int32
                          minimum: 1
                          type: integer
                        successThreshold:
                          default: 1
                          description: SuccessThreshold is how many checks in a row
                            must succeed.
                          format: int32
                          minimum: 1
                          type: integer
                        timeoutSeconds:
                          default: 1
                          description: TimeoutSeconds limits each check.
                          format: int32
                          minimum: 1
                          type: integer
                      type: object
                      x-kubernetes-validations:
                      - message: set exactly one of file or httpGet
                        rule: has(self.file) != has(self.httpGet)
                    lifecycle:
                      description: |-
                        Lifecycle holds actions Snapshot runs at points in the checkpoint and
                        restore lifecycle.
                      properties:
                        postRestore:
                          description: |-
                            PostRestore tells the application, after Snapshot restored its process
                            and GPU state, that it may resume.
                          properties:
                            file:
                              description: |-
                                File creates a regular file at the path, inside the container. The
                                parent directory must exist. If the file already exists before the
                                restore, the restore fails.
                              properties:
                                path:
                                  description: |-
                                    Path is an absolute, clean path inside the container: no empty, "." or
                                    ".." parts and no trailing slash, so two paths name the same file only
                                    if they are equal. It must be on the container's own filesystem or an
                                    emptyDir volume; paths on hostPath and PersistentVolumeClaim volumes are
                                    refused.
                                  maxLength: 4096
                                  minLength: 2
                                  type: string
                                  x-kubernetes-validations:
                                  - message: 'path must be absolute and clean: no
                                      empty, . or .. parts and no trailing slash'
                                    rule: self.startsWith('/') && !self.endsWith('/')
                                      && !self.contains('//') && self.split('/').all(p,
                                      p != '.' && p != '..')
                              required:
                              - path
                              type: object
                            httpPost:
                              description: |-
                                HTTPPost sends a POST with an empty body to the Pod IP. A 200 or 204
                                response means the application accepted the notification.
                              properties:
                                path:
                                  description: Path of the request. Empty means "/".
                                  type: string
                                port:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: |-
                                    Port on the Pod IP: a number from 1 to 65535, or the name of a port of
                                    the container, resolved when the request is sent.
                                  x-kubernetes-int-or-string: true
                                  x-kubernetes-validations:
                                  - message: port must be 1-65535 or a valid port
                                      name
                                    rule: 'type(self) == int ? self >= 1 && self <=
                                      65535 : self.size() > 0 && self.size() <= 15
                                      && self.matches(''^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'')
                                      && self.matches(''[a-z]'') && !self.contains(''--'')'
                              required:
                              - port
                              type: object
                            periodSeconds:
                              default: 1
                              description: PeriodSeconds is the time between attempts.
                              format: int32
                              minimum: 1
                              type: integer
                            timeoutSeconds:
                              default: 1
                              description: TimeoutSeconds limits each attempt.
                              format: int32
                              minimum: 1
                              type: integer
                          type: object
                          x-kubernetes-validations:
                          - message: set exactly one of file or httpPost
                            rule: has(self.file) != has(self.httpPost)
                      type: object
                    name:
                      description: Name of the checkpointed container these settings
                        apply to.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: checkpointReadinessProbe and lifecycle.postRestore must
                      use different file paths
                    rule: '!has(self.checkpointReadinessProbe) || !has(self.checkpointReadinessProbe.file)
                      || !has(self.lifecycle) || !has(self.lifecycle.postRestore)
                      || !has(self.lifecycle.postRestore.file) || self.checkpointReadinessProbe.file.path
                      != self.lifecycle.postRestore.file.path'
                maxItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              snapshotRef:
                description: |-
                  PodSnapshotRef is the back-pointer to the bound PodSnapshot. It may span
                  namespaces because PodSnapshotContent is cluster-scoped.
                properties:
                  name:
                    description: Name of the referenced PodSnapshot.
                    type: string
                  namespace:
                    description: Namespace of the referenced PodSnapshot.
                    type: string
                  uid:
                    description: |-
                      UID of the referenced PodSnapshot, recorded at binding time to detect a
                      stale reference after a delete and recreate.
                    type: string
                required:
                - name
                - namespace
                type: object
              source:
                description: 'Source describes what to capture: the source pod and
                  the node it runs on.'
                properties:
                  nodeName:
                    description: |-
                      NodeName is the node the source pod runs on, denormalized from the live
                      pod so it travels with PodRef as one immutable unit and selects the node
                      agent that performs the dump.
                    minLength: 1
                    type: string
                  podRef:
                    description: |-
                      PodRef identifies the pod to dump. Its UID guards against dumping a
                      same-named recreation of the pod.
                    properties:
                      containers:
                        description: |-
                          Containers narrows the capture to these containers of the source pod. The
                          node agent reads this instead of the source pod's target-container
                          annotation. v1alpha1 supports exactly one container; the cap is lifted when
                          the runtime supports multi-container capture.
                        items:
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        maxItems: 1
                        minItems: 1
                        type: array
                      name:
                        description: Name of the source pod.
                        minLength: 1
                        type: string
                      uid:
                        description: |-
                          UID of the source pod, recorded so the node agent dumps that specific
                          pod and not a same-named recreation.
                        type: string
                    required:
                    - containers
                    - name
                    type: object
                required:
                - nodeName
                - podRef
                type: object
              storage:
                description: |-
                  Storage binds this content to one configured store. Omitted on legacy
                  content; the producer will start writing it with artifact-flow integration.
                  Like the rest of spec it cannot be added, removed or changed after creation.
                properties:
                  storeID:
                    description: StoreID is the versioned canonical storage identity
                      shared with PageBroker.
                    maxLength: 73
                    pattern: ^store-v1-[0-9a-f]{64}$
                    type: string
                required:
                - storeID
                type: object
            required:
            - snapshotRef
            - source
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
            - message: containers must name containers in source.podRef.containers
              rule: '!has(self.containers) || self.containers.all(c, c.name in self.source.podRef.containers)'
          status:
            description: PodSnapshotContentStatus defines the observed state of PodSnapshotContent.
            properties:
              conditions:
                description: |-
                  Conditions reflect the latest observations of the PodSnapshotContent's state.
                  Standard types are Ready and Failed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              source:
                description: |-
                  Source publishes what the checkpoint was captured on, written when the
                  capture goes Ready.
                properties:
                  devices:
                    description: Devices records the devices the capture could see,
                      grouped by vendor.
                    properties:
                      nvidia:
                        description: Nvidia records the NVIDIA GPUs the capture could
                          see.
                        properties:
                          driverVersion:
                            description: DriverVersion is the NVIDIA driver the capture
                              ran against.
                            type: string
                          instances:
                            description: |-
                              Instances lists one entry per GPU the captured container could see, so
                              the count is the length of this list.
                            items:
                              description: |-
                                NvidiaCheckpointSourceInstance is one GPU. UUIDs are deliberately left out:
                                they identify a physical card rather than describe what a restore target has
                                to match.
                              properties:
                                productName:
                                  description: ProductName is the GPU model, as nvidia-smi
                                    reports it.
                                  type: string
                              type: object
                            type: array
                        type: object
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  node:
                    description: Node records the machine the checkpoint was captured
                      on.
                    properties:
                      architecture:
                        description: Architecture is the node's CPU architecture,
                          as GOARCH spells it.
                        type: string
                      kernelVersion:
                        description: KernelVersion is the node's kernel release.
                        type: string
                      name:
                        description: Name is the node the source pod ran on.
                        type: string
                    type: object
                  pod:
                    description: Pod records the container the checkpoint was captured
                      from.
                    properties:
                      cpu:
                        description: CPU is the container's CPU limit, absent if it
                          had none.
                        type: string
                      image:
                        description: Image is the container image reference the capture
                          ran.
                        type: string
                      imageDigest:
                        description: |-
                          ImageDigest identifies which build of the container image the capture
                          ran, which a mutable tag does not.
                        type: string
                      memory:
                        description: Memory is the container's memory limit, absent
                          if it had none.
                        type: string
                    type: object
                type: object
              storage:
                description: |-
                  Storage records confirmed per-container publications. Existing filesystem
                  callers leave this absent; its presence does not replace Ready/Failed.
                properties:
                  artifacts:
                    description: |-
                      Artifacts contains one descriptor per confirmed container. It can be
                      partial during capture/recovery; Ready still requires all captures to finish.
                    items:
                      description: |-
                        PublishedContainerArtifact is the persisted part of PageBroker's
                        PublishedArtifact, associated with a captured container. Readers pass the
                        handle back unchanged; they must not construct filesystem paths.
                      properties:
                        artifactHandle:
                          description: ArtifactHandle is an opaque locator within
                            the bound store.
                          maxLength: 4096
                          minLength: 1
                          pattern: \S
                          type: string
                        containerName:
                          description: ContainerName selects the captured container
                            within the content.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      required:
                      - artifactHandle
                      - containerName
                      type: object
                    maxItems: 128
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - containerName
                    x-kubernetes-list-type: map
                required:
                - artifacts
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: publication descriptors require a storage binding
          rule: '!has(self.status) || !has(self.status.storage) || has(self.spec.storage)'
        - message: publication descriptors must name captured containers
          rule: '!has(self.status) || !has(self.status.storage) || self.status.storage.artifacts.all(a,
            self.spec.source.podRef.containers.exists(c, c == a.containerName))'
    served: true
    storage: true
    subresources:
      status: {}
