---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: podsnapshots.nvidia.com
spec:
  group: nvidia.com
  names:
    kind: PodSnapshot
    listKind: PodSnapshotList
    plural: podsnapshots
    shortNames:
    - podsnap
    singular: podsnapshot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Bound PodSnapshotContent
      jsonPath: .status.boundSnapshotContentName
      name: Content
      type: string
    - description: Ready condition
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PodSnapshot is the Schema for the snapshots API. It is the namespaced binding
          for a captured container checkpoint and is consumed by restore paths.

          No conversion: this type exists only in v1alpha1 (no other API version), so it
          is not part of any conversion scheme.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PodSnapshotSpec defines the desired state of PodSnapshot.
            properties:
              checkpointRetryLimit:
                description: |-
                  CheckpointRetryLimit is how many times a failed capture may be retried in
                  place, over and above the first attempt: 0 means one attempt and no retry.
                  Unset means this request expressed no preference and the agent's
                  cluster-wide default applies, which is distinct from an explicit 0.
                format: int32
                minimum: 0
                type: integer
              containers:
                description: |-
                  Containers holds settings for the checkpointed containers, matched by
                  name to source.podRef.containers. It is a separate list so settings stay
                  the same when other kinds of source are added.
                items:
                  description: |-
                    ContainerSnapshotConfig holds the settings for one checkpointed container,
                    matched to it by name. Snapshot copies them into the PodSnapshotContent at
                    checkpoint time, and every restore of that checkpoint uses that copy.

                    Not enabled yet: the operator rejects a checkpointReadinessProbe or a
                    lifecycle until support is complete.
                  properties:
                    checkpointReadinessProbe:
                      description: |-
                        CheckpointReadinessProbe tells when the application is safe to
                        checkpoint. When it is set, Snapshot waits for it instead of the
                        container's Ready condition. When it is omitted, Snapshot waits for the
                        container to be Ready, as before.
                      properties:
                        file:
                          description: |-
                            File succeeds when a regular file exists at the path, inside the
                            container. Like an exec probe, Snapshot checks it by running /bin/sh
                            in the container, as the container's user, so the image needs a shell.
                          properties:
                            path:
                              description: |-
                                Path is an absolute, clean path inside the container: no empty, "." or
                                ".." parts and no trailing slash, so two paths name the same file only
                                if they are equal. Any path the container's user can reach works,
                                volumes included, except the files Snapshot itself writes in the
                                snapshot-control volume. A file on a volume that outlives the Pod stays
                                there for the next checkpoint or restore unless the application
                                removes it.
                              maxLength: 4096
                              minLength: 2
                              type: string
                              x-kubernetes-validations:
                              - message: 'path must be absolute and clean: no empty,
                                  . or .. parts and no trailing slash'
                                rule: self.startsWith('/') && !self.endsWith('/')
                                  && !self.contains('//') && self.split('/').all(p,
                                  p != '.' && p != '..')
                          required:
                          - path
                          type: object
                        httpGet:
                          description: |-
                            HTTPGet succeeds when a GET to the Pod IP returns a status from 200 to
                            399.
                          properties:
                            path:
                              description: Path of the request. Empty means "/".
                              type: string
                            port:
                              anyOf:
                              - type: integer
                              - type: string
                              description: |-
                                Port on the Pod IP: a number from 1 to 65535, or the name of a port of
                                the container, resolved when the request is sent.
                              x-kubernetes-int-or-string: true
                              x-kubernetes-validations:
                              - message: port must be 1-65535 or a valid port name
                                rule: 'type(self) == int ? self >= 1 && self <= 65535
                                  : self.size() > 0 && self.size() <= 15 && self.matches(''^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'')
                                  && self.matches(''[a-z]'') && !self.contains(''--'')'
                          required:
                          - port
                          type: object
                        initialDelaySeconds:
                          default: 0
                          description: |-
                            InitialDelaySeconds is how long to wait after the container starts
                            before the first check.
                          format: int32
                          minimum: 0
                          type: integer
                        periodSeconds:
                          default: 1
                          description: PeriodSeconds is the time between checks.
                          format: int32
                          minimum: 1
                          type: integer
                        successThreshold:
                          default: 1
                          description: SuccessThreshold is how many checks in a row
                            must succeed.
                          format: int32
                          minimum: 1
                          type: integer
                        timeoutSeconds:
                          default: 1
                          description: TimeoutSeconds limits each check.
                          format: int32
                          minimum: 1
                          type: integer
                      type: object
                      x-kubernetes-validations:
                      - message: set exactly one of file or httpGet
                        rule: has(self.file) != has(self.httpGet)
                    lifecycle:
                      description: |-
                        Lifecycle holds actions Snapshot runs at points in the checkpoint and
                        restore lifecycle.
                      properties:
                        postRestore:
                          description: |-
                            PostRestore tells the application, after Snapshot restored its process
                            and GPU state, that it may resume.
                          properties:
                            file:
                              description: |-
                                File creates an empty regular file at the path, inside the container.
                                Like an exec probe, Snapshot creates it by running /bin/sh in the
                                container, as the container's user, so the image needs a shell. The
                                parent directory must exist. If the file already exists before the
                                restore, the restore fails.
                              properties:
                                path:
                                  description: |-
                                    Path is an absolute, clean path inside the container: no empty, "." or
                                    ".." parts and no trailing slash, so two paths name the same file only
                                    if they are equal. Any path the container's user can reach works,
                                    volumes included, except the files Snapshot itself writes in the
                                    snapshot-control volume. A file on a volume that outlives the Pod stays
                                    there for the next checkpoint or restore unless the application
                                    removes it.
                                  maxLength: 4096
                                  minLength: 2
                                  type: string
                                  x-kubernetes-validations:
                                  - message: 'path must be absolute and clean: no
                                      empty, . or .. parts and no trailing slash'
                                    rule: self.startsWith('/') && !self.endsWith('/')
                                      && !self.contains('//') && self.split('/').all(p,
                                      p != '.' && p != '..')
                              required:
                              - path
                              type: object
                            httpPost:
                              description: |-
                                HTTPPost sends a POST with an empty body to the Pod IP. A status from
                                200 to 399 means the application accepted the notification.
                              properties:
                                path:
                                  description: Path of the request. Empty means "/".
                                  type: string
                                port:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: |-
                                    Port on the Pod IP: a number from 1 to 65535, or the name of a port of
                                    the container, resolved when the request is sent.
                                  x-kubernetes-int-or-string: true
                                  x-kubernetes-validations:
                                  - message: port must be 1-65535 or a valid port
                                      name
                                    rule: 'type(self) == int ? self >= 1 && self <=
                                      65535 : self.size() > 0 && self.size() <= 15
                                      && self.matches(''^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'')
                                      && self.matches(''[a-z]'') && !self.contains(''--'')'
                              required:
                              - port
                              type: object
                            periodSeconds:
                              default: 1
                              description: PeriodSeconds is the time between attempts.
                              format: int32
                              minimum: 1
                              type: integer
                            timeoutSeconds:
                              default: 1
                              description: TimeoutSeconds limits each attempt.
                              format: int32
                              minimum: 1
                              type: integer
                          type: object
                          x-kubernetes-validations:
                          - message: set exactly one of file or httpPost
                            rule: has(self.file) != has(self.httpPost)
                      type: object
                    name:
                      description: Name of the checkpointed container these settings
                        apply to.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: checkpointReadinessProbe and lifecycle.postRestore must
                      use different file paths
                    rule: '!has(self.checkpointReadinessProbe) || !has(self.checkpointReadinessProbe.file)
                      || !has(self.lifecycle) || !has(self.lifecycle.postRestore)
                      || !has(self.lifecycle.postRestore.file) || self.checkpointReadinessProbe.file.path
                      != self.lifecycle.postRestore.file.path'
                maxItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              source:
                description: |-
                  Source identifies the captured workload. It is a struct (rather than an
                  inlined reference) so future source variants can be added additively.
                properties:
                  podRef:
                    description: |-
                      PodRef references the pod, in the PodSnapshot's namespace, that is captured.
                      The operator prepares the pod (control volume, checkpoint storage mount)
                      before creating the PodSnapshot. The capture target container is carried on
                      PodRef.Containers, not a pod annotation.
                    properties:
                      containers:
                        description: |-
                          Containers narrows the capture to these containers of the source pod. The
                          node agent reads this instead of the source pod's target-container
                          annotation. v1alpha1 supports exactly one container; the cap is lifted when
                          the runtime supports multi-container capture.
                        items:
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        maxItems: 1
                        minItems: 1
                        type: array
                      name:
                        description: Name of the source pod.
                        minLength: 1
                        type: string
                      uid:
                        description: |-
                          UID of the source pod, recorded so the node agent dumps that specific
                          pod and not a same-named recreation.
                        type: string
                    required:
                    - containers
                    - name
                    type: object
                required:
                - podRef
                type: object
            required:
            - source
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
            - message: containers must name containers in source.podRef.containers
              rule: '!has(self.containers) || self.containers.all(c, c.name in self.source.podRef.containers)'
          status:
            description: PodSnapshotStatus defines the observed state of PodSnapshot.
            properties:
              boundSnapshotContentName:
                description: |-
                  BoundPodSnapshotContentName is the name of the cluster-scoped PodSnapshotContent
                  this PodSnapshot is bound to. It is nil until the agent has created the
                  content and recorded the binding.
                type: string
              conditions:
                description: |-
                  Conditions reflect the latest observations of the PodSnapshot's state.
                  Standard types are Ready and Failed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
