image:
  operator:
    repository: ghcr.io/ai-dynamo/snapshot/operator
    # Defaults to the chart's appVersion when empty (see templates).
    tag: ""
    pullPolicy: IfNotPresent
    imagePullSecrets: []
  agent:
    repository: ghcr.io/ai-dynamo/snapshot/agent
    # Defaults to the chart's appVersion when empty (see templates).
    tag: ""
    pullPolicy: Always
  # The PageBroker sidecar always uses image.agent.tag: the two speak an
  # internal protocol and ship as a pair.
  pageBroker:
    repository: ghcr.io/ai-dynamo/snapshot/pagebroker
    pullPolicy: Always

replicaCount: 1

operator:
  # Enable only after the compatible agent/PageBroker rollout completes; see docs/operations/storage.md.
  bindNewContents: false
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # Node selector for the operator pod
  nodeSelector: {}

  # Affinity rules for the operator pod
  affinity: {}

  # Tolerations for the operator pod
  tolerations: []

  artifactCleanup:
    # Frequency of pending finalizer recovery and authoritative orphan artifact scans.
    scanInterval: 10m
    # Maximum orphan roots removed serially in one scan.
    batchSize: 10
    # Total metadata-list attempts before a scan fails closed.
    listAttempts: 3
    # Concurrent maintenance workers processing delete-content and sweep work items.
    workers: 5
    # Maximum time one work item may run before it is abandoned and retried.
    taskTimeout: 10m

# `helm upgrade` leaves CRDs alone by design; the crd-installer init container
# closes that gap on every rollout, and is a no-op when nothing changed.
crdUpgrade:
  # NOTICE FOR THE CLUSTER ADMIN: disabling this makes keeping the CRDs current
  # your job, otherwise the operator runs against stale definitions and silently
  # drops new fields:
  #   kubectl apply --server-side --force-conflicts -f ./charts/snapshot/crds/
  enabled: true

  # trace, debug, info, warn, error
  logLevel: info

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Container runtime backend. Leave socketPath/storageDir empty to use the
# conventional paths for the chosen type.
runtime:
  type: containerd  # containerd | crio
  socketPath: ""
  # Host per-container storage, mounted into the agent at the same absolute path.
  # Defaults: /var/lib/containerd (containerd), /var/lib/containers (crio).
  # RKE2: /var/lib/rancher/rke2/agent/containerd + socketPath /run/k3s/containerd/containerd.sock
  storageDir: ""

# Gates the OCP RBAC template and the DS required-scc annotation. Keep false
# on vanilla Kubernetes (it references an OCP-only built-in SCC).
openshift:
  enabled: false

# Installation-level storage configuration. The chart resolves these values for
# the operator and PageBroker; backend details are not part of the agent API.
storage:
  # Storage type stays snapshot-owned for future backend expansion.
  # pvc and s3 are implemented today.
  type: pvc

  # PVC configuration (when type=pvc)
  pvc:
    # Create a new PVC (set to false if using existing PVC)
    create: true
    # Checkpoint PVC name, in the Helm release namespace. Name and namespace
    # identify the store; create/size/storageClass only control provisioning.
    name: snapshot-pvc
    # PVC size
    size: 1Ti
    # Storage class (leave empty for default)
    storageClass: ""
    # Fixed container-local PVC mount path, not a store identity input. Artifacts
    # use the claim root (/); the privileged helper enforces this local mount.
    basePath: /checkpoints

  # S3-compatible object storage (when type=s3). Requires a PageBroker image
  # implementing the S3 backend (see #416). Endpoint, region, bucket and
  # prefix are identity inputs: see api/storage.S3.StoreID.
  s3:
    # S3-compatible endpoint, an absolute http(s) URL with no path, query or
    # userinfo, e.g. "https://s3.us-east-1.amazonaws.com".
    endpoint: ""
    region: ""
    bucket: ""
    # Key prefix inside the bucket. Empty identifies the bucket root.
    prefix: ""
    # Secret with standard AWS credential env vars (AWS_ACCESS_KEY_ID,
    # AWS_SECRET_ACCESS_KEY, optionally AWS_SESSION_TOKEN), injected into the
    # agent and PageBroker containers. Leave empty to rely on another
    # provider in the AWS SDK's default chain (e.g. IRSA).
    #
    # This does NOT configure the operator's own S3 maintenance backend
    # (operator/internal/maintenance/backends/s3.go), which authenticates
    # separately through a shared credentials file at
    # --artifact-cleanup-s3-credentials-path and cannot use env vars or IRSA
    # today. Wiring that flag from this value, or unifying the two credential
    # mechanisms, is a follow-up.
    credentialsSecretRef: ""

  # Reserved for future snapshot-owned backends. Unsupported today.
  oci:
    uri: ""

# PageBroker sidecar: stages checkpoint images in memory and publishes them to
# the checkpoint PVC it shares with the agent. See docs/operations/storage.md.
pageBroker:
  # Requires a PageBroker image implementing the PVC artifact backend. Roll this out before binding new contents.
  artifactAddressing: false
  # Restore directly from the checkpoint directory, or opt into a staged copy.
  restoreMode: direct
  maxConcurrentRequests: 16
  staging:
    # RAM on the node, unbounded without this cap. Lowered to fit when it does
    # not leave the writing container room; see docs/operations/storage.md.
    sizeLimit: 56Gi
  # Allocate and register the full ring before accepting GPU work.
  # Defaults reserve 4 GiB per visible GPU, or 32 GiB on an eight-GPU node.
  transferBufferCount: 32
  # 128 MiB per slot. Must be a positive multiple of 4096 bytes.
  transferChunkBytes: 134217728
  # Zero is uncapped. This limit includes CUDA allocation-granularity rounding.
  maxPinnedBytes: 0
  # Requires 32 GiB of free allocatable memory, plus the agent request.
  # Override for each node profile. Budget 4 GiB per GPU plus process and staging
  # overhead. A lower request does not reduce the pinned ring allocation.
  resources:
    requests:
      cpu: 8
      memory: 32Gi
    limits:
      cpu: 32
      memory: 256Gi

# DaemonSet configuration for the checkpoint/restore agent
daemonset:
  # Agent and nsrestore log level (trace, debug, info, warn, error)
  snapshotLogLevel: info

  # Limits the restore proxy to Pods in this host namespace on the node, and
  # leaves other restore Pods alone. Set it when other clusters share the
  # nodes, such as vCluster tenants: in a vCluster, set it to the vCluster's
  # host namespace. Every Snapshot install on the shared nodes must set its
  # own; an install with it empty acts on every restore Pod on its nodes.
  nriHostNamespace: ""

  # The shipped agent image is public on GHCR. Set this only when an image
  # override is hosted in a private registry.
  imagePullSecrets: []

  # RuntimeClass for the agent pod. CUDA checkpoint/restore requires the NVIDIA
  # container runtime, which the GPU Operator exposes as RuntimeClass "nvidia".
  # Set to "" when the NVIDIA runtime is already containerd's default and no
  # such RuntimeClass exists; the field is then left out of the pod spec.
  runtimeClassName: nvidia

  # Resource limits and requests. CRIU writes the checkpoint image into the
  # memory-backed PageBroker staging volume from this container, so
  # limits.memory also bounds the largest checkpoint image.
  resources:
    limits:
      cpu: 4
      memory: 64Gi
    requests:
      cpu: 2
      memory: 1Gi

  # Node selector - target GPU nodes
  nodeSelector:
    nvidia.com/gpu.present: "true"

  # Tolerations for GPU nodes
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Exists
      effect: NoSchedule

  # Pod labels
  podLabels: {}

  # Pod annotations
  podAnnotations: {}

  # Affinity rules
  affinity: {}

  # Init container configuration
  initContainer:
    # Busybox image for seccomp profile deployment. Pinned by digest: this is
    # the one image the chart pulls that NVIDIA does not build, and a mutable
    # tag would let its contents change under an unchanged chart version.
    image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    # Left empty so the template derives it: IfNotPresent for a digest-pinned
    # image, Always otherwise. Overriding `image` with a mutable tag therefore
    # keeps pulling, instead of silently reusing a stale cached layer.
    imagePullPolicy: ""
    # The agent's resources do not cover this container. Defaults are small: it
    # copies one file and exits, but a namespace with a ResourceQuota that
    # requires limits would reject the pod without them.
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 16Mi

# Seccomp profile configuration
# CRIU can't checkpoint io_uring; this gates the block-iouring ConfigMap and
# the initContainer that writes the profile. Set to false on RHCOS 9.6+, which
# already blocks io_uring at the kernel.
seccomp:
  # Deploy seccomp profile for blocking io_uring (required for CRIU).
  # Use seccomp.deploy; seccomp.enabled is not a chart value.
  deploy: true

# Service account configuration for the agent
serviceAccount:
  # Create service account
  create: true
  # Service account name (generated if not set)
  name: ""
  # Annotations for service account (e.g., for IRSA)
  annotations: {}

# RBAC configuration
rbac:
  # Create RBAC resources (agent and operator)
  create: true

# Static agent configuration (loaded from ConfigMap)
# Dynamic values such as NODE_NAME come from environment variables.
config:
  overlay:
    # Rootfs diff tar exclusions. Absolute-looking paths are normalized
    # relative to the tar root, and patterns starting with * are passed
    # through as tar globs unchanged. A file the checkpointed processes hold
    # open or mapped at dump time is archived even when an exclusion matches
    # it, so CRIU can reopen it. Other excluded files are not restored; the
    # workload must recreate them if needed.
    exclusions:
      - /proc
      - /sys
      - /dev
      - "*/.cache/huggingface"
      - "*/__pycache__"
      - "*.pyc"

  checkpoint:
    # Maximum seconds before the agent marks a checkpoint failed.
    checkpointTimeoutSeconds: 3600
    # Times a failed capture may be retried in place, beyond the first attempt.
    # A PodSnapshot can override it with spec.checkpointRetryLimit; 0 keeps
    # retry opt-in, so upgrading changes no existing capture's behaviour.
    retryLimit: 0

  restore:
    # Maximum seconds to allow a restore attempt before the agent marks it failed
    restoreTimeoutSeconds: 7200
    # Skip the restore compatibility check on every restore this agent handles.
    # The gate refuses a restore whose checkpoint was captured somewhere the
    # target node cannot reproduce; turning it off means those restores are
    # attempted and fail inside CRIU instead. Per-node escape hatch; a single
    # restore can opt out with the nvidia.com/snapshot-skip-compat-check
    # annotation on the restore pod.
    skipCompatCheck: false

  criu:
    # Path to the criu binary
    binaryPath: /usr/local/sbin/criu
    # Ghost file size limit in bytes. Deleted-but-open files smaller than this
    # are saved inline in the checkpoint image as ghost files.
    ghostLimit: 536870912
    # CRIU logging verbosity (0-4)
    logLevel: 4
    # CRIU work directory for temporary files
    workDir: /var/criu-work

    # K8s-specific options (recommended defaults for containers)
    # Note: the source process is always terminated by a checkpoint; there is
    # no leave-running mode.
    shellJob: true          # Containers are often session leaders
    tcpClose: false         # Do not close non-listening TCP sockets on restore
    tcpEstablished: true    # Preserve established TCP sockets during restore
    fileLocks: true         # Applications use file locks
    orphanPtsMaster: true   # Containers with TTYs
    extUnixSk: true         # External Unix sockets
    linkRemap: true         # Required for deleted-but-open files (e.g. POSIX semaphores in /dev/shm)
    extMasters: true        # External bind mount masters
    manageCgroupsMode: soft # CRIU cgroup management mode (ignore/soft/full/strict)
    imageIoMode: direct     # CRIU image I/O mode (writeback/direct); direct uses O_DIRECT to avoid page-cache double-buffering

    # Restore-specific options (only apply during CRIU restore, not dump)
    rstSibling: true         # Restore as sibling process (required for go-criu swrk mode)
    mntnsCompatMode: false   # Mount namespace compatibility mode
    evasiveDevices: true     # Use any device path if original is inaccessible
    forceIrmap: true         # Force resolving inotify/fsnotify watch names

    # Advanced options
    autoDedup: false        # Auto-deduplication of memory pages
    lazyPages: false        # Lazy page migration (experimental)

    # Config file options (NOT available via RPC - written to criu.conf)
    # Dedicated directory for the CRIU plugins used by this chart.
    # Do not point this at CRIU's global plugin dir, which can load unrelated
    # plugins such as the CRIU CUDA plugin.
    libDir: "/usr/local/lib/snapshot/criu-plugins"
    allowUprobes: true             # Leave enabled for kernel/userspace probe compatibility
    skipInFlight: true             # Skip in-flight TCP connections
