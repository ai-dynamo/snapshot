run:
  timeout: 10m
  allow-parallel-runners: true

issues:
  exclude-rules:
    # Kubebuilder printcolumn/XValidation markers and API contract lines cannot
    # be wrapped; the versioned protocol helpers carry long error strings.
    - path: "v1alpha1/"
      linters:
        - lll
    # Table-driven tests legitimately repeat literals and run long.
    - path: "_test\\.go"
      linters:
        - dupl
        - goconst
        - gocyclo
        - prealloc
        - unparam

linters:
  disable-all: true
  enable:
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - staticcheck
    - typecheck
    - unconvert
    - unparam
    - unused
