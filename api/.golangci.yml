version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    staticcheck:
      # v1 ran staticcheck (SA*) and gosimple (S1*). v2 merges both into
      # staticcheck and adds the ST* and QF* check sets by default; keep
      # the original scope so the toolchain bump does not quietly widen
      # what CI enforces.
      checks:
        - SA*
        - S1*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        path: v1alpha1/
      - linters:
          - dupl
          - goconst
          - gocyclo
          - prealloc
          - unparam
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
