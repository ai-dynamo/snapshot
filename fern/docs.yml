# This site is for reviewing the docs structure. The configuration is removed
# before the pull request merges. The instance URL below is a placeholder.
instances:
  - url: nvidia-snapshot.docs.buildwithfern.com/snapshot

title: NVIDIA Snapshot Documentation

global-theme: nvidia

logo:
  right-text: Snapshot

check:
  rules:
    broken-links: warn

navbar-links:
  - type: github
    value: https://github.com/ai-dynamo/snapshot

