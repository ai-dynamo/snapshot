name: Create e2e vCluster
description: >-
  Install the vCluster CLI, validate the host GPU cluster, and create the
  per-run vCluster. Needs uv installed by the calling job, and reads its
  SNAPSHOT_E2E_* environment.

runs:
  using: composite
  steps:
    - name: Install vCluster CLI
      uses: ./.github/actions/install-vcluster-cli

    - name: Validate Python tooling
      shell: bash
      run: |
        set -euo pipefail
        uv --version

    - name: Validate host GPU cluster
      shell: bash
      run: |
        set -euo pipefail
        uv run --locked --project e2e python -m snapshot_e2e.infra.setup \
          --phase host-preflight

    - name: Create vCluster target
      shell: bash
      run: |
        set -euo pipefail
        uv run --locked --project e2e python -m snapshot_e2e.infra.setup \
          --phase vcluster
