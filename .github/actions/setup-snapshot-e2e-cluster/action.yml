name: Setup Snapshot E2E Cluster
description: Prepare a vCluster-backed Kubernetes target for Snapshot e2e.

inputs:
  mode:
    description: Setup mode. Only ci-vcluster is implemented in this action.
    required: false
    default: ci-vcluster
  host_namespace:
    description: Host namespace for the vCluster. Defaults to snapshot-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.
    required: false
    default: ""
  vcluster_name:
    description: vCluster release name. Defaults to host_namespace.
    required: false
    default: ""
  test_namespace:
    description: Namespace inside the vCluster where Snapshot is installed.
    required: false
    default: snapshot-e2e
  snapshot_release:
    description: Snapshot Helm release name.
    required: false
    default: snapshot
  snapshot_tag:
    description: Operator and agent image tag for the Snapshot chart.
    required: false
    default: v0.0.0-g71827d8e
  pvc_name:
    description: Checkpoint PVC name inside the vCluster test namespace.
    required: false
    default: snapshot-pvc
  pvc_size:
    description: Checkpoint PVC requested size.
    required: false
    default: 20Gi
  vcluster_k8s_version:
    description: Kubernetes version for the vCluster control plane.
    required: false
    default: v1.32.13
  vcluster_version:
    description: vCluster CLI version to install.
    required: false
    default: v0.33.0
  vcluster_local_port:
    description: Local port used for the vCluster API port-forward.
    required: false
    default: "8443"
  helm_timeout:
    description: Timeout for Helm installs.
    required: false
    default: 10m
  ready_timeout_seconds:
    description: Timeout in seconds for readiness polling.
    required: false
    default: "900"

outputs:
  host_namespace:
    description: Host namespace containing the vCluster.
    value: ${{ steps.resolve.outputs.host_namespace }}
  vcluster_name:
    description: vCluster release name.
    value: ${{ steps.resolve.outputs.vcluster_name }}
  test_namespace:
    description: Namespace inside the vCluster where Snapshot is installed.
    value: ${{ steps.resolve.outputs.test_namespace }}
  vcluster_kubeconfig:
    description: Path to the generated vCluster kubeconfig.
    value: ${{ steps.resolve.outputs.vcluster_kubeconfig }}
  snapshot_release:
    description: Snapshot Helm release name.
    value: ${{ steps.resolve.outputs.snapshot_release }}

runs:
  using: composite
  steps:
    - name: Resolve inputs
      id: resolve
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_HOST_NAMESPACE: ${{ inputs.host_namespace }}
        INPUT_VCLUSTER_NAME: ${{ inputs.vcluster_name }}
        INPUT_TEST_NAMESPACE: ${{ inputs.test_namespace }}
        INPUT_SNAPSHOT_RELEASE: ${{ inputs.snapshot_release }}
      run: |
        set -euo pipefail

        if [[ "${INPUT_MODE}" != "ci-vcluster" ]]; then
          echo "::error::setup-snapshot-e2e-cluster only supports mode=ci-vcluster"
          exit 1
        fi

        run_id="${GITHUB_RUN_ID:-manual}"
        run_attempt="${GITHUB_RUN_ATTEMPT:-1}"
        host_namespace="${INPUT_HOST_NAMESPACE:-snapshot-e2e-${run_id}-${run_attempt}}"
        vcluster_name="${INPUT_VCLUSTER_NAME:-${host_namespace}}"
        vcluster_kubeconfig="${GITHUB_WORKSPACE}/.kubeconfig-snapshot-e2e"

        {
          echo "host_namespace=${host_namespace}"
          echo "vcluster_name=${vcluster_name}"
          echo "test_namespace=${INPUT_TEST_NAMESPACE}"
          echo "vcluster_kubeconfig=${vcluster_kubeconfig}"
          echo "snapshot_release=${INPUT_SNAPSHOT_RELEASE}"
        } >> "${GITHUB_OUTPUT}"

        {
          echo "SNAPSHOT_E2E_HOST_NAMESPACE=${host_namespace}"
          echo "SNAPSHOT_E2E_VCLUSTER_NAME=${vcluster_name}"
          echo "SNAPSHOT_E2E_TEST_NAMESPACE=${INPUT_TEST_NAMESPACE}"
          echo "SNAPSHOT_E2E_VCLUSTER_KUBECONFIG=${vcluster_kubeconfig}"
          echo "KUBECONFIG=${vcluster_kubeconfig}"
        } >> "${GITHUB_ENV}"

    - name: Install vCluster CLI
      uses: ./.github/actions/install-vcluster-cli
      with:
        vcluster_version: ${{ inputs.vcluster_version }}

    - name: Install uv
      shell: bash
      run: |
        echo "::group::Install uv"
        set -euo pipefail

        if ! command -v uv >/dev/null 2>&1; then
          curl --retry 5 --retry-delay 2 \
            --connect-timeout 10 --max-time 120 \
            --fail --show-error -LsSf \
            https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/bin:${PATH}"
        fi

        uv --version
        echo "::endgroup::"

    - name: Host preflight
      shell: bash
      run: |
        echo "::group::Snapshot e2e host preflight"
        set -euo pipefail
        uv run --project e2e python -m snapshot_e2e.infra.preflight
        echo "::endgroup::"

    - name: Create host namespace
      shell: bash
      env:
        HOST_NAMESPACE: ${{ steps.resolve.outputs.host_namespace }}
      run: |
        echo "::group::Create host namespace ${HOST_NAMESPACE}"
        set -euo pipefail

        kubectl create namespace "${HOST_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
        kubectl label namespace "${HOST_NAMESPACE}" \
          snapshot-e2e=true \
          snapshot.github/run-id="${GITHUB_RUN_ID:-manual}" \
          snapshot.github/run-attempt="${GITHUB_RUN_ATTEMPT:-1}" \
          nscleanup/enabled=true \
          nscleanup/ttl=7200 \
          --overwrite
        echo "::endgroup::"

    - name: Check vCluster name is unused
      shell: bash
      env:
        HOST_NAMESPACE: ${{ steps.resolve.outputs.host_namespace }}
        VCLUSTER_NAME: ${{ steps.resolve.outputs.vcluster_name }}
      run: |
        echo "::group::Check vCluster name ${VCLUSTER_NAME}"
        set -euo pipefail

        if kubectl get statefulset "${VCLUSTER_NAME}" -n "${HOST_NAMESPACE}" >/dev/null 2>&1; then
          echo "::error::vCluster statefulset ${HOST_NAMESPACE}/${VCLUSTER_NAME} already exists"
          exit 1
        fi

        if helm status "${VCLUSTER_NAME}" -n "${HOST_NAMESPACE}" >/dev/null 2>&1; then
          echo "::error::vCluster Helm release ${HOST_NAMESPACE}/${VCLUSTER_NAME} already exists"
          exit 1
        fi

        echo "vCluster name is available"
        echo "::endgroup::"

    - name: Create vCluster
      shell: bash
      env:
        HOST_NAMESPACE: ${{ steps.resolve.outputs.host_namespace }}
        VCLUSTER_NAME: ${{ steps.resolve.outputs.vcluster_name }}
        VCLUSTER_K8S_VERSION: ${{ inputs.vcluster_k8s_version }}
      run: |
        echo "::group::Create vCluster ${VCLUSTER_NAME}"
        set -euo pipefail

        values_file="${RUNNER_TEMP}/snapshot-vcluster-values.yaml"
        cat > "${values_file}" <<'EOF'
        controlPlane:
          hostPathMapper:
            enabled: true
        sync:
          fromHost:
            nodes:
              enabled: true
              clearImageStatus: true
              selector:
                labels:
                  kubernetes.azure.com/mode: "user"
            runtimeClasses:
              enabled: true
            storageClasses:
              enabled: true
        EOF

        vcluster create "${VCLUSTER_NAME}" \
          --namespace "${HOST_NAMESPACE}" \
          --connect=false \
          --upgrade \
          --set controlPlane.distro.k8s.enabled=true \
          --set "controlPlane.distro.k8s.version=${VCLUSTER_K8S_VERSION}" \
          --values "${values_file}"

        kubectl wait --for=condition=ready pod \
          -l "app=vcluster,release=${VCLUSTER_NAME}" \
          -n "${HOST_NAMESPACE}" \
          --timeout=900s
        echo "::endgroup::"

    - name: Install vCluster HostPath Mapper
      shell: bash
      env:
        HOST_NAMESPACE: ${{ steps.resolve.outputs.host_namespace }}
        VCLUSTER_NAME: ${{ steps.resolve.outputs.vcluster_name }}
        HELM_TIMEOUT: ${{ inputs.helm_timeout }}
      run: |
        echo "::group::Install vCluster HostPath Mapper"
        set -euo pipefail

        values_file="${RUNNER_TEMP}/snapshot-vcluster-hpm-values.yaml"
        cat > "${values_file}" <<'EOF'
        nodeSelector:
          nvidia.com/gpu.present: "true"
        tolerations:
          - operator: Exists
        EOF

        helm upgrade --install vcluster-hpm vcluster-hpm \
          --repo https://charts.loft.sh \
          --namespace "${HOST_NAMESPACE}" \
          --wait \
          --timeout "${HELM_TIMEOUT}" \
          --set "VclusterReleaseName=${VCLUSTER_NAME}" \
          --values "${values_file}"

        kubectl rollout status daemonset/vcluster-hpm-hostpath-mapper \
          -n "${HOST_NAMESPACE}" \
          --timeout=600s
        echo "::endgroup::"

    - name: Connect to vCluster
      shell: bash
      env:
        HOST_NAMESPACE: ${{ steps.resolve.outputs.host_namespace }}
        VCLUSTER_NAME: ${{ steps.resolve.outputs.vcluster_name }}
        VCLUSTER_KUBECONFIG: ${{ steps.resolve.outputs.vcluster_kubeconfig }}
        VCLUSTER_LOCAL_PORT: ${{ inputs.vcluster_local_port }}
      run: |
        echo "::group::Connect to vCluster"
        set -euo pipefail

        pf_log="${GITHUB_WORKSPACE}/.snapshot-e2e-vcluster-port-forward.log"
        pf_pid_file="${GITHUB_WORKSPACE}/.snapshot-e2e-vcluster-port-forward.pid"

        kubectl port-forward \
          -n "${HOST_NAMESPACE}" \
          "svc/${VCLUSTER_NAME}" \
          "${VCLUSTER_LOCAL_PORT}:443" > "${pf_log}" 2>&1 &
        echo "$!" > "${pf_pid_file}"

        for attempt in $(seq 1 60); do
          pf_pid="$(cat "${pf_pid_file}")"
          if ! kill -0 "${pf_pid}" 2>/dev/null; then
            echo "::error::vCluster port-forward exited early"
            tail -n 100 "${pf_log}" || true
            exit 1
          fi
          if curl -sk --connect-timeout 1 --max-time 2 "https://127.0.0.1:${VCLUSTER_LOCAL_PORT}/healthz" >/dev/null; then
            break
          fi
          if [[ "${attempt}" == "60" ]]; then
            echo "::error::vCluster API was not reachable through the local port-forward"
            tail -n 100 "${pf_log}" || true
            exit 1
          fi
          sleep 2
        done

        vcluster connect "${VCLUSTER_NAME}" \
          --namespace "${HOST_NAMESPACE}" \
          --server="https://127.0.0.1:${VCLUSTER_LOCAL_PORT}" \
          --print > "${VCLUSTER_KUBECONFIG}"
        chmod 600 "${VCLUSTER_KUBECONFIG}"

        kubectl --kubeconfig "${VCLUSTER_KUBECONFIG}" get ns
        echo "::endgroup::"

    - name: Create Snapshot test namespace and PVC
      shell: bash
      env:
        VCLUSTER_KUBECONFIG: ${{ steps.resolve.outputs.vcluster_kubeconfig }}
        TEST_NAMESPACE: ${{ steps.resolve.outputs.test_namespace }}
        PVC_NAME: ${{ inputs.pvc_name }}
        PVC_SIZE: ${{ inputs.pvc_size }}
      run: |
        echo "::group::Create Snapshot test namespace and PVC"
        set -euo pipefail

        kubectl --kubeconfig "${VCLUSTER_KUBECONFIG}" \
          create namespace "${TEST_NAMESPACE}" \
          --dry-run=client \
          -o yaml | kubectl --kubeconfig "${VCLUSTER_KUBECONFIG}" apply -f -

        cat <<EOF | kubectl --kubeconfig "${VCLUSTER_KUBECONFIG}" apply -f -
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${PVC_NAME}
          namespace: ${TEST_NAMESPACE}
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: ${PVC_SIZE}
        EOF

        kubectl --kubeconfig "${VCLUSTER_KUBECONFIG}" \
          get pvc "${PVC_NAME}" \
          -n "${TEST_NAMESPACE}" \
          -o wide
        echo "::endgroup::"

    - name: Install Snapshot chart
      shell: bash
      env:
        VCLUSTER_KUBECONFIG: ${{ steps.resolve.outputs.vcluster_kubeconfig }}
        TEST_NAMESPACE: ${{ steps.resolve.outputs.test_namespace }}
        SNAPSHOT_RELEASE: ${{ steps.resolve.outputs.snapshot_release }}
        SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        HELM_TIMEOUT: ${{ inputs.helm_timeout }}
      run: |
        echo "::group::Install Snapshot chart"
        set -euo pipefail

        KUBECONFIG="${VCLUSTER_KUBECONFIG}" \
        helm upgrade --install "${SNAPSHOT_RELEASE}" ./charts/snapshot \
          --namespace "${TEST_NAMESPACE}" \
          --create-namespace \
          --timeout "${HELM_TIMEOUT}" \
          --set "image.operator.tag=${SNAPSHOT_TAG}" \
          --set "image.agent.tag=${SNAPSHOT_TAG}" \
          --set storage.accessMode=podMount \
          --set-json 'daemonset.imagePullSecrets=[]'
        echo "::endgroup::"

    - name: Wait for Snapshot readiness
      shell: bash
      env:
        VCLUSTER_KUBECONFIG: ${{ steps.resolve.outputs.vcluster_kubeconfig }}
        TEST_NAMESPACE: ${{ steps.resolve.outputs.test_namespace }}
        SNAPSHOT_RELEASE: ${{ steps.resolve.outputs.snapshot_release }}
        READY_TIMEOUT_SECONDS: ${{ inputs.ready_timeout_seconds }}
      run: |
        echo "::group::Wait for Snapshot readiness"
        set -euo pipefail

        k() {
          kubectl --kubeconfig "${VCLUSTER_KUBECONFIG}" "$@"
        }

        k rollout status deployment \
          -l "app.kubernetes.io/name=snapshot,app.kubernetes.io/instance=${SNAPSHOT_RELEASE},app.kubernetes.io/component=operator" \
          -n "${TEST_NAMESPACE}" \
          --timeout="${READY_TIMEOUT_SECONDS}s"

        k rollout status daemonset \
          -l "app.kubernetes.io/name=snapshot,app.kubernetes.io/instance=${SNAPSHOT_RELEASE},app.kubernetes.io/component=snapshot-agent" \
          -n "${TEST_NAMESPACE}" \
          --timeout="${READY_TIMEOUT_SECONDS}s"

        k get pods -n "${TEST_NAMESPACE}" -l app.kubernetes.io/name=snapshot -o wide
        echo "::endgroup::"

    - name: Snapshot e2e setup summary
      shell: bash
      env:
        HOST_NAMESPACE: ${{ steps.resolve.outputs.host_namespace }}
        VCLUSTER_NAME: ${{ steps.resolve.outputs.vcluster_name }}
        TEST_NAMESPACE: ${{ steps.resolve.outputs.test_namespace }}
        VCLUSTER_KUBECONFIG: ${{ steps.resolve.outputs.vcluster_kubeconfig }}
      run: |
        echo "::group::Snapshot e2e setup summary"
        set -euo pipefail

        echo "Host namespace: ${HOST_NAMESPACE}"
        echo "vCluster: ${VCLUSTER_NAME}"
        echo "Test namespace: ${TEST_NAMESPACE}"
        echo "vCluster kubeconfig: ${VCLUSTER_KUBECONFIG}"
        echo "Inspect command:"
        echo "  kubectl --kubeconfig '${VCLUSTER_KUBECONFIG}' get pods -n '${TEST_NAMESPACE}' -o wide"
        echo "::endgroup::"
