name: Set up Go
description: Installs the pinned Go toolchain with module caching. Requires the repo to be checked out first.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.26.5'
        cache-dependency-path: |
          api/go.sum
          agent/go.sum
          operator/go.sum
          snapshotctl/go.sum
          go.work.sum
