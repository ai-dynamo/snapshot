name: Setup Snapshot E2E vCluster
description: Prepare a vCluster-backed Kubernetes target for Snapshot e2e.

inputs:
  mode:
    description: Setup mode. Only ci-vcluster is supported by this action.
    required: false
    default: ci-vcluster
  host_namespace:
    description: Host namespace for the vCluster. Defaults to snapshot-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.
    required: false
    default: ""
  vcluster_name:
    description: vCluster release name. Defaults to host_namespace.
    required: false
    default: ""
  test_namespace:
    description: Namespace inside the vCluster where Snapshot is installed.
    required: false
    default: snapshot-e2e
  snapshot_release:
    description: Snapshot Helm release name.
    required: false
    default: snapshot
  snapshot_tag:
    description: Operator and agent image tag for the Snapshot chart.
    required: false
    default: v0.0.0-g71827d8e
  pvc_name:
    description: Checkpoint PVC name inside the vCluster test namespace.
    required: false
    default: snapshot-pvc
  pvc_size:
    description: Checkpoint PVC requested size.
    required: false
    default: 2Gi
  vcluster_k8s_version:
    description: Kubernetes version for the vCluster control plane.
    required: false
    default: v1.32.13
  vcluster_version:
    description: vCluster CLI version to install.
    required: false
    default: v0.33.0
  vcluster_local_port:
    description: Local port used for the vCluster API port-forward.
    required: false
    default: "8443"
  helm_timeout:
    description: Timeout for Helm installs.
    required: false
    default: 10m
  ready_timeout_seconds:
    description: Timeout in seconds for readiness polling.
    required: false
    default: "900"

outputs:
  host_namespace:
    description: Host namespace containing the vCluster.
    value: ${{ steps.export.outputs.host_namespace }}
  vcluster_name:
    description: vCluster release name.
    value: ${{ steps.export.outputs.vcluster_name }}
  test_namespace:
    description: Namespace inside the vCluster where Snapshot is installed.
    value: ${{ steps.export.outputs.test_namespace }}
  target_kubeconfig:
    description: Path to the kubeconfig for the target e2e cluster.
    value: ${{ steps.export.outputs.target_kubeconfig }}
  vcluster_kubeconfig:
    description: Path to the generated vCluster kubeconfig.
    value: ${{ steps.export.outputs.vcluster_kubeconfig }}
  snapshot_release:
    description: Snapshot Helm release name.
    value: ${{ steps.export.outputs.snapshot_release }}
  pvc_name:
    description: Snapshot checkpoint PVC name.
    value: ${{ steps.export.outputs.pvc_name }}

runs:
  using: composite
  steps:
    - name: Resolve inputs
      id: resolve
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_HOST_NAMESPACE: ${{ inputs.host_namespace }}
        INPUT_VCLUSTER_NAME: ${{ inputs.vcluster_name }}
        INPUT_TEST_NAMESPACE: ${{ inputs.test_namespace }}
        INPUT_SNAPSHOT_RELEASE: ${{ inputs.snapshot_release }}
      run: |
        set -euo pipefail

        if [[ "${INPUT_MODE}" != "ci-vcluster" ]]; then
          echo "::error::setup-snapshot-e2e-vcluster only supports mode=ci-vcluster"
          exit 1
        fi

        run_id="${GITHUB_RUN_ID:-manual}"
        run_attempt="${GITHUB_RUN_ATTEMPT:-1}"
        host_namespace="${INPUT_HOST_NAMESPACE:-snapshot-e2e-${run_id}-${run_attempt}}"
        vcluster_name="${INPUT_VCLUSTER_NAME:-${host_namespace}}"
        target_kubeconfig="${GITHUB_WORKSPACE}/.kubeconfig-snapshot-e2e"
        result_file="${RUNNER_TEMP}/snapshot-e2e-setup-result.json"

        {
          echo "host_namespace=${host_namespace}"
          echo "vcluster_name=${vcluster_name}"
          echo "test_namespace=${INPUT_TEST_NAMESPACE}"
          echo "snapshot_release=${INPUT_SNAPSHOT_RELEASE}"
          echo "target_kubeconfig=${target_kubeconfig}"
          echo "result_file=${result_file}"
        } >> "${GITHUB_OUTPUT}"

    - name: Install vCluster CLI
      uses: ./.github/actions/install-vcluster-cli
      with:
        vcluster_version: ${{ inputs.vcluster_version }}

    - name: Install uv
      shell: bash
      run: |
        echo "::group::Install uv"
        set -euo pipefail

        if ! command -v uv >/dev/null 2>&1; then
          curl --retry 5 --retry-delay 2 \
            --connect-timeout 10 --max-time 120 \
            --fail --show-error -LsSf \
            https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/bin:${PATH}"
        fi

        uv --version
        echo "::endgroup::"

    - name: Setup Snapshot e2e vCluster
      shell: bash
      env:
        HOST_NAMESPACE: ${{ steps.resolve.outputs.host_namespace }}
        VCLUSTER_NAME: ${{ steps.resolve.outputs.vcluster_name }}
        TEST_NAMESPACE: ${{ steps.resolve.outputs.test_namespace }}
        TARGET_KUBECONFIG: ${{ steps.resolve.outputs.target_kubeconfig }}
        SNAPSHOT_RELEASE: ${{ steps.resolve.outputs.snapshot_release }}
        SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        PVC_NAME: ${{ inputs.pvc_name }}
        PVC_SIZE: ${{ inputs.pvc_size }}
        VCLUSTER_K8S_VERSION: ${{ inputs.vcluster_k8s_version }}
        VCLUSTER_LOCAL_PORT: ${{ inputs.vcluster_local_port }}
        HELM_TIMEOUT: ${{ inputs.helm_timeout }}
        READY_TIMEOUT_SECONDS: ${{ inputs.ready_timeout_seconds }}
        RESULT_FILE: ${{ steps.resolve.outputs.result_file }}
      run: |
        echo "::group::Setup Snapshot e2e vCluster"
        set -euo pipefail

        uv run --project e2e python -m snapshot_e2e.infra.setup \
          --mode vcluster \
          --host-namespace "${HOST_NAMESPACE}" \
          --vcluster-name "${VCLUSTER_NAME}" \
          --test-namespace "${TEST_NAMESPACE}" \
          --snapshot-release "${SNAPSHOT_RELEASE}" \
          --snapshot-tag "${SNAPSHOT_TAG}" \
          --pvc-name "${PVC_NAME}" \
          --pvc-size "${PVC_SIZE}" \
          --vcluster-k8s-version "${VCLUSTER_K8S_VERSION}" \
          --vcluster-local-port "${VCLUSTER_LOCAL_PORT}" \
          --helm-timeout "${HELM_TIMEOUT}" \
          --ready-timeout-seconds "${READY_TIMEOUT_SECONDS}" \
          --target-kubeconfig "${TARGET_KUBECONFIG}" \
          --result-file "${RESULT_FILE}"
        echo "::endgroup::"

    - name: Export setup result
      id: export
      shell: bash
      env:
        RESULT_FILE: ${{ steps.resolve.outputs.result_file }}
      run: |
        echo "::group::Export Snapshot e2e setup result"
        set -euo pipefail

        uv run --project e2e python - <<'PY'
        import json
        import os
        from pathlib import Path

        result = json.loads(Path(os.environ["RESULT_FILE"]).read_text())
        output_keys = (
            "host_namespace",
            "vcluster_name",
            "test_namespace",
            "target_kubeconfig",
            "vcluster_kubeconfig",
            "snapshot_release",
            "pvc_name",
        )

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            for key in output_keys:
                output.write(f"{key}={result.get(key, '')}\n")

        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
            env.write(f"KUBECONFIG={result['target_kubeconfig']}\n")
            env.write(f"SNAPSHOT_E2E_HOST_NAMESPACE={result.get('host_namespace', '')}\n")
            env.write(f"SNAPSHOT_E2E_VCLUSTER_NAME={result.get('vcluster_name', '')}\n")
            env.write(f"SNAPSHOT_E2E_TEST_NAMESPACE={result['test_namespace']}\n")
            env.write(f"SNAPSHOT_E2E_TARGET_KUBECONFIG={result['target_kubeconfig']}\n")
            env.write(f"SNAPSHOT_E2E_SNAPSHOT_RELEASE={result['snapshot_release']}\n")
            env.write(f"SNAPSHOT_E2E_PVC_NAME={result['pvc_name']}\n")
        PY

        echo "Target kubeconfig: $(uv run --project e2e python -c 'import json, os, pathlib; print(json.loads(pathlib.Path(os.environ[\"RESULT_FILE\"]).read_text())[\"target_kubeconfig\"])')"
        echo "::endgroup::"
