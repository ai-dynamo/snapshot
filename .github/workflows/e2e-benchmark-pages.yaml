name: E2E Benchmark Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/e2e-benchmark-pages.yaml'
  workflow_run:
    workflows: [E2E Framework Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Scheduled framework runs publish partial results even when a framework
    # fails, so do not gate deployment on the parent workflow's conclusion.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dashboard source
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Fetch benchmark history
        run: |
          set -euo pipefail
          history_dir="${RUNNER_TEMP}/snapshot-e2e-benchmark-history"
          mkdir -p "${history_dir}"
          git -C "${history_dir}" init --quiet --initial-branch=e2e-benchmark-history
          git -C "${history_dir}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          set +e
          git -C "${history_dir}" ls-remote --quiet --exit-code \
            --heads origin e2e-benchmark-history >/dev/null
          history_status=$?
          set -e

          case "${history_status}" in
            0)
              git -C "${history_dir}" fetch --quiet --depth=1 \
                origin refs/heads/e2e-benchmark-history
              git -C "${history_dir}" checkout --quiet --detach FETCH_HEAD
              ;;
            2)
              echo "::notice::No benchmark history exists yet; deploying an empty dashboard."
              mkdir -p "${history_dir}/index"
              printf '%s\n' \
                '{"manifestVersion":1,"historyFormatVersion":1,"supportedSchemaVersions":[1],"recordCount":0,"chunks":[]}' \
                > "${history_dir}/index/manifest.json"
              ;;
            *)
              echo "::error::Could not inspect the e2e-benchmark-history branch."
              exit "${history_status}"
              ;;
          esac
          echo "BENCHMARK_HISTORY_DIR=${history_dir}" >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Test dashboard logic
        working-directory: dashboard
        run: npm test

      - name: Validate benchmark history
        working-directory: dashboard
        run: npm run validate-data -- "${BENCHMARK_HISTORY_DIR}/index"

      - name: Build static dashboard
        working-directory: dashboard
        env:
          DASHBOARD_PRODUCTION: "true"
        run: npm run build

      - name: Add benchmark history to static artifact
        run: cp -R "${BENCHMARK_HISTORY_DIR}/index" "${GITHUB_WORKSPACE}/dashboard/dist/index"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
