name: Backfill Release SBOMs

# Releases before v0.2.0 shipped no assets. Their images are still in GHCR, so
# an SBOM can be produced for them after the fact by scanning what was actually
# published.
#
# SBOMs only, deliberately. An SBOM is descriptive — it says what is inside an
# image, and anyone can re-derive it from the same digest. A signature would be
# an assertion about who produced the artifact and when, and signing a months-old
# release today would date that assertion to today while implying otherwise. See
# RELEASE.md: signing starts at v0.2.0 and is not backfilled.
#
# One-shot utility. Remove it once the pre-v0.2.0 releases have been covered.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to backfill (e.g. v0.1.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: backfill-sboms-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/ai-dynamo/snapshot

jobs:
  backfill:
    name: Backfill SBOMs for ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Upload SBOM assets to the release for this tag.
      contents: write
      # Let syft read the published images from GHCR.
      packages: read
    steps:
      - name: Confirm the release exists and carries no signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null || {
            echo "No published release for ${TAG}." >&2; exit 1; }
          # A release whose assets were produced by the signing pipeline must not
          # be touched by the backfill path: its SBOMs are covered by SHA256SUMS,
          # and replacing them would invalidate that signature.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
               --json assets --jq '.assets[].name' | grep -q 'SHA256SUMS'; then
            echo "${TAG} already has signed release assets; refusing to backfill." >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # Resolve the tag to a digest first and scan that, so the SBOM names the
      # exact bytes it describes rather than whatever the tag resolves to later.
      - name: Generate SBOMs from the published images
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p assets
          for image in operator agent; do
            digest="$(docker buildx imagetools inspect \
              "${REGISTRY}/${image}:${TAG}" --format '{{ .Manifest.Digest }}')"
            case "${digest}" in
              sha256:*) ;;
              *) echo "Could not resolve ${image}:${TAG} to a digest" >&2; exit 1 ;;
            esac
            echo "${image}:${TAG} -> ${digest}"
            syft scan --platform linux/amd64 \
              -o "spdx-json=assets/sbom-${image}.spdx.json" \
              -o "cyclonedx-json=assets/sbom-${image}.cdx.json" \
              "registry:${REGISTRY}/${image}@${digest}"
          done

      - name: Upload SBOMs to the release
        working-directory: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
            sbom-operator.spdx.json sbom-operator.cdx.json \
            sbom-agent.spdx.json sbom-agent.cdx.json
          echo "Backfilled SBOMs for ${TAG}. These carry no signature by design;"
          echo "their creation timestamp is the backfill date, not the release date."
