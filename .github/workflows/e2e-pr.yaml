# End-to-end tests for pull requests, run on their copy-pr-bot mirror branch
# (pull-request/<number>, see .github/copy-pr-bot.yaml). The GPU runners admit
# push events but not pull_request, so every suite runs from the mirror push: the
# CPU suite first, and the GPU and framework suites only once it has passed for
# the same commit.
#
# The GPU and framework suites install images built here from the mirrored
# commit, never main's, so a pass means the pull request's own operator, agent,
# and pagebroker were tested. hack/prune-ghcr.py expires those images.

name: PR E2E

on:
  push:
    # No paths filter here: a workflow it skips reports no check at all, and a
    # required check that never reports blocks the merge. The changes job below
    # decides instead, and PR E2E passes explicitly when nothing was needed.
    branches:
      - "pull-request/[0-9]+"

concurrency:
  # Distinct from the groups the called workflows declare: a caller and a callee
  # sharing one group wait on each other forever.
  group: snapshot-e2e-pr-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect e2e changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No base: on a push to a branch other than the default one, the filter
      # compares against the merge-base with the default branch. That is the
      # whole pull request, where the previous mirror push would be only its
      # latest commit -- a docs-only follow-up would then skip a code change.
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            e2e:
              - "agent/**"
              - "api/**"
              - "charts/snapshot/**"
              - "e2e/**"
              - "operator/**"
              - "go.work"
              - "go.work.sum"
              - "**/go.mod"
              - "**/go.sum"
              - "Makefile"
              - "hack/tools.mk"
              # A named build context of the agent image, so it changes that image.
              - "hack/compliance/**"
              - "hack/k3d-cpu-e2e.sh"
              - "hack/verify-bundle-glibc.sh"
              - "hack/ci-cache-flags.sh"
              - "hack/ci-phase.sh"
              - "hack/ci-phase-summary.sh"
              - ".github/actions/**"
              - ".github/workflows/e2e-pr.yaml"
              - ".github/workflows/e2e-cpu.yaml"
              - ".github/workflows/e2e.yaml"
              - ".github/workflows/e2e-frameworks.yaml"
              # The framework workloads' programs and manifests.
              - "docs/guides/**"
              - "hack/datadog-gpu-monitoring.py"

  cpu:
    name: CPU
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    uses: ./.github/workflows/e2e-cpu.yaml
    permissions:
      contents: read
      packages: read

  # Built alongside the CPU suite rather than after it: the GPU suites wait for
  # both, so this costs no wall-clock time when CPU passes.
  images:
    name: Build ${{ matrix.image }} image
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-24.04
    # Sized for the agent: CRIU from source on a CUDA base.
    timeout-minutes: 75
    permissions:
      contents: read
      # Publishes the images the GPU suite installs. The layer cache is only
      # read: the code here is the pull request's.
      packages: write
    strategy:
      matrix:
        image: [operator, agent, pagebroker]
    outputs:
      # Matrix legs share one set of job outputs, last leg winning. Every leg
      # computes the same tag, so whichever wins is the right one.
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag push-artifacts.yaml gives a build of the pull-request/<number>
      # branch, so hack/resolve-snapshot-image-tag.py reads it as this commit's
      # own. It never matches the plain v0.0.0-g<sha8> tags the nightly suites
      # resolve, and hack/prune-ghcr.py expires it by this shape.
      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          echo "tag=v0.0.0-pull-request-${GITHUB_REF_NAME#pull-request/}-g${GITHUB_SHA:0:8}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        id: build
        uses: ./.github/actions/build-image
        with:
          image: ${{ matrix.image }}
          tags: ${{ steps.tag.outputs.tag }}
          cache_mode: read
          # A mirror branch has no cache of its own; main's is the warmest.
          cache_branch: main

      - name: Record digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "${DIGEST}" != sha256:* ]]; then
            echo "::error::buildx reported no digest for ${IMAGE}" >&2
            exit 1
          fi
          echo "${DIGEST}" > "digest-${IMAGE}.txt"

      # Matrix legs share one set of job outputs, so digests travel as files.
      - name: Publish digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-e2e-digest-${{ matrix.image }}
          path: digest-${{ matrix.image }}.txt
          if-no-files-found: error

  # Records which manifests this run qualifies, and fails before any GPU time is
  # spent if the tag no longer resolves to what was built here. The suites still
  # install by tag; only a rebuild of the same commit can move it.
  candidate:
    name: Verify candidate images
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: read
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pr-e2e-digest-*
          path: digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check each tag resolves to the digest built here
        env:
          REGISTRY: ghcr.io/ai-dynamo/snapshot
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          set -euo pipefail
          record='{}'
          for image in operator agent pagebroker; do
            want="$(cat "digests/digest-${image}.txt")"
            got="$(docker buildx imagetools inspect "${REGISTRY}/${image}:${TAG}" --format '{{.Manifest.Digest}}')"
            if [[ "${got}" != "${want}" ]]; then
              echo "::error::${REGISTRY}/${image}:${TAG} resolves to ${got}, but this run built ${want}" >&2
              exit 1
            fi
            record="$(jq -c --arg image "${image}" --arg digest "${want}" '.[$image] = $digest' <<< "${record}")"
          done
          jq -n \
            --arg sha "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg registry "${REGISTRY}" \
            --arg tag "${TAG}" \
            --argjson digests "${record}" \
            '{source_commit: $sha, source_ref: $ref, run_id: $run_id, run_attempt: $run_attempt,
              registry: $registry, tag: $tag, digests: $digests}' > pr-e2e-candidate.json
          {
            echo "### Candidate images"
            echo '```json'
            cat pr-e2e-candidate.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload candidate record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-e2e-candidate-${{ github.run_attempt }}
          path: pr-e2e-candidate.json
          if-no-files-found: error

  # Held across both GPU suites: a toggle in each would turn monitoring back on
  # under the other while it is still capturing or restoring. The holder is the
  # run, which hack/datadog-gpu-monitoring.py tracks on the cluster resources.
  datadog-gate:
    name: datadog gpu monitoring off
    needs: [cpu, candidate]
    runs-on: prod-deploy-tester-v1
    # The job clock includes runner setup, which takes minutes on a busy GPU
    # cluster.
    timeout-minutes: 15
    concurrency:
      group: snapshot-e2e-frameworks-datadog-gate
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report Datadog GPU monitoring state
        run: python3 hack/datadog-gpu-monitoring.py status

      - name: Disable Datadog GPU monitoring for this run
        run: python3 hack/datadog-gpu-monitoring.py disable --holder "${{ github.run_id }}-${{ github.run_attempt }}"

  gpu:
    name: GPU
    needs: [cpu, images, candidate, datadog-gate]
    uses: ./.github/workflows/e2e.yaml
    with:
      snapshot_tag: ${{ needs.images.outputs.tag }}
    permissions:
      contents: read
      packages: read

  frameworks:
    name: Frameworks
    needs: [cpu, images, candidate, datadog-gate]
    uses: ./.github/workflows/e2e-frameworks.yaml
    with:
      snapshot_tag: ${{ needs.images.outputs.tag }}
      # datadog-gate holds it for both suites. A called workflow shares this
      # run's ID, so its own restore would release that hold early.
      datadog_gpu_monitoring: leave
    permissions:
      # Its benchmark comparison reads the result artifacts of this run.
      actions: read
      contents: read
      packages: read

  datadog-restore:
    name: datadog gpu monitoring back on
    needs: [datadog-gate, gpu, frameworks]
    # Whether the suites passed, failed, or were cancelled; skipped only when
    # the gate never disabled anything.
    if: ${{ always() && needs.datadog-gate.result == 'success' }}
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 15
    concurrency:
      group: snapshot-e2e-frameworks-datadog-gate
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Datadog GPU monitoring
        run: python3 hack/datadog-gpu-monitoring.py restore --holder "${{ github.run_id }}-${{ github.run_attempt }}"

  # The one check to require. always(), never !cancelled(): a skipped required
  # check counts as passing, so this job must run -- and fail -- when the run is
  # cancelled or a job it depends on did not succeed.
  pr-e2e:
    name: PR E2E
    needs: [changes, cpu, images, candidate, datadog-gate, gpu, frameworks, datadog-restore]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Exactly two shapes pass: e2e was needed and every suite succeeded, or it
      # was not needed and every suite was skipped for that reason.
      - name: Require every needed suite to pass
        env:
          E2E: ${{ needs.changes.outputs.e2e }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e --arg e2e "${E2E}" '
            .changes.result == "success" and
            ([.cpu, .images, .candidate, .["datadog-gate"], .gpu, .frameworks,
              .["datadog-restore"]] | if $e2e == "true"
               then all(.result == "success")
               else all(.result == "skipped") end)
          ' <<< "${RESULTS}"
