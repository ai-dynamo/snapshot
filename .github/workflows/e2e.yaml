name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: >-
          Operator/agent/pagebroker image tag to install (e.g. from a manual
          push-artifacts.yaml dispatch on a feature branch). Leave empty to
          test the checked-out commit itself: its dev tag must already be
          published for all three images in GHCR, otherwise the run fails.
        required: false
        type: string
  schedule:
    # 23:00 Pacific Standard Time.
    - cron: "0 7 * * *"

concurrency:
  group: snapshot-e2e-vcluster-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: Run Snapshot e2e tests in vCluster
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 60
    env:
      HOST_NAMESPACE: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      VCLUSTER_NAME: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_NAMESPACE: snapshot-e2e
      SNAPSHOT_E2E_HOST_NAMESPACE: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      SNAPSHOT_E2E_VCLUSTER_NAME: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      SNAPSHOT_E2E_TEST_NAMESPACE: snapshot-e2e
      SNAPSHOT_E2E_TARGET_KUBECONFIG: ${{ github.workspace }}/.kubeconfig-snapshot-e2e
      SNAPSHOT_E2E_SNAPSHOT_RELEASE: snapshot
      SNAPSHOT_E2E_PVC_NAME: snapshot-pvc
      SNAPSHOT_E2E_PVC_SIZE: 2Gi
      SNAPSHOT_E2E_STORAGE_CLASS: azurefile-csi
      SNAPSHOT_E2E_MODE: vcluster
      SNAPSHOT_E2E_AVOID_MIG: "true"
      SNAPSHOT_E2E_VCLUSTER_K8S_VERSION: v1.32.13
      SNAPSHOT_E2E_VCLUSTER_LOCAL_PORT: "8443"
      SNAPSHOT_E2E_HELM_TIMEOUT: 6m
      SNAPSHOT_E2E_READY_TIMEOUT_SECONDS: "480"
      SNAPSHOT_E2E_RESULT_FILE: ${{ github.workspace }}/.snapshot-e2e-setup-result.json
      PYTHONUNBUFFERED: "1"
      UV_LINK_MODE: copy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve Snapshot image tag
        if: ${{ (inputs.snapshot_tag || '') == '' }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 hack/resolve-snapshot-image-tag.py

      - name: Use provided Snapshot image tag
        if: ${{ (inputs.snapshot_tag || '') != '' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          echo "SNAPSHOT_E2E_SNAPSHOT_TAG=${{ inputs.snapshot_tag }}" >> "$GITHUB_ENV"
          echo "Using provided Snapshot image tag: ${{ inputs.snapshot_tag }}"

      - name: Capture host kubeconfig
        id: host
        run: |
          echo "kubeconfig=${KUBECONFIG:-}" >> "${GITHUB_OUTPUT}"

      - name: Create vCluster target
        timeout-minutes: 30
        uses: ./.github/actions/e2e-vcluster-up

      - name: Install Snapshot in vCluster
        timeout-minutes: 8
        run: |
          set -euo pipefail
          uv run --locked --project e2e python -m snapshot_e2e.infra.setup \
            --phase snapshot-install

      - name: Wait for Snapshot components
        timeout-minutes: 10
        run: |
          set -euo pipefail
          uv run --locked --project e2e python -m snapshot_e2e.infra.setup \
            --phase snapshot-ready

      - name: Export vCluster target
        timeout-minutes: 6
        uses: ./.github/actions/e2e-vcluster-export

      - name: Run environment validation
        timeout-minutes: 5
        run: |
          set -euo pipefail
          uv run --locked --project e2e pytest e2e/tests -m environment -vv

      - name: Run snapshot lifecycle tests
        timeout-minutes: 35
        run: |
          set -euo pipefail
          uv run --locked --project e2e pytest e2e/tests/test_snapshot_lifecycle.py -vv -s

      - name: Run SnapshotJob lifecycle tests
        timeout-minutes: 20
        run: |
          set -euo pipefail
          uv run --locked --project e2e pytest e2e/tests/test_snapshotjob.py -vv -s

      - name: Run workload script tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          uv run --locked --project e2e pytest e2e/tests/test_workload_scripts.py -vv -s

      - name: Cleanup e2e vCluster
        if: ${{ always() }}
        uses: ./.github/actions/e2e-vcluster-down
        with:
          host_kubeconfig: ${{ steps.host.outputs.kubeconfig }}
