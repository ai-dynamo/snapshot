name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: >-
          Operator/agent/pagebroker image tag to install (e.g. from a manual
          push-artifacts.yaml dispatch on a feature branch). Leave empty to
          test the checked-out commit itself: its dev tag must already be
          published for all three images in GHCR, otherwise the run fails.
        required: false
        type: string
      pagebroker_gpu_only:
        description: Run only the standalone PageBroker GPU tests
        required: false
        type: boolean
        default: false
  schedule:
    # 23:00 Pacific Standard Time.
    - cron: "0 7 * * *"

concurrency:
  group: snapshot-e2e-vcluster-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  pagebroker-gpu:
    name: Run PageBroker GPU tests
    if: ${{ github.event_name == 'schedule' || inputs.pagebroker_gpu_only }}
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      SNAPSHOT_E2E_TEST_NAMESPACE: pagebroker-gpu-${{ github.run_id }}-${{ github.run_attempt }}
      SNAPSHOT_E2E_AVOID_MIG: "true"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          checksum: ${{ runner.arch == 'ARM64' && '23003df007937dd607409c8ddf010baa82bad2673e60e254632ca5b04edcce13' || '5a360b0de092ddf4131f5313d0411b48c4e95e8107e40c3f8f2e9fcb636b3583' }}
          enable-cache: "false"
          download-from-astral-mirror: "false"

      - name: Capture GPU cluster context
        id: gpu-cluster
        run: |
          umask 077
          cluster_context="$(kubectl config current-context)"
          kubeconfig="${RUNNER_TEMP}/pagebroker-gpu-kubeconfig"
          kubectl --context "${cluster_context}" -n "${SNAPSHOT_E2E_TEST_NAMESPACE}" \
            config view --minify --flatten --raw > "${kubeconfig}"
          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          echo "PAGEBROKER_KUBE_CONTEXT=${cluster_context}" >> "$GITHUB_ENV"

      - name: Create GPU test namespace
        run: |
          kubectl --context "${PAGEBROKER_KUBE_CONTEXT}" -n "${SNAPSHOT_E2E_TEST_NAMESPACE}" \
            create namespace "${SNAPSHOT_E2E_TEST_NAMESPACE}"

      - name: Set up cluster builder
        id: builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: kubernetes
          platforms: linux/amd64
          cleanup: false
          driver-opts: |
            namespace=${{ env.SNAPSHOT_E2E_TEST_NAMESPACE }}
            nodeselector=kubernetes.io/arch=amd64
            requests.cpu=4
            requests.memory=8Gi
            limits.memory=16Gi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build GPU test image on the cluster
        timeout-minutes: 30
        env:
          BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          revision="$(git rev-parse HEAD)"
          make docker-build-pagebroker \
            TAGS="gpu-tests-${revision}" \
            DOCKER_BUILD_ARGS="--builder ${BUILDER} --push --target gpu-test \
              --build-arg PAGEBROKER_REVISION=${revision}"

      - name: Run GPU test Job
        timeout-minutes: 12
        run: |
          uv run --locked --project e2e pytest e2e/tests/test_pagebroker_gpu.py -vv -s

      - name: Delete GPU test namespace
        if: ${{ always() && steps.gpu-cluster.outcome == 'success' }}
        env:
          BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          if [ -n "${BUILDER}" ]; then
            docker buildx rm --force "${BUILDER}" || true
          fi
          kubectl --context "${PAGEBROKER_KUBE_CONTEXT}" -n "${SNAPSHOT_E2E_TEST_NAMESPACE}" \
            delete namespace "${SNAPSHOT_E2E_TEST_NAMESPACE}" --ignore-not-found --wait=false
          rm -f "${KUBECONFIG}"

  e2e:
    name: Run Snapshot e2e tests in vCluster
    if: ${{ !inputs.pagebroker_gpu_only }}
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 60
    env:
      HOST_NAMESPACE: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      VCLUSTER_NAME: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_NAMESPACE: snapshot-e2e
      SNAPSHOT_E2E_HOST_NAMESPACE: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      SNAPSHOT_E2E_VCLUSTER_NAME: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      SNAPSHOT_E2E_TEST_NAMESPACE: snapshot-e2e
      SNAPSHOT_E2E_TARGET_KUBECONFIG: ${{ github.workspace }}/.kubeconfig-snapshot-e2e
      SNAPSHOT_E2E_SNAPSHOT_RELEASE: snapshot
      SNAPSHOT_E2E_PVC_NAME: snapshot-pvc
      SNAPSHOT_E2E_PVC_SIZE: 2Gi
      SNAPSHOT_E2E_STORAGE_CLASS: azurefile-csi
      SNAPSHOT_E2E_MODE: vcluster
      SNAPSHOT_E2E_AVOID_MIG: "true"
      SNAPSHOT_E2E_VCLUSTER_K8S_VERSION: v1.32.13
      SNAPSHOT_E2E_VCLUSTER_LOCAL_PORT: "8443"
      SNAPSHOT_E2E_HELM_TIMEOUT: 6m
      SNAPSHOT_E2E_READY_TIMEOUT_SECONDS: "480"
      SNAPSHOT_E2E_RESULT_FILE: ${{ github.workspace }}/.snapshot-e2e-setup-result.json
      PYTHONUNBUFFERED: "1"
      UV_LINK_MODE: copy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Capture host kubeconfig
        id: host
        run: |
          echo "kubeconfig=${KUBECONFIG:-}" >> "${GITHUB_OUTPUT}"

      - name: Install vCluster CLI
        timeout-minutes: 3
        uses: ./.github/actions/install-vcluster-cli

      - name: Cleanup stale e2e namespaces
        timeout-minutes: 5
        run: |
          set -euo pipefail

          cutoff_epoch="$(date -u -d '12 hours ago' +%s)"
          kubectl get ns -l snapshot-e2e=true \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.metadata.creationTimestamp}{"\n"}{end}' |
          while IFS=$'\t' read -r namespace created_at; do
            if [[ -z "${namespace}" ]]; then
              continue
            fi
            if [[ "${namespace}" == "${HOST_NAMESPACE}" ]]; then
              echo "Keeping current namespace ${namespace}"
              continue
            fi

            created_epoch="$(date -u -d "${created_at}" +%s)"
            if (( created_epoch >= cutoff_epoch )); then
              echo "Keeping recent namespace ${namespace} created at ${created_at}"
              continue
            fi

            echo "Deleting stale Snapshot e2e namespace ${namespace} created at ${created_at}"
            helm uninstall vcluster-hpm -n "${namespace}" || true
            vcluster delete "${namespace}" --namespace "${namespace}" || true
            kubectl delete namespace "${namespace}" --ignore-not-found --wait=false || true
          done

      - name: Install Python tooling (ARM64)
        if: ${{ runner.arch == 'ARM64' }}
        timeout-minutes: 3
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          checksum: "23003df007937dd607409c8ddf010baa82bad2673e60e254632ca5b04edcce13"
          enable-cache: "false"
          download-from-astral-mirror: "false"

      - name: Install Python tooling (X64)
        if: ${{ runner.arch == 'X64' }}
        timeout-minutes: 3
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          checksum: "5a360b0de092ddf4131f5313d0411b48c4e95e8107e40c3f8f2e9fcb636b3583"
          enable-cache: "false"
          download-from-astral-mirror: "false"

      - name: Validate Python tooling
        timeout-minutes: 1
        run: |
          set -euo pipefail
          uv --version

      - name: Resolve Snapshot image tag
        if: ${{ (inputs.snapshot_tag || '') == '' }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 hack/resolve-snapshot-image-tag.py

      - name: Use provided Snapshot image tag
        if: ${{ (inputs.snapshot_tag || '') != '' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          echo "SNAPSHOT_E2E_SNAPSHOT_TAG=${{ inputs.snapshot_tag }}" >> "$GITHUB_ENV"
          echo "Using provided Snapshot image tag: ${{ inputs.snapshot_tag }}"

      - name: Validate host GPU cluster
        timeout-minutes: 3
        run: |
          set -euo pipefail
          uv run --locked --project e2e python -m snapshot_e2e.infra.setup \
            --phase host-preflight

      - name: Create vCluster target
        timeout-minutes: 12
        run: |
          set -euo pipefail
          uv run --locked --project e2e python -m snapshot_e2e.infra.setup \
            --phase vcluster

      - name: Install Snapshot in vCluster
        timeout-minutes: 8
        run: |
          set -euo pipefail
          uv run --locked --project e2e python -m snapshot_e2e.infra.setup \
            --phase snapshot-install

      - name: Wait for Snapshot components
        timeout-minutes: 10
        run: |
          set -euo pipefail
          uv run --locked --project e2e python -m snapshot_e2e.infra.setup \
            --phase snapshot-ready

      - name: Export vCluster kubeconfig
        timeout-minutes: 3
        run: |
          set -euo pipefail
          uv run --locked --project e2e python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["SNAPSHOT_E2E_RESULT_FILE"]).read_text())

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"KUBECONFIG={result['target_kubeconfig']}\n")
              env.write(f"SNAPSHOT_E2E_HOST_NAMESPACE={result.get('host_namespace', '')}\n")
              env.write(f"SNAPSHOT_E2E_VCLUSTER_NAME={result.get('vcluster_name', '')}\n")
              env.write(f"SNAPSHOT_E2E_TEST_NAMESPACE={result['test_namespace']}\n")
              env.write(f"SNAPSHOT_E2E_TARGET_KUBECONFIG={result['target_kubeconfig']}\n")
              env.write(f"SNAPSHOT_E2E_SNAPSHOT_RELEASE={result['snapshot_release']}\n")
              env.write(f"SNAPSHOT_E2E_PVC_NAME={result['pvc_name']}\n")

          print(f"Target kubeconfig: {result['target_kubeconfig']}")
          PY

      - name: Inspect vCluster target
        timeout-minutes: 3
        run: |
          set -euo pipefail
          kubectl get nodes -o wide
          kubectl get runtimeclass
          kubectl get pods -n "${TEST_NAMESPACE}" -o wide
          kubectl get pvc -n "${TEST_NAMESPACE}" -o wide

      - name: Run environment validation
        timeout-minutes: 5
        run: |
          set -euo pipefail
          uv run --locked --project e2e pytest e2e/tests -m environment -vv

      - name: Run snapshot lifecycle tests
        timeout-minutes: 35
        run: |
          set -euo pipefail
          uv run --locked --project e2e pytest e2e/tests/test_snapshot_lifecycle.py -vv -s

      - name: Run SnapshotJob lifecycle tests
        timeout-minutes: 20
        run: |
          set -euo pipefail
          uv run --locked --project e2e pytest e2e/tests/test_snapshotjob.py -vv -s

      - name: Run workload script tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          uv run --locked --project e2e pytest e2e/tests/test_workload_scripts.py -vv -s

      - name: Cleanup e2e vCluster
        if: ${{ always() }}
        env:
          KUBECONFIG: ${{ steps.host.outputs.kubeconfig }}
        run: |
          set +e
          helm uninstall vcluster-hpm -n "${HOST_NAMESPACE}"
          if command -v vcluster >/dev/null 2>&1; then
            vcluster delete "${VCLUSTER_NAME}" --namespace "${HOST_NAMESPACE}"
          fi
          kubectl delete namespace "${HOST_NAMESPACE}" --ignore-not-found --wait=false
