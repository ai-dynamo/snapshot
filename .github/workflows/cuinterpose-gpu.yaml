name: CuInterpose GPU tests

# GPU infrastructure accepts trusted mirror pushes, not pull_request events.
on:
  push:
    branches: ['pull-request/[0-9]+']
    paths:
      - 'agent/cmd/cuinterpose/**'
      - 'agent/Dockerfile'
      - '.github/workflows/cuinterpose-gpu.yaml'
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cuinterpose-gpu
  cancel-in-progress: false

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.11'
          checksum: '5a360b0de092ddf4131f5313d0411b48c4e95e8107e40c3f8f2e9fcb636b3583'
          enable-cache: 'false'
          download-from-astral-mirror: 'false'
      - name: Build and stage matching artifacts
        shell: bash
        run: |
          make -C agent/cmd/cuinterpose build
          uv lock --project agent/cmd/cuinterpose/tests/gpu --python 3.12
          mkdir payload
          cp -a agent/cmd/cuinterpose/{frontend,tests,Makefile,build} payload/
          cp "$(command -v uv)" payload/uv
          printf '%s\n' "$GITHUB_SHA" > payload/revision
          sed -n 's/^ARG AGENT_BASE_IMAGE=//p' agent/Dockerfile > payload/image
          test "$(wc -l < payload/image)" -eq 1
          # Keep the exact per-run lock and executable modes with the artifacts.
          (cd payload && find . -type f -print0 | sort -z | xargs -0 sha256sum) > SHA256SUMS
          mv SHA256SUMS payload/
          tar -czf cuinterpose-gpu.tar.gz -C payload .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuinterpose-gpu-inputs
          path: cuinterpose-gpu.tar.gz
          if-no-files-found: error
          retention-days: 7

  gpu:
    needs: artifacts
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 60
    env:
      TEST_NAMESPACE: snapshot-cuinterpose-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cuinterpose-gpu-inputs
      - name: Start isolated two-GPU test pod
        shell: bash
        run: |
          mkdir -p payload results
          tar -xzf cuinterpose-gpu.tar.gz -C payload
          (cd payload && sha256sum --check SHA256SUMS)
          test "$(cat payload/revision)" = "$GITHUB_SHA"
          cp payload/{revision,image,SHA256SUMS} results/
          # Capture the runner's supplied context once. All API calls pin it.
          KUBE_CONTEXT=$(kubectl config current-context)
          test -n "$KUBE_CONTEXT"
          echo "KUBE_CONTEXT=$KUBE_CONTEXT" >> "$GITHUB_ENV"
          image=$(cat payload/image)
          kubectl --context "$KUBE_CONTEXT" -n "$TEST_NAMESPACE" create namespace "$TEST_NAMESPACE"
          kubectl --context "$KUBE_CONTEXT" -n "$TEST_NAMESPACE" create -f - <<YAML
          apiVersion: v1
          kind: Pod
          metadata:
            name: cuinterpose-gpu
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: 3300
            terminationGracePeriodSeconds: 1
            automountServiceAccountToken: false
            runtimeClassName: nvidia
            nodeSelector:
              kubernetes.io/arch: amd64
              nvidia.com/gpu.present: "true"
              nvidia.com/mig.config: all-disabled
            tolerations:
            - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
            - {key: dedicated, operator: Exists, effect: NoSchedule}
            - {key: CriticalAddonsOnly, operator: Exists, effect: NoSchedule}
            containers:
            - name: tests
              image: ${image}
              command: [/bin/bash, -c, "sleep 3300"]
              workingDir: /work
              securityContext: {privileged: true}
              resources:
                requests: {cpu: "2", memory: 8Gi, ephemeral-storage: 16Gi, nvidia.com/gpu: "2"}
                limits: {cpu: "8", memory: 24Gi, ephemeral-storage: 40Gi, nvidia.com/gpu: "2"}
              volumeMounts:
              - {name: work, mountPath: /work}
              - {name: shm, mountPath: /dev/shm}
            volumes:
            - {name: work, emptyDir: {}}
            - {name: shm, emptyDir: {medium: Memory, sizeLimit: 2Gi}}
          YAML
          kubectl --context "$KUBE_CONTEXT" -n "$TEST_NAMESPACE" wait pod/cuinterpose-gpu --for=condition=Ready --timeout=600s
          kubectl --context "$KUBE_CONTEXT" -n "$TEST_NAMESPACE" exec -i cuinterpose-gpu -- tar -xz -C /work < cuinterpose-gpu.tar.gz
      - name: Run frontend and ordinary GPU tests
        shell: bash
        run: |
          timeout 40m kubectl --context "$KUBE_CONTEXT" -n "$TEST_NAMESPACE" exec -i cuinterpose-gpu -- bash -seuo pipefail <<'SH' 2>&1 | tee results/run.log
          sha256sum --check SHA256SUMS
          mkdir results
          export UV_CACHE_DIR=/work/cache UV_PYTHON_INSTALL_DIR=/work/python UV_FROZEN=1
          # The pinned CUDA base supplies the compiler/toolkit but no Python.
          ./uv sync --frozen --project tests/gpu --python 3.12
          export PATH="/work/tests/gpu/.venv/bin:/work:$PATH"
          nvidia-smi -q > results/nvidia-smi.txt
          nvidia-smi topo -m > results/topology.txt
          ./uv pip list --python tests/gpu/.venv/bin/python > results/packages.txt
          PYTHONPATH=tests/gpu python - <<'PY'
          import torch
          from cuda.bindings import driver
          from cuda_driver import cuda_call
          cuda_call(driver.cuInit, 0)
          version = cuda_call(driver.cuDriverGetVersion)
          print(f"CUDA driver API: {version}, Torch: {torch.__version__}, Torch CUDA: {torch.version.cuda}")
          assert version >= 13000, "requires a CUDA 13 driver"
          assert cuda_call(driver.cuDeviceGetCount) == 2, "requires two allocated GPUs"
          assert cuda_call(driver.cuDeviceCanAccessPeer, 0, 1), "GPU 0 needs peer access to GPU 1"
          assert cuda_call(driver.cuDeviceCanAccessPeer, 1, 0), "GPU 1 needs peer access to GPU 0"
          PY
          # This A100-capable tier deliberately excludes multicast and HOST_NUMA.
          export PYTEST_ADDOPTS="-m 'gpu and not multicast and not host_numa' --junitxml=/work/results/pytest.xml"
          make test-gpu UV=/work/uv CUDA_INCLUDE=/usr/local/cuda/include
          python - <<'PY'
          import xml.etree.ElementTree as ET
          result = ET.parse('results/pytest.xml')
          assert result.findall('.//testcase'), "no GPU cases executed"
          assert not result.findall('.//skipped'), "selected GPU cases must not skip"
          PY
          SH
      - name: Collect diagnostics and remove test namespace
        if: always()
        shell: bash
        run: |
          mkdir -p results
          if [[ -z "${KUBE_CONTEXT:-}" ]]; then exit 0; fi
          status=0
          kubectl --context "$KUBE_CONTEXT" -n "$TEST_NAMESPACE" get pod cuinterpose-gpu -o yaml > results/pod.yaml || status=1
          kubectl --context "$KUBE_CONTEXT" -n "$TEST_NAMESPACE" describe pod cuinterpose-gpu > results/pod-description.txt || status=1
          kubectl --context "$KUBE_CONTEXT" -n "$TEST_NAMESPACE" logs cuinterpose-gpu > results/pod.log || status=1
          kubectl --context "$KUBE_CONTEXT" -n "$TEST_NAMESPACE" cp cuinterpose-gpu:/work/results results/pod-results || status=1
          kubectl --context "$KUBE_CONTEXT" -n "$TEST_NAMESPACE" delete namespace "$TEST_NAMESPACE" --ignore-not-found --timeout=120s || status=1
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cuinterpose-gpu-results
          path: results/
          if-no-files-found: error
          retention-days: 14
