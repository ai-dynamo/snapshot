name: E2E Benchmark History

# Publishes the framework benchmark results of each scheduled main run of
# e2e-frameworks.yaml to the e2e-benchmark-history branch. A workflow of its
# own rather than a job there: e2e-pr.yaml calls e2e-frameworks.yaml with
# read-only permissions, and a called workflow cannot hold a job that asks for
# more. workflow_run also runs this from the default branch, so the only token
# that can push history never runs pull request code.

on:
  workflow_run:
    workflows: [E2E Framework Tests]
    types: [completed]

permissions: {}

jobs:
  publish:
    name: publish framework benchmark history
    # Not a cancelled run: an operator-cancelled nightly must not synthesize
    # and permanently publish infrastructure_failed records that identity
    # dedup then stops a re-run from replacing.
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: snapshot-e2e-benchmark-history
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      SOURCE_EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # All attempts of the source run: "Re-run failed jobs" re-executes only
      # the failed matrix jobs, so the passing frameworks' results still live
      # in the earlier attempt's artifacts.
      # No continue-on-error: a pattern matching nothing is not a failure for
      # this action, so the flag would only turn a real API error into a set of
      # fabricated infrastructure_failed results.
      - name: Download framework benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: e2e-framework-benchmark-*-${{ github.event.workflow_run.id }}-*
          path: ${{ runner.temp }}/e2e-framework-benchmark-results
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Fetch or initialize benchmark history
        id: history
        uses: ./.github/actions/fetch-benchmark-history
        with:
          token: ${{ github.token }}
          bootstrap: "true"
          persist-credentials: "true"

      # The source run's identity, not this run's: results are matched by run
      # ID, and GITHUB_RUN_ID, GITHUB_SHA and GITHUB_EVENT_NAME here describe
      # this workflow_run job.
      - name: Aggregate and index benchmark results
        env:
          SNAPSHOT_E2E_HISTORY_DIR: ${{ steps.history.outputs.history_dir }}
        run: |
          set -euo pipefail
          PYTHONPATH=e2e python3 -m snapshot_e2e.benchmark_history aggregate \
            --artifacts-dir "${RUNNER_TEMP}/e2e-framework-benchmark-results" \
            --history-dir "${SNAPSHOT_E2E_HISTORY_DIR}" \
            --output-dir "${RUNNER_TEMP}/e2e-framework-benchmark-comparison" \
            --summary-file "${GITHUB_STEP_SUMMARY}" \
            --run-id "${SOURCE_RUN_ID}" \
            --run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --source-commit "${SOURCE_SHA}" \
            --source-ref "refs/heads/${SOURCE_BRANCH}" \
            --source-event "${SOURCE_EVENT}" \
            --expected-case vllm \
            --expected-case sglang \
            --expected-case tensorrt-llm \
            --publish

      - name: Commit and push benchmark history
        env:
          SNAPSHOT_E2E_HISTORY_DIR: ${{ steps.history.outputs.history_dir }}
        run: |
          set -euo pipefail
          git -C "${SNAPSHOT_E2E_HISTORY_DIR}" config user.name "github-actions[bot]"
          git -C "${SNAPSHOT_E2E_HISTORY_DIR}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${SNAPSHOT_E2E_HISTORY_DIR}" add results index
          if git -C "${SNAPSHOT_E2E_HISTORY_DIR}" diff --cached --quiet; then
            echo "History already contains this workflow attempt; nothing to push."
            exit 0
          fi
          git -C "${SNAPSHOT_E2E_HISTORY_DIR}" commit --signoff \
            --message "data(e2e): record benchmark run ${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          git -C "${SNAPSHOT_E2E_HISTORY_DIR}" push origin HEAD:refs/heads/e2e-benchmark-history

      - name: Upload benchmark comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-benchmark-comparison-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/e2e-framework-benchmark-comparison
          if-no-files-found: error
          retention-days: 30
