name: Publish Artifacts

on:
  push:
    tags:
      - 'v*'

jobs:
  # Single job so the Helm push reuses the docker login credentials
  # (helm reads ~/.docker/config.json); a separate job would start on a fresh
  # runner with no registry auth.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Derive version (strip leading v for SemVer/OCI)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - name: Build and push images
        run: |
          make docker-build-agent    TAGS="$VERSION" DOCKER_BUILD_ARGS=--push
          make docker-build-operator TAGS="$VERSION" DOCKER_BUILD_ARGS=--push
      - name: Package and push Helm chart
        run: make chart-package chart-push CHART_VERSION="$VERSION" APP_VERSION="$VERSION"
