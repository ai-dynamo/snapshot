name: Publish Artifacts

on:
  push:
    tags:
      - '*.*.*'
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Tag push publishes directly; a workflow_run publishes only for a successful CI on main.
    if: >-
      ${{ github.event_name == 'push' ||
          (github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & publish images and chart
        run: |
          set -euo pipefail

          registry="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            # 'g' prefix keeps all-numeric short SHAs valid as a semver prerelease.
            version="v0.0.0-g$(git rev-parse --short HEAD)"
          fi
          echo "Publishing registry=${registry} version=${version}"

          make docker-build-agent    REGISTRY="$registry" TAGS="$version" DOCKER_BUILD_ARGS=--push
          make docker-build-operator REGISTRY="$registry" TAGS="$version" DOCKER_BUILD_ARGS=--push

          helm package charts/snapshot --version "$version" --app-version "$version"
          helm push "snapshot-${version}.tgz" "oci://${registry}/charts"
