name: Publish Artifacts

on:
  push:
    tags:
      - 'v*'

jobs:
  push-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push agent image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: agent
          push: true
          tags: ghcr.io/ai-dynamo/snapshot/agent:${{ github.ref_name }}
      - name: Build and push operator image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: operator
          push: true
          tags: ghcr.io/ai-dynamo/snapshot/operator:${{ github.ref_name }}

  push-chart:
    runs-on: ubuntu-latest
    needs: push-images
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Package and push Helm chart
        run: |
          helm package charts/snapshot --version ${{ github.ref_name }}
          helm push snapshot-${{ github.ref_name }}.tgz oci://ghcr.io/ai-dynamo/snapshot/charts
