name: Snapshot E2E vCluster Setup

# Temporary PR trigger while the e2e infra is being validated.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/e2e-vcluster-setup.yaml"
      - ".github/actions/install-vcluster-cli/**"
      - "e2e/**"
      - "charts/snapshot/**"

concurrency:
  group: snapshot-e2e-vcluster-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    name: Prepare Snapshot e2e vCluster
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 240
    env:
      HOST_NAMESPACE: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      VCLUSTER_NAME: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_NAMESPACE: snapshot-e2e
      SNAPSHOT_E2E_HOST_NAMESPACE: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      SNAPSHOT_E2E_VCLUSTER_NAME: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      SNAPSHOT_E2E_TEST_NAMESPACE: snapshot-e2e
      SNAPSHOT_E2E_TARGET_KUBECONFIG: ${{ github.workspace }}/.kubeconfig-snapshot-e2e
      SNAPSHOT_E2E_SNAPSHOT_RELEASE: snapshot
      SNAPSHOT_E2E_SNAPSHOT_TAG: v0.0.0-g71827d8e
      SNAPSHOT_E2E_PVC_NAME: snapshot-pvc
      SNAPSHOT_E2E_PVC_SIZE: 2Gi
      SNAPSHOT_E2E_MODE: vcluster
      SNAPSHOT_E2E_VCLUSTER_K8S_VERSION: v1.32.13
      SNAPSHOT_E2E_VCLUSTER_LOCAL_PORT: "8443"
      SNAPSHOT_E2E_HELM_TIMEOUT: 10m
      SNAPSHOT_E2E_READY_TIMEOUT_SECONDS: "900"
      SNAPSHOT_E2E_RESULT_FILE: ${{ runner.temp }}/snapshot-e2e-setup-result.json
      PYTHONUNBUFFERED: "1"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preserve host kubeconfig
        id: host
        run: |
          echo "kubeconfig=${KUBECONFIG:-}" >> "${GITHUB_OUTPUT}"

      - name: Start debug shell
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 10
        with:
          detached: true
          limit-access-to-actor: true

      - name: Install vCluster CLI
        timeout-minutes: 5
        uses: ./.github/actions/install-vcluster-cli

      - name: Install uv
        timeout-minutes: 5
        run: |
          echo "::group::Install uv"
          set -euo pipefail

          if ! command -v uv >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 2 \
              --connect-timeout 10 --max-time 120 \
              --fail --show-error -LsSf \
              https://astral.sh/uv/install.sh | sh
            echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
            export PATH="${HOME}/.local/bin:${PATH}"
          fi

          uv --version
          echo "::endgroup::"

      - name: Run host preflight
        timeout-minutes: 5
        run: |
          set -euo pipefail
          uv run --project e2e python -m snapshot_e2e.infra.setup \
            --phase host-preflight

      - name: Create and connect vCluster
        timeout-minutes: 25
        run: |
          set -euo pipefail
          uv run --project e2e python -m snapshot_e2e.infra.setup \
            --phase vcluster

      - name: Install Snapshot chart
        timeout-minutes: 15
        run: |
          set -euo pipefail
          uv run --project e2e python -m snapshot_e2e.infra.setup \
            --phase snapshot-install

      - name: Wait for Snapshot readiness
        timeout-minutes: 20
        run: |
          set -euo pipefail
          uv run --project e2e python -m snapshot_e2e.infra.setup \
            --phase snapshot-ready

      - name: Export target kubeconfig
        timeout-minutes: 5
        run: |
          set -euo pipefail
          uv run --project e2e python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["SNAPSHOT_E2E_RESULT_FILE"]).read_text())

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"KUBECONFIG={result['target_kubeconfig']}\n")
              env.write(f"SNAPSHOT_E2E_HOST_NAMESPACE={result.get('host_namespace', '')}\n")
              env.write(f"SNAPSHOT_E2E_VCLUSTER_NAME={result.get('vcluster_name', '')}\n")
              env.write(f"SNAPSHOT_E2E_TEST_NAMESPACE={result['test_namespace']}\n")
              env.write(f"SNAPSHOT_E2E_TARGET_KUBECONFIG={result['target_kubeconfig']}\n")
              env.write(f"SNAPSHOT_E2E_SNAPSHOT_RELEASE={result['snapshot_release']}\n")
              env.write(f"SNAPSHOT_E2E_PVC_NAME={result['pvc_name']}\n")

          print(f"Target kubeconfig: {result['target_kubeconfig']}")
          PY

      - name: Inspect prepared target
        timeout-minutes: 5
        run: |
          set -euo pipefail
          kubectl get nodes -o wide
          kubectl get runtimeclass
          kubectl get pods -n "${TEST_NAMESPACE}" -o wide
          kubectl get pvc -n "${TEST_NAMESPACE}" -o wide

      - name: Validate prepared e2e environment
        timeout-minutes: 10
        run: |
          set -euo pipefail
          uv run --project e2e pytest e2e/tests -m environment -vv

      - name: Run Snapshot lifecycle e2e tests
        timeout-minutes: 90
        run: |
          set -euo pipefail
          uv run --project e2e pytest e2e/tests/test_snapshot_lifecycle.py -vv -s

      - name: Hold debug session
        if: ${{ always() }}
        timeout-minutes: 180
        run: |
          echo "Detached tmate is active. Holding runner before cleanup."
          sleep 10800

      - name: Cleanup vCluster
        if: ${{ always() }}
        env:
          KUBECONFIG: ${{ steps.host.outputs.kubeconfig }}
        run: |
          set +e
          if command -v vcluster >/dev/null 2>&1; then
            vcluster delete "${VCLUSTER_NAME}" --namespace "${HOST_NAMESPACE}"
          fi
          kubectl delete namespace "${HOST_NAMESPACE}" --ignore-not-found --wait=false
