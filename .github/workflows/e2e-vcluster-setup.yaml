name: Snapshot E2E vCluster Setup

# Temporary PR trigger while the e2e infra is being validated.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/e2e-vcluster-setup.yaml"
      - ".github/actions/setup-snapshot-e2e-vcluster/**"
      - "e2e/**"
      - "charts/snapshot/**"

concurrency:
  group: snapshot-e2e-vcluster-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    name: Prepare Snapshot e2e vCluster
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 240
    env:
      HOST_NAMESPACE: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      VCLUSTER_NAME: snapshot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_NAMESPACE: snapshot-e2e
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preserve host kubeconfig
        id: host
        run: |
          echo "kubeconfig=${KUBECONFIG:-}" >> "${GITHUB_OUTPUT}"

      - name: Start debug shell
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 10
        with:
          detached: true
          limit-access-to-actor: true

      - name: Setup Snapshot e2e vCluster
        id: setup
        uses: ./.github/actions/setup-snapshot-e2e-vcluster
        with:
          host_namespace: ${{ env.HOST_NAMESPACE }}
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          test_namespace: ${{ env.TEST_NAMESPACE }}

      - name: Inspect prepared target
        run: |
          set -euo pipefail
          kubectl get nodes -o wide
          kubectl get runtimeclass
          kubectl get pods -n "${TEST_NAMESPACE}" -o wide
          kubectl get pvc -n "${TEST_NAMESPACE}" -o wide

      - name: Validate prepared e2e environment
        run: |
          set -euo pipefail
          uv run --project e2e pytest e2e/tests -m environment -vv

      - name: Debug shell after setup
        if: ${{ always() }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 180
        with:
          limit-access-to-actor: true

      - name: Cleanup vCluster
        if: ${{ always() }}
        env:
          KUBECONFIG: ${{ steps.host.outputs.kubeconfig }}
        run: |
          set +e
          if command -v vcluster >/dev/null 2>&1; then
            vcluster delete "${VCLUSTER_NAME}" --namespace "${HOST_NAMESPACE}"
          fi
          kubectl delete namespace "${HOST_NAMESPACE}" --ignore-not-found --wait=false
