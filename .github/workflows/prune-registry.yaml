name: Prune Registry

# Every push to main publishes a v0.0.0-g<sha8> image and moves the layer cache
# tags onto new manifests, so untagged manifests accumulate indefinitely.
# hack/prune-ghcr.py deletes only digests that are both untagged and unreachable
# from any tagged version — see its module docstring for why "untagged" alone
# would break published releases, and why the cache is kept for days rather than
# months. It also expires the images e2e-pr.yaml publishes for pull requests,
# which are tagged and so would otherwise never go.
on:
  schedule:
    # Daily 04:00 UTC, off-hours. Daily so pull request images go close to their
    # keep_days rather than up to a week after it.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be deleted without deleting it'
        type: boolean
        default: true
      keep_days:
        description: 'Keep untagged versions newer than this many days'
        type: string
        default: '90'
      cache_keep_days:
        description: 'Same, for the layer cache, which turns over far faster'
        type: string
        default: '7'
      pr_keep_days:
        description: 'Keep pull request images (v0.0.0-pull-request-*) newer than this many days'
        type: string
        default: '7'

permissions: {}

concurrency:
  group: prune-registry
  cancel-in-progress: false

jobs:
  prune:
    name: Prune untagged GHCR versions
    runs-on: ubuntu-24.04
    permissions:
      # Read the source of the prune script.
      contents: read
      # List and delete container package versions.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DRY_RUN defaults to true on the schedule as well: this deletes published
      # artifacts, so it reports for a few cycles and a maintainer flips the
      # default here once the output has been reviewed.
      #
      # Pull request images are the exception, deleted for real on the schedule:
      # they are disposable by construction, and expiring them is selected by
      # their tag rather than inferred from reachability. A dispatch's dry_run
      # still covers both.
      #
      # The github.event_name guard is load-bearing. `inputs` is only populated
      # for workflow_dispatch and workflow_call, so on the schedule inputs.dry_run
      # is null — and GitHub coerces both null and false to 0, making
      # `inputs.dry_run == false` true there. Without this guard every scheduled
      # run would delete for real.
      - name: Prune
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: >-
            ${{ (github.event_name == 'workflow_dispatch'
                 && inputs.dry_run == false) && 'false' || 'true' }}
          KEEP_DAYS: ${{ inputs.keep_days || '90' }}
          CACHE_KEEP_DAYS: ${{ inputs.cache_keep_days || '7' }}
          PR_KEEP_DAYS: ${{ inputs.pr_keep_days || '7' }}
        run: |
          set -euo pipefail
          pr_dry_run="${DRY_RUN}"
          if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
            pr_dry_run=false
          fi
          python3 hack/prune-ghcr.py \
            --org "${GITHUB_REPOSITORY%%/*}" \
            --keep-days "${KEEP_DAYS}" \
            --cache-keep-days "${CACHE_KEEP_DAYS}" \
            --pr-keep-days "${PR_KEEP_DAYS}" \
            --dry-run "${DRY_RUN}" \
            --pr-dry-run "${pr_dry_run}"
