name: Post-Merge CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: post-merge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push agent image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: agent
          push: true
          tags: |
            ghcr.io/ai-dynamo/snapshot/agent:latest
            ghcr.io/ai-dynamo/snapshot/agent:main-${{ steps.vars.outputs.short_sha }}
      - name: Build and push operator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: operator
          push: true
          tags: |
            ghcr.io/ai-dynamo/snapshot/operator:latest
            ghcr.io/ai-dynamo/snapshot/operator:main-${{ steps.vars.outputs.short_sha }}

  publish-chart:
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Package and push Helm chart
        run: |
          helm package charts/snapshot --version 0.1.0-main.${{ steps.vars.outputs.short_sha }}
          helm push snapshot-0.1.0-main.${{ steps.vars.outputs.short_sha }}.tgz oci://ghcr.io/ai-dynamo/snapshot/charts
