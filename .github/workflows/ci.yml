name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - run: make build

  docker-build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - uses: docker/setup-buildx-action@v4.3.0

      - name: Build arm64 operator image
        run: |
          make docker-build-operator \
            OPERATOR_PLATFORM=linux/arm64 \
            DOCKER_BUILD_ARGS="--progress=plain \
              --cache-from=type=gha,scope=operator-arm64 \
              --cache-to=type=gha,scope=operator-arm64,mode=max,ignore-error=true"

      - name: Build arm64 agent image
        timeout-minutes: 90
        run: |
          make docker-build-agent \
            AGENT_PLATFORM=linux/arm64 \
            DOCKER_BUILD_ARGS="--progress=plain \
              --cache-from=type=gha,scope=agent-arm64 \
              --cache-to=type=gha,scope=agent-arm64,mode=max,ignore-error=true"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - run: make check
