name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  verify-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install controller-gen
        run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.16.0
      - name: Verify codegen
        run: make verify-generate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Lint
        run: make lint

  test-agent:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'agent/') || contains(github.event.head_commit.modified, 'api/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Test agent
        run: $(MAKE) -C agent test

  test-operator:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'operator/') || contains(github.event.head_commit.modified, 'api/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Test operator
        run: $(MAKE) -C operator test

  build-agent:
    runs-on: ubuntu-latest
    needs: test-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build agent
        run: $(MAKE) -C agent build

  build-operator:
    runs-on: ubuntu-latest
    needs: test-operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build operator
        run: $(MAKE) -C operator build
