name: CI

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
      - 'release/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - run: make build

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - run: make check

  # Cluster-free e2e checks: benchmark serialization, workload scripts, and
  # framework guide manifests against the restore-pod contract. Seconds to
  # run, so they gate every pull request rather than only the GPU e2e flows.
  e2e-static:
    runs-on: ubuntu-latest
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.11"
          checksum: "5a360b0de092ddf4131f5313d0411b48c4e95e8107e40c3f8f2e9fcb636b3583"
          enable-cache: "false"
          download-from-astral-mirror: "false"
      - run: |
          uv run --locked --project e2e pytest \
            e2e/tests/test_benchmark.py \
            e2e/tests/test_benchmark_outcomes.py \
            e2e/tests/test_benchmark_history.py \
            e2e/tests/test_framework_manifests.py \
            e2e/tests/test_workload_scripts.py -vv

  # Runs on every pull request so cross-cutting changes (shared workflows, the
  # history writer's output shape) cannot silently break the dashboard.
  benchmark-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}
      - run: npm ci
      - run: npm test
      - run: npm run validate-data -- --strict
      - run: npm exec playwright -- install --with-deps chromium
      - run: npm run test:browser
