name: CI

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - run: make build

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - run: make check

  # Cluster-free e2e checks: the workload scripts and the framework guide
  # manifests against the restore-pod contract. Seconds to run, so they gate
  # every pull request rather than only the GPU-gated e2e workflows.
  e2e-static:
    runs-on: ubuntu-latest
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.11"
          checksum: "5a360b0de092ddf4131f5313d0411b48c4e95e8107e40c3f8f2e9fcb636b3583"
          enable-cache: "false"
          download-from-astral-mirror: "false"
      - run: |
          uv run --locked --project e2e pytest \
            e2e/tests/test_framework_manifests.py \
            e2e/tests/test_multicontainer_diagnostics.py \
            e2e/tests/test_workload_scripts.py -vv

  helm-test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: helm plugin install https://github.com/helm-unittest/helm-unittest
      - run: helm unittest charts/snapshot/

  pagebroker-image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - run: |
          make docker-build-pagebroker \
            DOCKER_BUILD_ARGS="--cache-from=type=gha,scope=pagebroker \
              --cache-to=type=gha,scope=pagebroker,mode=max"
