# Checkpoint/restore e2e on every pull request, without a GPU.
#
# The cluster is k3d, so the Kubernetes node is a Docker container and CRIU
# dumps a workload nested inside it. That works: see the proof run linked from
# issue 241. Images are built in this job and pushed to its disposable local
# registry, from which the cluster pulls them.
#
# The GPU suite stays on its own schedule in e2e.yaml; this job shares the
# chart installer with it and differs only in the cluster it installs into.

name: E2E CPU (k3d)

on:
  pull_request:
  workflow_dispatch:
    inputs:
      qualify_restore_failure:
        description: "Corrupt a checkpoint and require restore success; this probe must fail"
        type: boolean
        default: false
      cache_scope_suffix:
        description: >-
          Appended to every layer-cache tag. Any unused value points the build
          at a cache that does not exist, which is how to measure a cold build
          without disturbing the cache other runs are reading.
        required: false
        default: ""

concurrency:
  # PR runs cancel superseded runs; manual qualification retains its evidence.
  group: snapshot-e2e-cpu-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Read-only, and deliberately so: the layer cache is written by
  # push-artifacts.yaml from main, never from a pull request, so that no pull
  # request can poison the builds that read it afterwards.
  packages: read

env:
  PYTHONUNBUFFERED: "1"
  UV_LINK_MODE: copy
  K3D_VERSION: v5.8.3
  KUBECTL_VERSION: v1.32.13
  # The k3d-managed registry hack/k3d-cpu-e2e.sh creates. localhost is the one
  # name Docker and BuildKit treat as plain-HTTP without further configuration;
  # the cluster is given a mirror that maps it to the registry's container.
  IMAGE_REGISTRY: localhost:5000
  IMAGE_TAG: cpu-e2e
  SNAPSHOT_E2E_MODE: direct
  SNAPSHOT_E2E_CPU_ONLY: "true"
  SNAPSHOT_E2E_TEST_NAMESPACE: snapshot-e2e
  SNAPSHOT_E2E_SNAPSHOT_RELEASE: snapshot
  SNAPSHOT_E2E_PVC_NAME: snapshot-pvc
  SNAPSHOT_E2E_PVC_SIZE: 2Gi
  SNAPSHOT_E2E_STORAGE_CLASS: snapshot-e2e-hostpath
  SNAPSHOT_E2E_K3D_CLUSTER: snapshot-cpu-e2e
  SNAPSHOT_E2E_HELM_TIMEOUT: 6m
  SNAPSHOT_E2E_READY_TIMEOUT_SECONDS: "480"
  CI_PHASE_LOG: ${{ github.workspace }}/.ci-phases.tsv
  CACHE_TAG_SUFFIX: ${{ inputs.cache_scope_suffix }}
  # Written by push-artifacts.yaml from main and release/*; read-only here.
  # See the comment on CACHE_REF_PREFIX there for why this is not the Actions
  # cache, and hack/ci-cache-flags.sh for why the tag is keyed by branch.
  CACHE_REF_PREFIX: ghcr.io/ai-dynamo/snapshot/cache
  # The branch this change targets, whose cache it reads. base_ref is set on a
  # pull request; ref_name covers a workflow_dispatch run on a branch.
  CACHE_BRANCH: ${{ github.base_ref || github.ref_name }}

jobs:
  cpu-e2e:
    name: CPU checkpoint/restore
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # setup.py and kubectl both read KUBECONFIG; in direct mode the target
      # cluster is the one it points at.
      KUBECONFIG: ${{ github.workspace }}/.kubeconfig-cpu-e2e
      SNAPSHOT_E2E_KUBECONFIG: ${{ github.workspace }}/.kubeconfig-cpu-e2e
      SNAPSHOT_E2E_SNAPSHOT_TAG: cpu-e2e
      # Not ${IMAGE_REGISTRY}: a job-level env cannot read another job-level
      # env. Keep in step with IMAGE_REGISTRY and IMAGE_TAG above.
      SNAPSHOT_E2E_WORKLOAD_IMAGE: localhost:5000/agent:cpu-e2e
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # k3d is needed before the builds, not just before the cluster: the
      # registry they push to is one it creates.
      - name: Install k3d
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/k3d \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d version

      # Images reach the cluster by being pushed here and pulled from the node,
      # rather than loaded into the runner's Docker daemon and then copied in.
      # The old route moved every image twice, which for a CUDA-based agent
      # image cost more than compiling it.
      - name: Create the image registry
        timeout-minutes: 5
        run: hack/k3d-cpu-e2e.sh registry-up

      # The container driver is what makes an external layer cache work at
      # all. It also puts the builder on its own network, where localhost is
      # the builder rather than the runner, so the registry created above
      # would be unreachable; host networking is what lets one tag mean the
      # same thing to the builder, the runner, and the cluster.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      # A pull request from a fork gets a token that cannot read the package.
      # cache-from treats that as a miss and builds cold, which is what every
      # run did before this change, so there is nothing to fall back from.
      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read-only against the cache push-artifacts.yaml writes from main, so
      # this reads the layers of the last merged build and writes nothing.
      # Two runs of the same pull request therefore do not help each other;
      # that is the price of a cache no pull request can corrupt.
      - name: Build operator image
        timeout-minutes: 15
        run: |
          set -euo pipefail
          start=$(date +%s)
          # Assigned, not inlined into the argument: a command substitution
          # that fails inside a simple command does not trip `set -e`, so an
          # inline call would drop the cache flags and still build -- the same
          # silent cache loss this whole change exists to fix.
          cache_flags="$(hack/ci-cache-flags.sh read operator "${CACHE_BRANCH}")"
          make docker-build-operator \
            REGISTRY="${IMAGE_REGISTRY}" \
            TAGS="${IMAGE_TAG}" \
            DOCKER_BUILD_ARGS="--push ${cache_flags}"
          hack/ci-phase.sh "Build operator image" "${start}" \
            "${IMAGE_REGISTRY}/operator:${IMAGE_TAG}"

      - name: Build agent image
        timeout-minutes: 50
        run: |
          set -euo pipefail
          start=$(date +%s)
          cache_flags="$(hack/ci-cache-flags.sh read agent "${CACHE_BRANCH}")"
          make docker-build-agent \
            REGISTRY="${IMAGE_REGISTRY}" \
            TAGS="${IMAGE_TAG}" \
            DOCKER_BUILD_ARGS="--push ${cache_flags}"
          hack/ci-phase.sh "Build agent image" "${start}" \
            "${IMAGE_REGISTRY}/agent:${IMAGE_TAG}"

      # The restore path extracts the rootfs diff with the bundled tar, run
      # under the bundled loader so the placeholder's glibc never has to
      # satisfy it. This cluster's placeholder is the agent image itself, so
      # the suite below would not notice that breaking; check it against an
      # older userspace, here, where the agent build's cache is still warm.
      - name: Verify the bundled tar on an older placeholder
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # The bundle alone, from its own stage. Reading it out of the agent
          # image would mean pulling that image into the daemon, which is the
          # cost this job no longer pays.
          cache_flags="$(hack/ci-cache-flags.sh read agent "${CACHE_BRANCH}")"
          make docker-export-agent-bundle \
            BUNDLE_DEST="${RUNNER_TEMP}/agent-bundle" \
            DOCKER_BUILD_ARGS="${cache_flags}"
          hack/verify-bundle-glibc.sh "${RUNNER_TEMP}/agent-bundle"

      - name: Build PageBroker image
        timeout-minutes: 30
        run: |
          set -euo pipefail
          start=$(date +%s)
          cache_flags="$(hack/ci-cache-flags.sh read pagebroker "${CACHE_BRANCH}")"
          make docker-build-pagebroker \
            REGISTRY="${IMAGE_REGISTRY}" \
            TAGS="${IMAGE_TAG}" \
            DOCKER_BUILD_ARGS="--push ${cache_flags}"
          hack/ci-phase.sh "Build PageBroker image" "${start}" \
            "${IMAGE_REGISTRY}/pagebroker:${IMAGE_TAG}"

      # A pass has to be attributable to the images this job built, not to
      # whatever a registry happened to serve. The registry read below is this
      # job's own throwaway one, which nothing else writes to, so the digests
      # it returns are the ones these steps produced. Last of the build steps,
      # so every image it names has been built.
      - name: Record image provenance
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # The commit that was built, read from the checkout rather than from
          # the event: on a pull_request run the default checkout is the merge
          # of head into base, so the head SHA names a tree this job never
          # compiled. It is still worth printing, as the thing a reviewer
          # recognises, but only alongside what was actually built.
          built="$(git rev-parse HEAD)"
          {
            echo "### Images under test"
            echo
            if [ "${built}" = "${HEAD_SHA}" ]; then
              echo "Built from commit \`${built}\`."
            else
              echo "Built from commit \`${built}\`, the merge of \`${HEAD_SHA}\` into \`${BASE_REF}\`."
            fi
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
            for component in operator agent pagebroker; do
              image="${IMAGE_REGISTRY}/${component}:${IMAGE_TAG}"
              # The digest the cluster will pull by, read back out of the
              # registry. Stronger than the local image ID this used to print:
              # that named a blob in one daemon, this names what was served.
              digest="$(docker buildx imagetools inspect "${image}" \
                --format '{{.Manifest.Digest}}' 2>/dev/null || echo 'unavailable')"
              echo "| \`${image}\` | \`${digest}\` |"
            done
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Install kubectl
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install Python tooling
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          checksum: "5a360b0de092ddf4131f5313d0411b48c4e95e8107e40c3f8f2e9fcb636b3583"
          enable-cache: "false"
          download-from-astral-mirror: "false"

      - name: Create k3d cluster
        timeout-minutes: 10
        run: hack/k3d-cpu-e2e.sh cluster-up

      - name: Install Snapshot
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The cluster contributes the values that describe itself; this job
          # adds only the images it just built, which must be used from the
          # node rather than pulled.
          #
          # The helper is alone in its substitution, and assigned rather than
          # exported, so that `set -e` sees it fail. A substitution reports the
          # status of its *last* command, so appending the image lines inside it
          # would hide a failure here, and `export` would hide it again.
          cluster_values="$(hack/k3d-cpu-e2e.sh helm-set)"
          export SNAPSHOT_E2E_HELM_SET="${cluster_values}
          image.operator.repository=${IMAGE_REGISTRY}/operator
          image.agent.repository=${IMAGE_REGISTRY}/agent
          image.pageBroker.repository=${IMAGE_REGISTRY}/pagebroker
          image.operator.pullPolicy=IfNotPresent
          image.agent.pullPolicy=IfNotPresent
          image.pageBroker.pullPolicy=IfNotPresent"
          uv run --locked --project e2e python -m snapshot_e2e.infra.setup \
            --phase snapshot-install \
            --skip-host-preflight

      - name: Wait for Snapshot components
        timeout-minutes: 10
        run: |
          set -euo pipefail
          uv run --locked --project e2e python -m snapshot_e2e.infra.setup \
            --phase snapshot-ready

      - name: Check the environment is usable
        timeout-minutes: 5
        run: uv run --locked --project e2e pytest e2e/tests -m environment -vv

      - name: Run CPU checkpoint/restore tests
        id: cpu_tests
        timeout-minutes: 25
        env:
          # Dispatch-only negative control; normal PR runs disable it.
          SNAPSHOT_E2E_RESTORE_FAILURE_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_restore_failure && 'true' || 'false' }}
          # The cases this job exists to prove. pytest exits 0 when a test is
          # deselected or skips, so without naming them a marker change could
          # leave the check green while it tested no round trip at all.
          SNAPSHOT_E2E_REQUIRED_TESTS: >-
            test_one_cpu_snapshot_restores_into_two_containers,
            test_snapshotjob_cpu_captures_and_restore_recovers_state,
            test_restore_from_a_damaged_checkpoint_fails_and_keeps_the_snapshot
        run: |
          set -euo pipefail
          start=$(date +%s)
          # Recorded even when the suite fails, so a slow run is still
          # measurable; the trap keeps the pipeline's exit status.
          trap 'hack/ci-phase.sh "Run CPU tests" "${start}"' EXIT
          uv run --locked --project e2e pytest e2e/tests -m cpu -vv -s \
            --junitxml="${RUNNER_TEMP}/cpu-e2e-junit.xml"

      - name: Verify restore-failure negative control
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.qualify_restore_failure && steps.cpu_tests.outcome != 'skipped' }}
        env:
          CPU_PYTEST_OUTCOME: ${{ steps.cpu_tests.outcome }}
        run: |
          uv run --locked --project e2e python -m snapshot_e2e.restore_failure_qualification \
            "${RUNNER_TEMP}/cpu-e2e-junit.xml" --pytest-outcome "${CPU_PYTEST_OUTCOME}"

      # Last, and unconditional: the phases worth comparing are exactly the
      # ones a failing run also pays for.
      - name: Summarise job phases
        if: ${{ always() }}
        run: |
          set -euo pipefail
          state="warm (\`${CACHE_BRANCH}\`)"
          if [ -n "${CACHE_TAG_SUFFIX}" ]; then
            state="cold (tag suffix \`${CACHE_TAG_SUFFIX}\`)"
          fi
          hack/ci-phase-summary.sh "${state}" >>"${GITHUB_STEP_SUMMARY}"
          # This job used to delete ~25 GB of preinstalled SDKs before it
          # started, from when every image was unpacked into the Docker daemon
          # and then copied into the node again. Nothing is loaded into the
          # daemon now. Reported rather than assumed, so the headroom is on the
          # record and a future squeeze is diagnosable rather than mysterious.
          printf '\n**Disk** %s\n' "$(df -h --output=avail,pcent / | tail -1 | tr -s ' ')" \
            >>"${GITHUB_STEP_SUMMARY}"

      - name: Collect diagnostics
        if: ${{ failure() }}
        run: |
          set +e
          out="${RUNNER_TEMP}/diagnostics"
          mkdir -p "${out}"
          if [ -f "${RUNNER_TEMP}/cpu-e2e-junit.xml" ]; then
            cp "${RUNNER_TEMP}/cpu-e2e-junit.xml" "${out}/cpu-e2e-junit.xml"
          fi
          kubectl get pods -A -o wide >"${out}/pods.txt"
          kubectl describe pods -n "${SNAPSHOT_E2E_TEST_NAMESPACE}" >"${out}/pods-describe.txt"
          kubectl get events -n "${SNAPSHOT_E2E_TEST_NAMESPACE}" \
            --sort-by=.lastTimestamp >"${out}/events.txt"
          kubectl get pvc,pv -o yaml >"${out}/storage.yaml"
          kubectl get podsnapshots,podsnapshotcontents -A -o yaml >"${out}/snapshots.yaml"
          kubectl logs -n "${SNAPSHOT_E2E_TEST_NAMESPACE}" \
            -l app.kubernetes.io/component=snapshot-agent \
            --all-containers --tail=-1 --prefix >"${out}/agent.log"
          kubectl logs -n "${SNAPSHOT_E2E_TEST_NAMESPACE}" \
            -l app.kubernetes.io/component=operator \
            --all-containers --tail=-1 --prefix >"${out}/operator.log"
          echo "DIAGNOSTICS_DIR=${out}" >>"${GITHUB_ENV}"

      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIAGNOSTICS_DIR }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete k3d cluster
        if: ${{ always() }}
        run: hack/k3d-cpu-e2e.sh cluster-down
