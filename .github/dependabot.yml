# `cooldown` holds a newly published version back for a few days — the window in
# which a compromised release is most likely to still be undetected. It applies
# to version updates only; Dependabot security updates ignore it and open
# immediately.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # One entry covering all three modules: gomod resolves manifests per
  # directory and does not follow go.work.
  - package-ecosystem: gomod
    directories:
      - /api
      - /agent
      - /operator
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # Minor and patch bumps land as one pull request per module. Majors stay
      # ungrouped so each gets its own review.
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # operator/ only. agent/Dockerfile pins its CUDA base through an ARG that
  # Dependabot cannot parse, and its ubuntu:24.04 CRIU builder must stay on the
  # release the committed package baseline was captured against — see
  # `make verify-base-packages`.
  - package-ecosystem: docker
    directory: /operator
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The Go toolchain version is a project decision pinned across go.work,
      # the three go.mod files, hack/tools.mk, agent/Dockerfile and the
      # workflows. Digest refreshes of the builder image are welcome; moving it
      # to a toolchain CI does not validate against is not. Bump the toolchain
      # deliberately, everywhere at once.
      - dependency-name: "golang"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # The e2e suite is a uv-managed Python project with its own lockfile. Nothing
  # covered it until now, so its dependencies were never proposed for update —
  # an OpenSSF Scorecard run against the repo reports a known pytest advisory
  # (PYSEC-2026-1845) that no tooling here would have surfaced.
  - package-ecosystem: uv
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      e2e-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
