language = "C"
style = "tag"
pragma_once = true
usize_is_size_t = true
sys_includes = ["cuda.h"]
# Preserve original CUDA names so ABI fields and frontend wrappers can
# distinguish the original entry points from their _v2 versions.
after_includes = """
#undef cuGetProcAddress
#undef cuIpcOpenMemHandle
"""
autogen_warning = "/* Generated by cbindgen; do not edit. */"

[export]
# These tables are not returned by a public function in this crate, so cbindgen
# cannot discover them automatically. This is a generation-root list, not the
# ELF export policy; frontend/libcuinterpose.ldscript controls that policy.
include = ["FrontendAbi", "BackendAbi"]
# ABI_VERSION is the sole C constant. CUDA types come from cuda.h.
item_types = ["constants", "structs", "typedefs"]
