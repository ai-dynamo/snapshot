language = "C"
style = "tag"
pragma_once = true
usize_is_size_t = true
autogen_warning = "/* Generated by cbindgen; do not edit. */"
after_includes = "struct AllocationProp; struct Access; struct MulticastProp;"

[export]
include = ["Core", "Host", "DebugStats", "CUDA_VERSION"]
exclude = [
    "AllocationProp", "Access", "MulticastProp",
    "SUCCESS", "INVALID_VALUE", "OUT_OF_MEMORY", "NOT_INITIALIZED",
    "INVALID_HANDLE", "NOT_READY", "NOT_SUPPORTED", "UNKNOWN", "POSIX_FD",
    "ALLOCATION_PINNED", "LOCATION_DEVICE", "ACCESS_READWRITE",
    "STREAM_NON_BLOCKING", "HANDLE_TAG", "HANDLE_MASK",
]

[export.rename]
AllocationProp = "struct AllocationProp"
Access = "struct Access"
MulticastProp = "struct MulticastProp"
