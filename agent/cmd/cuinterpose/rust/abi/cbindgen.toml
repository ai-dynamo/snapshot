language = "C"
style = "tag"
pragma_once = true
usize_is_size_t = true
sys_includes = ["cuda.h"]
# Preserve original CUDA names so ABI fields and frontend wrappers can
# distinguish the original entry points from their _v2 versions.
after_includes = """
#undef cuGetProcAddress
#undef cuIpcOpenMemHandle
#undef cuCtxDestroy
#undef cuDevicePrimaryCtxRelease
#undef cuDevicePrimaryCtxReset
"""
autogen_warning = "/* Generated by cbindgen. Do not edit. */"

[export]
# No public function in this crate returns these tables, so cbindgen cannot find them
# automatically. List the tables here for generation. frontend/libcuinterpose.ldscript
# controls ELF symbol exports.
include = ["FrontendAbi", "BackendAbi"]
# ABI_VERSION is the only C constant. CUDA types come from cuda.h.
item_types = ["constants", "structs", "typedefs"]
