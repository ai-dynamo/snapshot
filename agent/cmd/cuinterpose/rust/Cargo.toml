[workspace]
members = ["abi", "frontend", "core", "protocol", "coordinator"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cuinterpose-protocol = { path = "protocol" }
cuinterpose-abi = { path = "abi" }

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
