run:
  timeout: 10m
  allow-parallel-runners: true

issues:
  exclude-rules:
    # Node-agent internals: relax style/complexity linters on the faithfully
    # migrated CRIU/CUDA/runtime code. Correctness linters stay enabled.
    - path: "internal/"
      linters:
        - dupl
        - lll
        - gocyclo
        - prealloc
        - unparam
        - goconst
    # CLI code carries long flag/usage/error strings.
    - path: "cmd/"
      linters:
        - lll
    # Table-driven tests legitimately repeat literals and run long.
    - path: "_test\\.go"
      linters:
        - dupl
        - goconst
        - gocyclo
        - prealloc
        - unparam

linters:
  disable-all: true
  enable:
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - staticcheck
    - typecheck
    - unconvert
    - unparam
    - unused
