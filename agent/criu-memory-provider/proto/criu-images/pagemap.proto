syntax = "proto2";
import "criu-images/opts.proto";

message pagemap_head { required uint32 pages_id = 1; }
message pagemap_entry {
	required uint64 vaddr = 1 [(criu).hex = true];
	required uint32 compat_nr_pages = 2;
	optional bool in_parent = 3;
	optional uint32 flags = 4 [(criu).flags = "pmap.flags"];
	optional uint64 nr_pages = 5;
	optional pagemap_blocks blocks = 6;
}
message pagemap_blocks {
	repeated uint32 block_sizes = 1 [packed = true];
	required uint64 total_payload_size = 2;
	required uint32 pages_per_block = 3;
}
