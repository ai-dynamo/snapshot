syntax = "proto2";

// This is the subset of CRIU's fdinfo schema needed to resolve a VMA's
// file-object ID to a memfd inode. Other FileEntry variants are ignored.
import "criu-images/memfd.proto";

message file_entry {
	required uint32 type = 1;
	required uint32 id = 2;
	optional memfd_file_entry memfd = 20;
}
