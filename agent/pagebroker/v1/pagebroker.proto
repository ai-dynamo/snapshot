syntax = "proto3";
package snapshot.pagebroker.v1;
option go_package = "github.com/ai-dynamo/snapshot/agent/internal/pagebroker";

message FilesystemStorage
{
  optional string directory = 1;
}
message StorageBackend
{
  // Requests require exactly one storage kind.
  oneof kind
  {
    FilesystemStorage filesystem = 1;
  }
}
message PosixCopyIOEngine {}
message IOEngine
{
  // Requests require exactly one I/O engine.
  oneof kind
  {
    PosixCopyIOEngine posix_copy = 1;
    NixlIOEngine nixl = 2;
  }
}

message GpuDeviceMapping
{
  string source_uuid = 1;
  string target_uuid = 2;
}
// GPU execution supplies host PIDs resolved by the agent and the full context.
// Artifact validation occurs when CheckpointGpu or RestoreGpu runs.
message GpuContext
{
  repeated uint32 captured_pids = 1;
  repeated string visible_devices = 2;
  repeated GpuDeviceMapping device_map = 3;
}
message GpuTarget
{
  uint32 captured_pid = 1;
  // PID in the host PID namespace.
  uint32 target_pid = 2;
}
// Targets must be nonempty, have unique captured and target PIDs, and match
// GpuContext.captured_pids. Invalid sets return INVALID_REQUEST without execution.
message CheckpointGpuRequest { repeated GpuTarget targets = 1; GpuContext context = 2; }
// Uses the same target validation as CheckpointGpuRequest.
message RestoreGpuRequest { repeated GpuTarget targets = 1; GpuContext context = 2; }
message CapabilitiesRequest {}

message StagedRestoreRequest
{
  StorageBackend source = 1;
  IOEngine io_engine = 2;
}
// Keeps the source open for direct reads. Does not create CPU staging files.
message DirectRestoreRequest
{
  StorageBackend source = 1;
  IOEngine io_engine = 2;
}
message PrepareStagedCheckpointRequest
{
  StorageBackend destination = 1;
  IOEngine io_engine = 2;
}
message PrepareDirectCheckpointRequest
{
  StorageBackend destination = 1;
  IOEngine io_engine = 2;
}
// Completes a live transaction. PageBroker retains up to 1,024 terminal transactions for up to one hour.
// Repeating Commit for a retained committed transaction returns CommitComplete.
// Aborted, expired, or unknown transactions return TRANSACTION_NOT_FOUND.
message CommitRequest {}
// Releases PageBroker state for a live transaction. PageBroker retains up to 1,024 terminal transactions for up to
// one hour. Repeating Abort for a retained aborted transaction returns AbortComplete. Abort for a committed or
// expired, or unknown transaction returns TRANSACTION_NOT_FOUND.
message AbortRequest {}

message Request
{
  // Snapshot assigns an ID to each request.
  optional string request_id = 1;
  // Snapshot assigns a unique transaction ID before the first request and does not reuse it while PageBroker retains it.
  // After two hours and five minutes, the transaction expires. This cancels GPU
  // work. Expiry cleanup waits for active GPU transfers to stop.
  optional string transaction_id = 2;
  oneof command
  {
    StagedRestoreRequest staged_restore = 3;
    PrepareStagedCheckpointRequest prepare_staged_checkpoint = 4;
    CommitRequest commit = 5;
    AbortRequest abort = 6;
    DirectRestoreRequest direct_restore = 7;
    PrepareDirectCheckpointRequest prepare_direct_checkpoint = 8;
    CheckpointGpuRequest checkpoint_gpu = 9;
    RestoreGpuRequest restore_gpu = 10;
    CapabilitiesRequest capabilities = 11;
  }
}

message StagedRestoreDirectory
{
  optional string image_directory = 1;
}
message DirectRestoreReady {}
message DirectCheckpointDirectory { optional string image_directory = 1; }
message Capabilities { bool custom_storage_available = 1; }
message GpuParticipantResult
{
  uint32 captured_pid = 1;
  uint64 bytes = 2;
}
message GpuComplete { repeated GpuParticipantResult participants = 1; }
message StagedCheckpointDirectory
{
  optional string image_directory = 1;
}
message CommitComplete {}
// GPU work and cleanup have finished before transaction files are released.
// This does not stop a workload that has already restored successfully.
message AbortComplete {}
message Failure
{
  enum Code {
    // No failure code was supplied.
    UNSPECIFIED = 0;
    // The request is invalid or unsupported. PageBroker did not change transaction state.
    INVALID_REQUEST = 1;
    // The transaction is unknown or has reached the opposite terminal state.
    TRANSACTION_NOT_FOUND = 2;
    // The transaction ID or checkpoint destination conflicts with an existing transaction or output.
    TRANSACTION_CONFLICT = 3;
    // Tmpfs staging lacks space. PageBroker did not create staging for this request.
    INSUFFICIENT_STORAGE = 4;
    // Storage I/O failed. The caller may Abort the transaction before retrying with a new transaction ID.
    STORAGE_ERROR = 5;
    // The operation failed or was cancelled. Abort the transaction before retrying.
    INTERNAL_ERROR = 6;
  }
  optional Code code = 1;
  optional string message = 2;
}
message Response
{
  optional string request_id = 1;
  optional string transaction_id = 2;
  oneof result
  {
    StagedRestoreDirectory staged_restore_directory = 3;
    StagedCheckpointDirectory staged_checkpoint_directory = 4;
    CommitComplete commit_complete = 5;
    AbortComplete abort_complete = 6;
    Failure failure = 7;
    DirectRestoreReady direct_restore_ready = 8;
    DirectCheckpointDirectory direct_checkpoint_directory = 9;
    GpuComplete gpu_checkpoint_complete = 10;
    GpuComplete gpu_restore_complete = 11;
    Capabilities capabilities = 12;
  }
}

// Registered-buffer transfers. Directory staging is not implemented for NIXL.
message NixlIOEngine {}
