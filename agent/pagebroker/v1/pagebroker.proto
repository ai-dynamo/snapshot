syntax = "proto3";
package snapshot.pagebroker.v1;
option go_package = "github.com/ai-dynamo/snapshot/agent/internal/pagebroker";

message FilesystemStorage
{
  optional string directory = 1;
}
message StorageBackend
{
  // Requests require exactly one storage kind.
  oneof kind
  {
    FilesystemStorage filesystem = 1;
  }
}
message PosixCopyIOEngine {}
message IOEngine
{
  // Requests require exactly one I/O engine.
  oneof kind
  {
    PosixCopyIOEngine posix_copy = 1;
  }
}

message StagedRestoreRequest
{
  StorageBackend source = 1;
  IOEngine io_engine = 2;
}
// Allows a future GPU engine to read source data without a staging directory.
message DirectRestoreRequest
{
  StorageBackend source = 1;
  IOEngine io_engine = 2;
}
message PrepareStagedCheckpointRequest
{
  StorageBackend destination = 1;
  IOEngine io_engine = 2;
}
// Completes a live transaction. PageBroker retains up to 1,024 terminal transactions for up to one hour.
// Repeating Commit for a retained committed transaction returns CommitComplete; Commit for an aborted, expired, or
// unknown transaction returns TRANSACTION_NOT_FOUND.
message CommitRequest {}
// Releases PageBroker state for a live transaction. PageBroker retains up to 1,024 terminal transactions for up to
// one hour. Repeating Abort for a retained aborted transaction returns AbortComplete; Abort for a committed, expired,
// or unknown transaction returns TRANSACTION_NOT_FOUND.
message AbortRequest {}

// Bind a connection to one participant in an existing STAGED transaction.
// After binding, the connection accepts only AllocationSessionRequest frames.
// The trusted agent opens this connection before passing it into the workload.
message BindAllocationSession
{
  enum Direction {
    UNSPECIFIED = 0;
    SAVE = 1;
    LOAD = 2;
  }
  Direction direction = 1;
  // Lowercase, 32-character hex cuinterpose participant identity.
  string participant_id = 2;
}
message AllocationExtent
{
  string allocation_id = 1;
  uint64 size = 2;
  // CUDA UUID bytes, not a process-local device ordinal. On load this is the
  // destination UUID; the manifest retains the captured source UUID.
  bytes device_uuid = 3;
  reserved 4;
  reserved "sha256";
}
message AllocationBatch
{
  // One CUDA export FD per extent, attached in this order with SCM_RIGHTS.
  // At most 32 extents per frame; the worker also receives one storage FD.
  repeated AllocationExtent extents = 1;
}
message AllocationSessionRequest
{
  oneof command {
    AllocationBatch batch = 1;
    // Complete exactly the allocation set submitted on this connection.
    CommitRequest finish = 2;
  }
}
message AllocationSessionReply
{
  oneof result {
    // An empty batch acknowledges session readiness. Batch replies contain
    // the transferred extents.
    AllocationBatch completed = 1;
    CommitComplete finished = 2;
    Failure failure = 3;
  }
}
// Private broker-to-worker envelope, using the same extent/batch schema.
// Descriptors are [CUDA exports..., participant content file].
message AllocationWorkerRequest
{
  BindAllocationSession.Direction direction = 1;
  AllocationBatch batch = 2;
  // Broker-owned offsets, in batch extent order; never supplied by callers.
  repeated uint64 storage_offsets = 3;
}
message AllocationManifest
{
  uint32 version = 1;
  string participant_id = 2;
  repeated AllocationExtent extents = 3;
  // Version 2 packs extent bytes into content.bin, in extent order.
  repeated uint64 storage_offsets = 4;
}

message Request
{
  // Snapshot assigns an ID to each request.
  optional string request_id = 1;
  // Snapshot assigns a unique transaction ID before the first request and does not reuse it while PageBroker retains it.
  // An uncommitted transaction expires one hour after staging begins.
  optional string transaction_id = 2;
  oneof command
  {
    StagedRestoreRequest staged_restore = 3;
    PrepareStagedCheckpointRequest prepare_staged_checkpoint = 4;
    CommitRequest commit = 5;
    AbortRequest abort = 6;
    DirectRestoreRequest direct_restore = 7;
    BindAllocationSession bind_allocations = 8;
  }
}

message StagedRestoreDirectory
{
  optional string image_directory = 1;
}
message DirectRestoreReady {}
message StagedCheckpointDirectory
{
  optional string image_directory = 1;
}
message CommitComplete {}
// Confirms only that PageBroker transaction state/content was released; it says nothing about the target
// process or CUDA state.
message AbortComplete {}
message Failure
{
  enum Code {
    // No failure code was supplied.
    UNSPECIFIED = 0;
    // The request is malformed or unsupported. PageBroker did not mutate transaction state.
    INVALID_REQUEST = 1;
    // The transaction is unknown or has reached the opposite terminal state.
    TRANSACTION_NOT_FOUND = 2;
    // The transaction ID or checkpoint destination conflicts with an existing transaction or output.
    TRANSACTION_CONFLICT = 3;
    // Tmpfs staging lacks space. PageBroker did not create staging for this request.
    INSUFFICIENT_STORAGE = 4;
    // Storage I/O failed. The caller may Abort the transaction before retrying with a new transaction ID.
    STORAGE_ERROR = 5;
    // An unexpected broker failure occurred. The caller may Abort the transaction before retrying.
    INTERNAL_ERROR = 6;
  }
  optional Code code = 1;
  optional string message = 2;
}
message Response
{
  optional string request_id = 1;
  optional string transaction_id = 2;
  oneof result
  {
    StagedRestoreDirectory staged_restore_directory = 3;
    StagedCheckpointDirectory staged_checkpoint_directory = 4;
    CommitComplete commit_complete = 5;
    AbortComplete abort_complete = 6;
    Failure failure = 7;
    DirectRestoreReady direct_restore_ready = 8;
    // The connection is now allocation-only, not a general broker capability.
    AllocationSessionReply allocation_session = 9;
  }
}
