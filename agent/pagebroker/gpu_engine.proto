syntax = "proto3";
package snapshot.pagebroker.internal;
import "v1/pagebroker.proto";

// Private CPU broker -> GPU engine protocol. Admission transfers a session
// socket and the pinned storage directory via SCM_RIGHTS, in that order.
message NativeBinding {
  v1.BindNativeSession binding = 1;
  uint32 host_pid = 2;
  // LOAD only. The broker reads and size-checks the participant manifest when
  // the session is bound, before CRIU and before any participant transfers, so
  // PREPARE does no storage metadata I/O behind other participants' reads.
  LoadManifest load_manifest = 3;
}
message LoadManifest {
  repeated LoadExtent extents = 1;
}
message LoadExtent {
  string source_uuid = 1;
  uint64 size = 2;
  string filename = 3;
}
message NativeCommand {
  oneof command {
    v1.NativeSessionRequest execute = 1;
    // Finish an already completed session, or cancel an incomplete one.
    // The reply acknowledges that native mappings and file I/O have drained.
    bool drain = 2;
  }
}
