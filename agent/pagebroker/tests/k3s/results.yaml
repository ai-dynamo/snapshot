apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pagebroker-smoke-results
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pagebroker-smoke-results
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: results
      image: local/pagebroker-smoke:replace-before-use
      imagePullPolicy: Never
      command: [python3, -c, "import time; time.sleep(86400)"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
      volumeMounts:
        - {name: results, mountPath: /results, readOnly: true}
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: pagebroker-smoke-results
